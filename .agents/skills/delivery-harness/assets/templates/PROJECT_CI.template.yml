name: project-ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      # Do not assume a run-branch prefix; verify every pushed branch.
      - '**'

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Add the repo-specific runtime setup steps here.

      - name: Run required verification
        run: <verification-command>

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      E2E_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_HEAD_SHA }}

      # Add the same repo-specific runtime and service setup used by the target environment.

      - name: Run automated E2E
        run: <e2e-command>

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ env.E2E_HEAD_SHA }}
          path: <e2e-artifact-path>
          if-no-files-found: error
