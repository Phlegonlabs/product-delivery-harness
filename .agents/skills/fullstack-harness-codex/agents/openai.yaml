interface:
  display_name: "Harness Codex Adapter"
  short_description: "Run Harness missions from a Codex host"
  default_prompt: >-
    Use $fullstack-harness-codex with the shared Harness core for a Codex-hosted large run.
    Discover lazy-loaded Codex project/thread tools before declaring app_threads unavailable.
    Preserve the target repository's branch and integration rules, and prefer one top-level
    left-sidebar Codex task with its own app-managed worktree from the resolved integration
    branch per selected mission. Nested read-only helpers are optional at the policy level: omit or disable the policy to run with no helper and parent/graph review. If explicitly enabled
    after exact worker:<id> spawn authorization, the task must launch its reviewer child and return
    a completed exact-head PASS; other helper lanes remain optional. The outer task follows its required_actions exactly;
    immediately before a child launch, the parent separately verifies an
    exact spawn_subagents grant for the child target, otherwise the policy is disabled and
    parent/graph review takes over. Regardless of nested policy, the parent/review graph must still
    produce a terminal exact-head PASS before integration. A run ends when the verified integration head is pushed to
    the run's own branch; landing that branch on the default branch is the user's own step and
    the harness never starts a promotion, with or without approval. Never replace requested top-level tasks
    with coordinator-owned subagents.
policy:
  allow_implicit_invocation: true
