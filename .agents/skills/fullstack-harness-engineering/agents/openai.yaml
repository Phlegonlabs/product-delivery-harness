interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to classify the project as small or large. Keep small work direct. For large work, preserve the target repository's branch and integration rules, select authorized ready nodes, create each mission worktree from the recorded integration head, require an exact-head read-only review, and integrate passing work only back into that branch. When the repository defines no other model, cut the run's own codex/<short-name> branch from the current default branch; the run is complete once that branch is pushed, and landing it on the default branch is the user's own step — the harness opens no pull request, merges nothing, and deploys nothing. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed."
policy:
  allow_implicit_invocation: true
