interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to classify the project as small or large. Keep small work direct. For large work, freeze the necessary inputs, create compact PLAN/RUN state, select authorized ready nodes, verify parent-observed results, and integrate passing work. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed. Load $fullstack-harness-github-landing only for an explicitly requested remote outcome."
policy:
  allow_implicit_invocation: true
