interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to classify the project as small or large. Keep small work direct. For large work, preserve the target repository's branch and landing rules, select authorized ready nodes, create each mission worktree from the resolved integration branch, require an exact-head read-only review, and integrate passing work only back into that branch. When the repository defines no other model, treat main as the only persistent branch and cut the run's own codex/<short-name> branch from it; the run is complete once that branch is pushed, and landing it on main is a separate pull request the user asks for and the user merges. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed."
policy:
  allow_implicit_invocation: true
