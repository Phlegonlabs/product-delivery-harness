interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to begin with the parent-only, read-only System Review And Route stage and classify the project as small or large. Before that stage completes, do not load task-specific skills or an adapter, choose a model, create PLAN/RUN, preflight workers, invoke an external runtime, or spawn a worker. Keep small work direct with no PLAN/RUN. For large work, create PLAN schema v5 plus RUN schema v10, preserve the target repository's branch and integration rules, select authorized ready nodes, create each mission worktree from the recorded integration head, require an exact-head read-only review, and integrate passing work only back into that branch. If no agent capability is available, keep each PLAN mission executor: runtime_worker and record a parent-owned executor/worker binding in RUN solely for lease/state validation with worker_runtime: parent, parent_managed_worktree, and agent_result. This is not a delegated or spawned worker, requires no spawn_subagents, and blocks when its required parent-managed worktree is unavailable or unauthorized. When the repository defines no other model, cut the run's own codex/<short-name> branch from the current default branch; the run is complete once that branch is pushed, and landing it on the default branch is the user's own step — the harness opens no pull request, merges nothing, and deploys nothing. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed after routing."
policy:
  allow_implicit_invocation: true
