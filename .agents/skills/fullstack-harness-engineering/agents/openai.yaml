interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to classify the project as small or large. Keep small work direct. For large work, select authorized ready nodes, create each mission worktree from development, require an exact-head read-only review, and integrate passing work only back into development. Never start ordinary work from production; begin development-to-production promotion only after final user approval. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed."
policy:
  allow_implicit_invocation: true
