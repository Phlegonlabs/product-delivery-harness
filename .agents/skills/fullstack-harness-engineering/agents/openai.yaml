interface:
  display_name: "Full-Stack Harness Engineering"
  short_description: "Plan and run up to three isolated verified missions"
  default_prompt: "Use $fullstack-harness-engineering to plan traceable delivery, proactively detect the current runtime before work, and after Plan Readiness automatically select and launch up to three authorized nonconflicting missions in isolated workers. For Codex app fan-out, create one worktree thread per selected mission. Validate and integrate them serially, then continue automatically through Draft PR, current-head CI, review, and exact-head merge when those landing actions are separately authorized."
policy:
  allow_implicit_invocation: true
