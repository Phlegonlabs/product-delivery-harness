interface:
  display_name: "Full-Stack Harness Engineering"
  short_description: "Plan, verify, and land delivery through reviewed PRs"
  default_prompt: "Use $fullstack-harness-engineering to plan traceable delivery and run verified missions. For an authorized app-task wave, create one worktree thread per selected mission, require bounded read-only multi-agent work inside each non-trivial mission thread, poll and validate every result, then integrate serially. When every remaining branch/commit/push/PR/review/merge mutation is authorized, continue automatically through Draft PR, current-head CI, Codex review, zero unresolved threads, exact-head squash auto-merge, and merged-state confirmation. Preserve separate authorization for every action, repository configuration, deploy, and cleanup."
policy:
  allow_implicit_invocation: true
