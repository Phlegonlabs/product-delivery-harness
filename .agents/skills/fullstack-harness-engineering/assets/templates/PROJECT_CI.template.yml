name: project-ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - <base-branch>

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Add the repo-specific runtime setup steps here.

      - name: Run required verification
        run: <verification-command>

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Add the same repo-specific runtime and service setup used by the target environment.

      - name: Run automated E2E
        run: <e2e-command>

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}
          path: <e2e-artifact-path>
          if-no-files-found: error
