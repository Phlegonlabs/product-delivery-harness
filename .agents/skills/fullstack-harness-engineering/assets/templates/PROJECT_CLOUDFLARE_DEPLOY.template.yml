name: cloudflare-deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Exact Cloudflare target
        required: true
        type: choice
        options:
          - development
          - production
      source_sha:
        description: Full lowercase Git commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ inputs.target_environment }}
  cancel-in-progress: ${{ inputs.target_environment == 'development' }}

jobs:
  deploy:
    name: deploy-${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.target_environment }}
    env:
      CLOUDFLARE_ENV: ${{ inputs.target_environment }}
      DEPLOY_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate deployment input
        shell: bash
        run: |
          if [[ ! "$DEPLOY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi

      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_SOURCE_SHA }}

      - name: Require production source to equal origin/<base-branch>
        if: inputs.target_environment == 'production'
        shell: bash
        run: |
          git fetch origin <base-branch>
          if [[ "$(git rev-parse origin/<base-branch>)" != "$DEPLOY_SOURCE_SHA" ]]; then
            echo "production source_sha is not the current origin/<base-branch>" >&2
            exit 1
          fi

      # Add the repo-specific runtime setup and deterministic build steps here.

      # Include this step only when the PLAN-v5 target classifies a migration and commands.migrate is non-null.
      # A null migration_classification is unresolved and blocks dispatch.
      - name: Apply target migrations
        run: <migration-command>

      - name: Deploy exact Cloudflare environment
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured as secrets on the
          # "cloudflare-development" and "cloudflare-production" GitHub Environments this workflow
          # dispatches against (see the `environment:` field on the job above) before this can run.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: <app-directory>
          command: deploy --env ${{ inputs.target_environment }}

      - name: Run deployed-environment verification
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
          DEPLOYMENT_COMMAND_OUTPUT: ${{ steps.cloudflare-deploy.outputs.command-output }}
        run: <deployed-environment-verification-command>

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-${{ inputs.target_environment }}-${{ env.DEPLOY_SOURCE_SHA }}
          path: <deployment-evidence-path>
          if-no-files-found: error
