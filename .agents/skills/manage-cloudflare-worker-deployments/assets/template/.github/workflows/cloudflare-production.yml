name: Cloudflare production Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker
    if: github.event.inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    environment: "production"
    concurrency:
      group: cloudflare-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep this step when the selected install/build/Wrangler commands use Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Enable Corepack
        run: corepack enable

      - name: Install, verify, and build
        run: node scripts/cloudflare-branch-worker.mjs production-prepare

      - name: Deploy production Worker
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-branch-worker.mjs production-deploy

      - name: Publish deployment summary
        env:
          WORKER_NAME: ${{ steps.deploy.outputs.worker_name }}
        run: |
          echo "### Cloudflare production Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$WORKER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
