interface:
  display_name: "PRD Builder"
  short_description: "Create PRDs, architecture, and wireframes"
  default_prompt: "Use $prd-builder to turn this product idea into a complete PRD package with architecture and simple low-fidelity wireframes that ask for the intended interface style or record a provisional modern-minimal assumption. Before wireframing a UI-bearing product, ask the human builder or product/design decision owner for a concrete Builder UX Direction covering experience priority, guidance versus expert control, information density, preferred layout/interaction pattern, confirmation/recovery, and validation depth; mark choices selected, provisional, or assumed, and state that builder preference is not usability proof. Mint stable PRD, ARCH, UI, UX, and TEST trace IDs across the package. Keep an always-present measurable Non-Functional Requirements table after Functional Requirements and an always-present Test Obligations table after Open Questions. Map every Must functional requirement and every applicable NFR to a required TEST row with upstream trace IDs and an observable expected signal; reuse those TEST IDs in an optional implementation plan, and preserve them during enhancements. Keep task-fit layout patterns, KISS landing-page wireframes, exact UI wording or bounded display contracts for every visible region, explicit style/image/media/motion labels, restrained container use, and an explicit or recommended frontend stack when the product has a browser surface. For every deployable web, API, mobile, or desktop surface, record a complete expected deployable-surface inventory with stable surface IDs and provider-neutral release targets with stable IDs and development/production stage. Keep stable surface identity separate from stage-specific provider, allow providers to differ by stage, reject missing expected surfaces, and use only PLAN-v5 source policies (`pr_head` or `integration_head` for development; `merged_main` for production). Record a signed-tag or other unsupported source requirement as an unresolved engineering-handoff gap. Also record artifact kind, signing requirement, exact channel/track, submission/promotion/review or manual-approval path, actual availability signal, rollout, and rollback or forward-fix. Upload, submission, or approval is not availability; native recovery may require rollout halt plus a signed forward-fix, and native targets do not belong in the hosted web environment table. For deployable web, API, or hosted backend targets, resolve the deployment platform via AskUserQuestion (Cloudflare, Vercel, AWS, Self-hosted, or Other) unless the user or repository already names one, then record one codebase promoted through isolated development and production environments for that platform. Local persistence or local-only auth can require backend analysis without a hosted deployable surface and must not trigger a deployment-platform decision. For a product with a backend, persistent data, or auth requirement, resolve the database category (Relational, Document, Key-value or cache only, or None) and auth strategy (Build custom, Managed third-party provider, Platform-native, or No auth needed) via AskUserQuestion unless the user or repository already names them, then record service topology first (monolith versus named services and monorepo versus polyrepo), followed by backend runtime, database engine, and auth provider as separate layers. In every frontend, backend, and mobile/desktop stack row include Selection, Status, cited Authority/evidence, Why it fits, and Constraint/follow-up; sections may mix statuses, and authority is a source rather than a status. Validate in staging and never overwrite, move, or archive existing documents without exact user authorization."
