interface:
  display_name: "PRD Builder"
  short_description: "Create PRDs, architecture, and wireframes"
  default_prompt: "Use $prd-builder to turn this product idea into a complete PRD package with architecture and simple low-fidelity wireframes that ask for the intended interface style or record a provisional modern-minimal assumption. Before wireframing a UI-bearing product, ask the human builder or product/design decision owner for a concrete Builder UX Direction covering experience priority, guidance versus expert control, information density, preferred layout/interaction pattern, confirmation/recovery, and validation depth; mark choices selected, provisional, or assumed, and state that builder preference is not usability proof. Mint stable PRD, ARCH, UI, UX, and TEST trace IDs across the package. Keep task-fit layout patterns, KISS landing-page wireframes, exact UI wording or bounded display contracts for every visible region, explicit style/image/media/motion labels, restrained container use, and an explicit or recommended frontend stack when the product has a browser surface. For deployable products, resolve the deployment platform via AskUserQuestion (Cloudflare, Vercel, AWS, Self-hosted, or Other) unless the user or repository already names one, then record one codebase promoted through isolated development and production environments for that platform. For a product with a backend, persistent data, or auth requirement, resolve the database category (Relational, Document, Key-value or cache only, or None) and auth strategy (Build custom, Managed third-party provider, Platform-native, or No auth needed) via AskUserQuestion unless the user or repository already names them, then record the backend runtime, database engine, and auth provider as separate recommended or selected layers. Validate in staging and never overwrite, move, or archive existing documents without exact user authorization."
