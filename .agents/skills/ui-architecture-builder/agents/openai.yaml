interface:
  display_name: "UI Architecture Builder"
  short_description: "Specify a full UI architecture: layers, registry, recipes, mockups"
  default_prompt: >-
    Use $ui-architecture-builder to turn product docs into a UI architecture specification a human and an agent can both build against.
    Resolve the target platform first, preserve the PRD and low-fidelity wireframes as the authority for product scope, structure, content, actions, states, and trace IDs, and keep Builder UX Direction decisions marked selected, provisional, or assumed.
    When frontend-design is loaded and explicitly authorized, run Frontend Design Preference & HTML Exploration: freeze only the product hard limits, then use frontend-design's Purpose, Tone, Constraints, and Differentiation criteria to derive product-specific visual preference choices for the host Ask User tool; never present a fixed style catalog or ask the user to choose tokens.
    Use the resulting non-binding Visual Preference Brief and the same one or two representative UI IDs to invoke frontend-design separately for exactly two or three materially different, complete dependency-free HTML directions.
    Require page-scope directions to differ structurally rather than sharing one hero/feature/CTA skeleton.
    When the separate hallmark skill is loaded, use it only as the read-only structural-variety and anti-slop auditor: save one audit report beside each candidate, route critical and major repairs back through that candidate's frontend-design execution, and never let Hallmark choose the human's direction or create canonical tokens.
    Make every direction directly reviewable, ask the human owner to select, reject, or mix them, consolidate any mix under visual-directions/selected/, audit the selected HTML when Hallmark is available, and require explicit human approval of an ordered per-screen path/SHA-256 manifest plus approval_manifest_sha256. Before Dynamic Workflow launch, require the parent to verify every selected file's bytes and recompute the manifest digest; the workflow recomputes that digest again. Agent or delegated selection and path-only approval do not unlock extraction.
    Only after approval, extract repeated actual values and patterns from the byte-bound selected HTML into semantic tokens, closed primitive variants, product components, motion variants, page recipes, ui-registry.json, and final mockups.
    Candidate-local values are allowed before extraction. Rejected candidates do not enter the system. Final mockups must reproduce the approved selected HTML, and any material repair requires fresh approval.
    Publish ui-architecture.md, ui-registry.json, page-recipes.md, design-system.md as the semantic source, docs/product/design/design-system.html as a projection rather than a second authority, one dependency-free mockups/*.html per route, mockups/catalog.html, and visual-acceptance.md.
    Match platform conventions, icon family, component-code language, and responsive vocabulary; preserve upstream PRD, ARCH, UI, UX, and TEST IDs and mint stable DS IDs.
    Produce a concrete taste and anti-slop review that keeps landing pages KISS, preserves exact wording or bounded display contracts, defaults ordinary regions to open layouts, avoids nested frames and decorative accent rails, and provides runnable motion demos when requested.
    In enhancement mode, freeze the existing package as the enhancement baseline, ask delta-only questions, preserve untouched artifacts and decisions, apply only accepted add/modify/remove delta, and do not run the fresh-generation workflow.
    Run technical discovery in at most three dependency waves of at most four closed choices each: platform-independent decisions, conditional platform resolution, then platform-specific styling and runtime choices.
    Use the host's structured closed-choice facility when available; otherwise present numbered choices including Other without silently selecting a default.
    Validate the complete package in staging. Never overwrite, move, or archive existing artifacts without exact user authorization.
    After publication, offer $fullstack-harness-engineering as the implementation handoff and do not invoke it without an explicit yes.
