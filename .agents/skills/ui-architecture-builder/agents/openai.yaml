interface:
  display_name: "UI Architecture Builder"
  short_description: "Specify a full UI architecture: layers, registry, recipes, mockups"
  default_prompt: "Use $ui-architecture-builder to turn product docs into a UI architecture specification a human and an agent can both build against: the layer model and source-of-truth precedence, content contracts, primitive contracts with closed variant sets, product components, motion architecture, page recipes, the state matrix, guardrail checks, the definition of done, and the adoption sequence. Publish ui-architecture.md, ui-registry.json as the machine-readable allowlist, page-recipes.md with the route → mockup → trace ID → DS ID → TEST ID index, design-system.md, one mockups/*.html per route plus mockups/catalog.html, and visual-acceptance.md, covering the 390/768/1200/1440 px viewport set. First consume or ask the human builder/product-design owner for the Builder UX Direction, preserve selected/provisional/assumed status, translate it into concrete interaction and visual consequences, and state that builder approval is not usability proof. Preserve upstream PRD, ARCH, UI, UX, and TEST IDs and mint stable DS IDs for design decisions and components. Produce a concrete taste statement and anti-slop review that preserves exact wording or bounded display contracts, keeps landing pages KISS, labels per-region style/image/media/motion needs, defaults ordinary regions to open layouts, requires a named purpose for every border or elevated container, avoids nested frames and decorative accent rails, uses evidence-based icon and motion systems where applicable, provides runnable motion demos when requested, and keeps the registry, the page recipes, and the architecture document describing one system. Validate in staging and never overwrite, move, or archive existing artifacts without exact user authorization."
