name: product-delivery-harness

on:
  pull_request:
  merge_group:
  push:
    branches:
      # Governance allows any explicitly named non-default run branch, so
      # verify every pushed branch — same filter the project template pins.
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      VALIDATED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VALIDATED_HEAD_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser test dependency
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Validate Agent Skills specification compliance
        run: python skills/delivery-harness/scripts/check_skill_spec.py

      - name: Check for dead code with pyflakes
        run: |
          python -m pyflakes skills/delivery-harness/scripts skills/product-definition-builder/scripts skills/ui-design-builder/scripts skills/design-system-compiler/scripts skills/product-activation/scripts skills/seo-growth-review/scripts

      - name: Report docs weight delta
        run: python skills/delivery-harness/scripts/docs_weight.py

      - name: Run harness unit, contract, and E2E tests
        run: python -m unittest discover -s skills/delivery-harness/scripts/tests -v

      - name: Run golden-path cross-skill test
        env:
          HARNESS_GOLDEN_PATH: "1"
        run: python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_golden_path.py" -v

      - name: Run product definition builder contract tests
        run: python -m unittest discover -s skills/product-definition-builder/scripts/tests -v

      - name: Run UI design builder contract tests
        env:
          PDH_REQUIRE_BROWSER_TESTS: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: python -m unittest discover -s skills/ui-design-builder/scripts/tests -v

      - name: Run design system compiler contract tests
        run: python -m unittest discover -s skills/design-system-compiler/scripts/tests -v

      - name: Run product activation contract tests
        run: python -m unittest discover -s skills/product-activation/scripts/tests -v

      - name: Run SEO growth review contract tests
        run: python -m unittest discover -s skills/seo-growth-review/scripts/tests -v

      - name: Check diff whitespace
        run: |
          base="origin/main"
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            base="${{ github.event.before }}"
          fi
          git diff --check "$base...HEAD"

  windows-hardening:
    name: windows-hardening
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness test dependencies
        shell: pwsh
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run native runtime, Git, parity, transition and context tests
        shell: pwsh
        run: |
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_skill_contract.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_host_verifier_runtime.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_verifier_runtime.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_harness_git.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_parity_capture.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_node_transitions.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_configure_project_context.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_write_path_transitions.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_archive_run.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_trusted_host_publication.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_harness_strict_authority.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_install_script.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s skills/design-system-compiler/scripts/tests -p "test_check_design_system_pair.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify PowerShell installer syntax and dependency check route
        shell: pwsh
        run: |-
          # GitHub's pwsh shell forces ErrorActionPreference to Stop, which
          # kills this step on the first captured stderr record from the
          # dependency check; the explicit throws below decide failure.
          $ErrorActionPreference = "Continue"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "install.ps1 parse failed" }
          $dependencyCheck = & pwsh -NoProfile -File ./install.ps1 -CheckDependencies -Destination "$env:RUNNER_TEMP/pdh-skills" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "dependency check unexpectedly passed on an empty destination" }
          if (($dependencyCheck -join "`n") -notmatch "frontend-design" -or
              ($dependencyCheck -join "`n") -notmatch "impeccable") {
            throw "dependency check did not report both required external UI skills"
          }
          # The dependency failure was expected; do not propagate its exit code.
          exit 0
