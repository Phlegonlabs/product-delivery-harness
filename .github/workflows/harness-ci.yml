name: product-delivery-harness

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      base_sha:
        description: Full 40-character ancestor commit from which the release changed
        required: true
        type: string

permissions:
  contents: read

# Push events are deliberately absent: a candidate is verified once by its
# pull_request run. Manual releases are grouped by immutable SHA, so later
# branch pushes cannot cancel or replace an exact-candidate release run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'workflow_dispatch' && inputs.candidate_sha ||
    github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      DIFF_BASE_SHA: >-
        ${{
        github.event_name == 'workflow_dispatch' && inputs.base_sha ||
        github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
        github.event.merge_group.base_sha
        }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify canonical checked-out candidate
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CANDIDATE_SHA must be a full lowercase commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Validate Agent Skills specification compliance
        run: python skills/delivery-harness/scripts/check_skill_spec.py

      - name: Check for dead code with pyflakes
        run: |
          python -m pyflakes skills/delivery-harness/scripts skills/product-definition-builder/scripts skills/ui-design-builder/scripts skills/design-system-compiler/scripts skills/product-activation/scripts skills/seo-growth-review/scripts

      - name: Report docs weight delta
        run: python skills/delivery-harness/scripts/docs_weight.py

      - name: Check candidate diff against a meaningful base
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            diff_base="$DIFF_BASE_SHA"
          else
            diff_base="$(git merge-base "$DIFF_BASE_SHA" "$actual_sha")"
          fi
          git diff --check "$diff_base" "$actual_sha"

  linux-harness:
    name: linux-harness-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run Harness shard
        run: |
          shard_files="$(python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform linux --shard-count 4 --shard-index '${{ matrix.shard }}' --format names)"
          test -n "$shard_files"
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            suite_log="$RUNNER_TEMP/pdh-linux-${{ matrix.shard }}-$test_file.log"
            set +e
            python -m unittest discover -s skills/delivery-harness/scripts/tests -p "$test_file" -v 2>&1 | tee "$suite_log"
            suite_status="${PIPESTATUS[0]}"
            set -e
            if [ "$suite_status" -ne 0 ]; then
              exit "$suite_status"
            fi
            grep -Eq '^Ran [1-9][0-9]* tests?' "$suite_log"
          done <<< "$shard_files"

  linux-other:
    name: linux-other-suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run Product Definition suite
        run: python -m unittest discover -s skills/product-definition-builder/scripts/tests -v

      - name: Run Activation suite
        run: python -m unittest discover -s skills/product-activation/scripts/tests -v

      - name: Run SEO suite
        run: python -m unittest discover -s skills/seo-growth-review/scripts/tests -v

  linux-browser:
    name: linux-required-browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Set up Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser test dependency
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run required browser UI suite
        env:
          PDH_REQUIRE_BROWSER_TESTS: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: python -m unittest discover -s skills/ui-design-builder/scripts/tests -v

      - name: Run browser-capable Design System suite
        env:
          PDH_REQUIRE_BROWSER_TESTS: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: python -m unittest discover -s skills/design-system-compiler/scripts/tests -v

  golden-path:
    name: golden-path-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run golden-path cross-skill test
        env:
          HARNESS_GOLDEN_PATH: "1"
        run: python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_golden_path.py" -v

  macos-native:
    name: macos-native
    runs-on: macos-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Prefer system Git
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve temp root
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)/" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run native Harness files
        run: |
          shard_files="$(python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform macos --shard-count 1 --shard-index 0 --format names)"
          test -n "$shard_files"
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            suite_log="$RUNNER_TEMP/pdh-macos-$test_file.log"
            set +e
            python -m unittest discover -s skills/delivery-harness/scripts/tests -p "$test_file" -v 2>&1 | tee "$suite_log"
            suite_status="${PIPESTATUS[0]}"
            set -e
            if [ "$suite_status" -ne 0 ]; then
              exit "$suite_status"
            fi
            grep -Eq '^Ran [1-9][0-9]* tests?' "$suite_log"
          done <<< "$shard_files"

      - name: Run golden-path cross-skill test
        env:
          HARNESS_GOLDEN_PATH: "1"
        run: python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_golden_path.py" -v

      - name: Run native design-system contract
        run: python -m unittest discover -s skills/design-system-compiler/scripts/tests -p "test_check_design_system_pair.py" -v

  windows-native:
    name: windows-native-${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        shell: pwsh
        run: if ("$(git rev-parse HEAD)" -ne $env:CANDIDATE_SHA) { throw "checked-out SHA does not match candidate" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        shell: pwsh
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run native Harness shard
        shell: pwsh
        run: |
          $planJson = python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform windows --shard-count 4 --shard-index '${{ matrix.shard }}' --format json
          $plannerStatus = $LASTEXITCODE
          if ($plannerStatus -ne 0) {
            exit $plannerStatus
          }
          $plan = $planJson | ConvertFrom-Json
          if (-not $plan.files -or @($plan.files).Count -eq 0) { throw "measured shard is empty" }
          foreach ($testFile in $plan.files) {
            $suiteLog = Join-Path $env:RUNNER_TEMP "pdh-windows-${{ matrix.shard }}-$testFile.log"
            & python -m unittest discover -s skills/delivery-harness/scripts/tests -p $testFile -v *> $suiteLog
            $suiteStatus = $LASTEXITCODE
            if ($suiteStatus -ne 0) {
              Get-Content -LiteralPath $suiteLog
              exit $suiteStatus
            }
            $suiteSummary = Get-Content -LiteralPath $suiteLog -Tail 10
            $suiteSummary | ForEach-Object { "$_" }
            $hasRunSummary = Select-String -LiteralPath $suiteLog -Pattern '^Ran [1-9][0-9]* tests?' -Quiet
            if (-not $hasRunSummary) {
              throw "discovered test file ran zero tests: $testFile"
            }
          }

      - name: Run native design-system contract
        if: matrix.shard == 0
        shell: pwsh
        run: |
          python -m unittest discover -s skills/design-system-compiler/scripts/tests -p "test_check_design_system_pair.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  validate:
    name: validate
    needs:
      - quality
      - linux-harness
      - linux-other
      - linux-browser
      - golden-path
      - macos-native
      - windows-native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix result to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_HARNESS_RESULT: ${{ needs.linux-harness.result }}
          LINUX_OTHER_RESULT: ${{ needs.linux-other.result }}
          LINUX_BROWSER_RESULT: ${{ needs.linux-browser.result }}
          GOLDEN_PATH_RESULT: ${{ needs.golden-path.result }}
          MACOS_NATIVE_RESULT: ${{ needs.macos-native.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: |
          failed=0
          for result in "$QUALITY_RESULT" "$LINUX_HARNESS_RESULT" "$LINUX_OTHER_RESULT" "$LINUX_BROWSER_RESULT" "$GOLDEN_PATH_RESULT" "$MACOS_NATIVE_RESULT" "$WINDOWS_NATIVE_RESULT"; do
            if [ "$result" != success ]; then
              echo "required result: $result"
              failed=1
            fi
          done
          exit "$failed"
