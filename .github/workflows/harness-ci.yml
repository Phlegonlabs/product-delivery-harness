name: harness

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run harness tests
        run: python -m unittest discover -s .agents/skills/fullstack-harness-engineering/scripts/tests -v

      - name: Run design package contract tests
        run: python -m unittest discover -s .agents/skills/design-package-builder/scripts/tests -v

      - name: Run PRD builder contract tests
        run: python -m unittest discover -s .agents/skills/prd-builder/scripts/tests -v
