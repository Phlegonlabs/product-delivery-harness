name: harness

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      # A harness run ends by pushing its work branch, so verify that push too.
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      VALIDATED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VALIDATED_HEAD_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness test dependencies
        run: python -m pip install -r .agents/skills/full-harness/requirements-test.txt

      - name: Check generated plugin skill bundle
        run: python scripts/sync_plugin_skills.py --check

      - name: Run harness unit, contract, and E2E tests
        run: python -m unittest discover -s .agents/skills/full-harness/scripts/tests -v


      - name: Run PRD builder contract tests
        run: python -m unittest discover -s .agents/skills/prd-builder/scripts/tests -v

      - name: Run product design builder contract tests
        run: python -m unittest discover -s .agents/skills/product-design-builder/scripts/tests -v

      - name: Run packaged skill smoke tests
        run: python -m unittest discover -s plugins/fullstack-harness/skills/full-harness/scripts/tests -p "test_packaged_*.py" -v

      - name: Check diff whitespace
        run: |
          base="origin/main"
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            base="${{ github.event.before }}"
          fi
          git diff --check "$base...HEAD"
