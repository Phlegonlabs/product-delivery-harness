name: product-delivery-harness

on:
  pull_request:
  merge_group:
  push:
    branches:
      # Governance allows any explicitly named non-default run branch, so
      # verify every pushed branch — same filter the project template pins.
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      VALIDATED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VALIDATED_HEAD_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness test dependencies
        run: python -m pip install -r .agents/skills/delivery-harness/requirements-test.txt

      - name: Validate Agent Skills specification compliance
        run: python .agents/skills/delivery-harness/scripts/check_skill_spec.py

      - name: Check for dead code with pyflakes
        run: |
          python -m pyflakes .agents/skills/delivery-harness/scripts .agents/skills/product-definition-builder/scripts .agents/skills/design-system-compiler/scripts

      - name: Run harness unit, contract, and E2E tests
        run: python -m unittest discover -s .agents/skills/delivery-harness/scripts/tests -v

      - name: Run product definition builder contract tests
        run: python -m unittest discover -s .agents/skills/product-definition-builder/scripts/tests -v

      - name: Run design system compiler contract tests
        run: python -m unittest discover -s .agents/skills/design-system-compiler/scripts/tests -v

      - name: Check diff whitespace
        run: |
          base="origin/main"
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            base="${{ github.event.before }}"
          fi
          git diff --check "$base...HEAD"
