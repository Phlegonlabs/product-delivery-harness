name: product-delivery-harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      base_sha:
        description: Full 40-character ancestor commit from which the release changed
        required: true
        type: string

permissions:
  contents: read

# Feature pushes are deliberately absent: a feature branch is verified once by
# its pull_request run. Manual releases are grouped by immutable SHA, so later
# later branch pushes cannot cancel or replace an exact-candidate release run.
# Draft pull requests run only the Linux jobs and report validate-draft. Ready
# pull requests, main, merge queue and manual releases run every job and report
# the required validate check, so only a complete run can satisfy the ruleset.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'workflow_dispatch' && inputs.candidate_sha ||
    github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      DIFF_BASE_SHA: >-
        ${{
        github.event_name == 'workflow_dispatch' && inputs.base_sha ||
        github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
        github.event_name == 'merge_group' && github.event.merge_group.base_sha ||
        github.event.before
        }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify canonical checked-out candidate
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CANDIDATE_SHA must be a full lowercase commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Validate Agent Skills specification compliance
        run: python skills/delivery-harness/scripts/check_skill_spec.py

      - name: Check for dead code with pyflakes
        run: |
          python -m pyflakes skills/delivery-harness/scripts skills/product-definition-builder/scripts skills/ui-design-builder/scripts skills/design-system-compiler/scripts skills/product-activation/scripts skills/seo-growth-review/scripts

      - name: Report docs weight delta
        run: python skills/delivery-harness/scripts/docs_weight.py

      - name: Check candidate diff against a meaningful base
        run: |
          actual_sha="$(git rev-parse HEAD)"
          diff_base="$(python skills/delivery-harness/scripts/ci_diff_base.py resolve --event "$GITHUB_EVENT_NAME" --candidate "$CANDIDATE_SHA" --base "${DIFF_BASE_SHA:-}")"
          git diff --check "$diff_base" "$actual_sha"

  linux-harness:
    name: linux-harness-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run measured Harness shard
        run: |
          shard_files="$(python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform linux --shard-count 4 --shard-index '${{ matrix.shard }}' --timings skills/delivery-harness/ci-test-timings.json --allow-unmeasured --format names)"
          test -n "$shard_files"
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            suite_log="$RUNNER_TEMP/pdh-linux-${{ matrix.shard }}-$test_file.log"
            set +e
            python -m unittest discover -s skills/delivery-harness/scripts/tests -p "$test_file" -v 2>&1 | tee "$suite_log"
            suite_status="${PIPESTATUS[0]}"
            set -e
            if [ "$suite_status" -ne 0 ]; then
              exit "$suite_status"
            fi
            grep -Eq '^Ran [1-9][0-9]* tests?' "$suite_log"
          done <<< "$shard_files"

  linux-other:
    name: linux-other-suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run Product Definition suite
        run: python -m unittest discover -s skills/product-definition-builder/scripts/tests -v

      - name: Run Activation suite
        run: python -m unittest discover -s skills/product-activation/scripts/tests -v

      - name: Run SEO suite
        run: python -m unittest discover -s skills/seo-growth-review/scripts/tests -v

  linux-browser:
    name: linux-required-browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Set up Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser test dependency
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run required browser UI suite
        env:
          PDH_REQUIRE_BROWSER_TESTS: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: python -m unittest discover -s skills/ui-design-builder/scripts/tests -v

      - name: Run browser-capable Design System suite
        env:
          PDH_REQUIRE_BROWSER_TESTS: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: python -m unittest discover -s skills/design-system-compiler/scripts/tests -v

  golden-path:
    name: golden-path-${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["linux"]' || '["linux", "macos"]') }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Prefer system Git
        if: matrix.platform == 'macos'
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve macOS temp root
        if: matrix.platform == 'macos'
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)/" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run golden-path cross-skill test
        env:
          HARNESS_GOLDEN_PATH: "1"
        run: python -m unittest discover -s skills/delivery-harness/scripts/tests -p "test_golden_path.py" -v

  macos-harness:
    name: macos-harness-${{ matrix.shard }}
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Prefer system Git
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve temp root
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)/" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run measured Harness shard
        run: |
          shard_files="$(python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform macos --shard-count 4 --shard-index '${{ matrix.shard }}' --timings skills/delivery-harness/ci-test-timings.json --allow-unmeasured --format names)"
          test -n "$shard_files"
          while IFS= read -r test_file; do
            [ -n "$test_file" ] || continue
            suite_log="$RUNNER_TEMP/pdh-macos-${{ matrix.shard }}-$test_file.log"
            set +e
            python -m unittest discover -s skills/delivery-harness/scripts/tests -p "$test_file" -v 2>&1 | tee "$suite_log"
            suite_status="${PIPESTATUS[0]}"
            set -e
            if [ "$suite_status" -ne 0 ]; then
              exit "$suite_status"
            fi
            grep -Eq '^Ran [1-9][0-9]* tests?' "$suite_log"
          done <<< "$shard_files"

  macos-other:
    name: macos-other-suites
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Prefer system Git
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve temp root
        run: echo "TMPDIR=$(cd "$TMPDIR" && pwd -P)/" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run Product Definition suite
        run: python -m unittest discover -s skills/product-definition-builder/scripts/tests -v

      - name: Run UI design builder contract tests
        run: python -m unittest discover -s skills/ui-design-builder/scripts/tests -v

      - name: Run Design System suite
        run: python -m unittest discover -s skills/design-system-compiler/scripts/tests -v

      - name: Run Activation suite
        run: python -m unittest discover -s skills/product-activation/scripts/tests -v

      - name: Run SEO suite
        run: python -m unittest discover -s skills/seo-growth-review/scripts/tests -v

  windows-native:
    name: windows-native-${{ matrix.shard }}
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        shell: pwsh
        run: if ("$(git rev-parse HEAD)" -ne $env:CANDIDATE_SHA) { throw "checked-out SHA does not match candidate" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        shell: pwsh
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run measured native Harness shard
        shell: pwsh
        run: |
          $planJson = python skills/delivery-harness/scripts/ci_test_shards.py plan --suite harness --platform windows --shard-count 4 --shard-index '${{ matrix.shard }}' --timings skills/delivery-harness/ci-test-timings.json --allow-unmeasured --format json
          $plannerStatus = $LASTEXITCODE
          if ($plannerStatus -ne 0) {
            exit $plannerStatus
          }
          $plan = $planJson | ConvertFrom-Json
          if (-not $plan.files -or @($plan.files).Count -eq 0) { throw "measured shard is empty" }
          foreach ($testFile in $plan.files) {
            $suiteLog = Join-Path $env:RUNNER_TEMP "pdh-windows-${{ matrix.shard }}-$testFile.log"
            & python -m unittest discover -s skills/delivery-harness/scripts/tests -p $testFile -v *> $suiteLog
            $suiteStatus = $LASTEXITCODE
            if ($suiteStatus -ne 0) {
              Get-Content -LiteralPath $suiteLog
              exit $suiteStatus
            }
            $suiteSummary = Get-Content -LiteralPath $suiteLog -Tail 10
            $suiteSummary | ForEach-Object { "$_" }
            $hasRunSummary = Select-String -LiteralPath $suiteLog -Pattern '^Ran [1-9][0-9]* tests?' -Quiet
            if (-not $hasRunSummary) {
              throw "discovered test file ran zero tests: $testFile"
            }
          }

  windows-installer:
    name: windows-installer-and-native-contract
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        shell: pwsh
        run: if ("$(git rev-parse HEAD)" -ne $env:CANDIDATE_SHA) { throw "checked-out SHA does not match candidate" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/delivery-harness/requirements-test.txt

      - name: Install harness test dependencies
        shell: pwsh
        run: python -m pip install -r skills/delivery-harness/requirements-test.txt

      - name: Run native design-system contract
        shell: pwsh
        run: |
          python -m unittest discover -s skills/design-system-compiler/scripts/tests -p "test_check_design_system_pair.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify PowerShell installer syntax and dependency check route
        shell: pwsh
        run: |-
          # GitHub's pwsh shell forces ErrorActionPreference to Stop, which
          # kills this step on the first captured stderr record from the
          # dependency check; the explicit throws below decide failure.
          $ErrorActionPreference = "Continue"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "install.ps1 parse failed" }
          $dependencyCheck = & pwsh -NoProfile -File ./install.ps1 -CheckDependencies -Destination "$env:RUNNER_TEMP/pdh-skills" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "dependency check unexpectedly passed on an empty destination" }
          if (($dependencyCheck -join "`n") -notmatch "frontend-design" -or
              ($dependencyCheck -join "`n") -notmatch "impeccable") {
            throw "dependency check did not report both required external UI skills"
          }
          # The dependency failure was expected; do not propagate its exit code.
          exit 0

  validate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'validate-draft' || 'validate' }}
    needs:
      - quality
      - linux-harness
      - linux-other
      - linux-browser
      - golden-path
      - macos-harness
      - macos-other
      - windows-native
      - windows-installer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Require every selected matrix result to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_HARNESS_RESULT: ${{ needs.linux-harness.result }}
          LINUX_OTHER_RESULT: ${{ needs.linux-other.result }}
          LINUX_BROWSER_RESULT: ${{ needs.linux-browser.result }}
          GOLDEN_PATH_RESULT: ${{ needs.golden-path.result }}
          MACOS_HARNESS_RESULT: ${{ needs.macos-harness.result }}
          MACOS_OTHER_RESULT: ${{ needs.macos-other.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
          WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
          DRAFT_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          results=(
            --result "$QUALITY_RESULT"
            --result "$LINUX_HARNESS_RESULT"
            --result "$LINUX_OTHER_RESULT"
            --result "$LINUX_BROWSER_RESULT"
            --result "$GOLDEN_PATH_RESULT"
          )
          if [ "$DRAFT_PULL_REQUEST" != "true" ]; then
            results+=(
              --result "$MACOS_HARNESS_RESULT"
              --result "$MACOS_OTHER_RESULT"
              --result "$WINDOWS_NATIVE_RESULT"
              --result "$WINDOWS_INSTALLER_RESULT"
            )
          fi
          python skills/delivery-harness/scripts/ci_test_shards.py gate "${results[@]}"
