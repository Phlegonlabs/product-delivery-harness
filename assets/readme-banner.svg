<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Full Stack Harness</title>
  <desc id="desc">Private multi-runtime skill marketplace for Codex and Claude Code</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102343"/>
      <stop offset="1" stop-color="#1f153d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="120" r="230" fill="url(#glow)"/>
  <circle cx="160" cy="330" r="190" fill="#7c3aed" fill-opacity="0.08" filter="url(#softGlow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M790 79 H900 L950 129 H1094" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M760 176 H850 L905 231 H1086" stroke="#818cf8" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M802 282 H922 L972 232 H1110" stroke="#fb923c" stroke-opacity="0.78" stroke-width="3"/>
    <circle cx="790" cy="79" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="760" cy="176" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="802" cy="282" r="7" fill="#fb923c" stroke="none"/>
    <circle cx="1094" cy="129" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="1086" cy="231" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="1110" cy="232" r="7" fill="#fb923c" stroke="none"/>
  </g>

  <rect x="70" y="64" width="92" height="28" rx="14" fill="#0f2f4b" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="116" y="83" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">PRIVATE</text>

  <text x="70" y="159" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8">FULL STACK HARNESS</text>
  <rect x="70" y="180" width="620" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">One skill marketplace. Two agent runtimes.</text>
  <text x="70" y="273" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">CODEX MULTI-THREAD</text>
  <circle cx="289" cy="267" r="4" fill="#64748b"/>
  <text x="307" y="273" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">CLAUDE DYNAMIC WORKFLOW</text>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="2"/>
</svg>
