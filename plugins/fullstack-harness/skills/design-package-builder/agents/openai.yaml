interface:
  display_name: "Design Package Builder"
  short_description: "Create distinctive visual, icon, and motion systems"
  default_prompt: "Use $design-package-builder to turn product docs into a brand-specific design system. First consume or ask the human builder/product-design owner for the Builder UX Direction, preserve selected/provisional/assumed status, translate it into concrete interaction and visual consequences, and state that builder approval is not usability proof. Preserve upstream PRD, ARCH, UI, UX, and TEST IDs and mint stable DS IDs for design decisions and components. Produce a concrete taste statement and anti-slop review that preserves exact wording or bounded display contracts, keeps landing pages KISS, labels per-region style/image/media/motion needs, defaults ordinary regions to open layouts, requires a named purpose for every border or elevated container, avoids nested frames and decorative accent rails, uses evidence-based icon and motion systems where applicable, provides runnable motion demos when requested, and produces a UI package. Validate in staging and never overwrite, move, or archive existing artifacts without exact user authorization."
