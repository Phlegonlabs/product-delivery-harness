interface:
  display_name: "Harness Codex Adapter"
  short_description: "Run Harness missions from a Codex host"
  default_prompt: "Use $fullstack-harness-codex with the shared Harness core for a Codex-hosted large run. Discover lazy-loaded Codex project/thread tools before declaring app_threads unavailable. Prefer one top-level left-sidebar Codex task with its own development-based app-managed worktree per selected mission. Each task runs its own read-only Multi-agent reviewer and must pass exact-head review before parent integration into development. Never replace requested top-level tasks with coordinator-owned subagents, and never promote development to production before final user approval."
policy:
  allow_implicit_invocation: true
