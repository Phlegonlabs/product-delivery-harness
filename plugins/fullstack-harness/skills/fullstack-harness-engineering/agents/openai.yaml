interface:
  display_name: "Full-Stack Harness Engineering"
  short_description: "Plan, verify, and land delivery through reviewed PRs"
  default_prompt: "Use $fullstack-harness-engineering to plan traceable delivery and run verified missions. Detect and record the current runtime provider and available drivers, then route deterministically: Codex app threads, Claude Dynamic Workflow, direct subagents, or sequential parent fallback. For Codex app fan-out, create one worktree thread per selected mission. Consume every authorized wave through the selected driver, validate every result, and integrate serially. When every remaining branch/commit/push/PR/review/merge mutation is authorized, continue automatically through Draft PR, current-head CI, Codex review, zero unresolved threads, exact-head squash auto-merge, and merged-state confirmation. Preserve separate authorization for every action, repository configuration, deploy, and cleanup."
policy:
  allow_implicit_invocation: true
