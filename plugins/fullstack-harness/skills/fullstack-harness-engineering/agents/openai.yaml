interface:
  display_name: "Full-Stack Harness Core"
  short_description: "Plan, authorize, verify, and integrate delivery work"
  default_prompt: "Use $fullstack-harness-engineering to begin with the parent-only, read-only System Review And Route stage and classify the project as small or large. Before that stage completes, do not load task-specific skills or an adapter, choose a model, create PLAN/RUN, preflight workers, invoke an external runtime, or spawn a worker. Keep small work direct with no PLAN/RUN. For large work, create PLAN schema v5 plus RUN schema v10, preserve the target repository's branch and integration rules, select authorized ready nodes, create each mission worktree from the recorded integration head, require an exact-head read-only review, and integrate passing work only back into that branch. If no agent capability is available, use real sequential_parent execution with the parent as the sole writer, one mission at a time, and no spawn_subagents or invented worker identity. When the repository defines no other model, cut the run's own codex/<short-name> branch from the current default branch; the run is complete once that branch is pushed, and landing it on the default branch is the user's own step — the harness opens no pull request, merges nothing, and deploys nothing. Load only the active host adapter—$fullstack-harness-codex or $fullstack-harness-claude-code—when runtime orchestration is needed after routing."
policy:
  allow_implicit_invocation: true
