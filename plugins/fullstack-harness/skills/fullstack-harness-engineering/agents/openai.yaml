interface:
  display_name: "Full-Stack Harness Engineering"
  short_description: "Plan and run up to three isolated verified missions"
  default_prompt: "Use $fullstack-harness-engineering to plan traceable delivery. For UI-bearing work, require the human Builder UX Direction owner and selected/provisional/assumed decisions before implementation, map them to UX traces and validation depth, and keep builder direction conformance separate from representative-user usability evidence. Proactively detect the current runtime and at Plan Readiness request the exact launch, pull-request landing, and Cloudflare development/production deploy actions once when applicable, including manage_pr_review and merge_pr. Bind unborn PR review and merge targets to future-pr:<owner>/<repo>:base=<base-branch>:head=<head-branch>, then resolve them to the matching exact PR URL after creation. Automatically select and launch up to three authorized nonconflicting missions in isolated workers; for Codex app fan-out, create one worktree thread per selected mission. Integrate serially, then continue automatically through Draft PR, current-head CI, an isolated development Worker, Codex review, exact-head merge, and the production Worker without intermediate prompts when each separate ledger action is authorized."
policy:
  allow_implicit_invocation: true
