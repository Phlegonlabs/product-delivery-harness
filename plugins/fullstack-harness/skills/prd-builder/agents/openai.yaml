interface:
  display_name: "PRD Builder"
  short_description: "Create PRDs, architecture, and wireframes"
  default_prompt: "Use $prd-builder to turn this product idea into a complete PRD package with architecture and simple low-fidelity wireframes that ask for the intended interface style or record a provisional modern-minimal assumption. Before wireframing a UI-bearing product, ask the human builder or product/design decision owner for a concrete Builder UX Direction covering experience priority, guidance versus expert control, information density, interaction familiarity, layout preference, confirmation/recovery, and validation depth; mark choices selected, provisional, or assumed, and state that builder preference is not usability proof. Keep task-fit layout patterns, KISS landing-page wireframes, exact UI wording or bounded display contracts for every visible region, explicit style/image/media/motion labels, restrained container use, and an explicit or recommended frontend stack when the product has a browser surface. For deployable products, use the Cloudflare organization default unless the user or repository overrides it, with one codebase promoted through isolated development and production Workers."
