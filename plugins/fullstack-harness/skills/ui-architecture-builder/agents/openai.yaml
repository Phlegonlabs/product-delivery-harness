interface:
  display_name: "UI Architecture Builder"
  short_description: "Specify a full UI architecture: layers, registry, recipes, mockups"
  default_prompt: "Use $ui-architecture-builder to turn product docs into a UI architecture specification a human and an agent can both build against: the layer model and source-of-truth precedence, content contracts, primitive contracts with closed variant sets, product components, motion architecture, page recipes, the state matrix, guardrail checks, the definition of done, and the adoption sequence. Resolve the target platform first — web, native iOS, native Android, Flutter, React Native, macOS, Windows, or cross-platform desktop — from architecture.md's Product Archetype and stack-decisions.md's Frontend or Mobile/Desktop Technology Decision, and state it in the package. Every platform gets the same file set, but style each mockup to that platform's own conventions (iOS/macOS Human Interface Guidelines cues, Android Material cues, or desktop window chrome) instead of defaulting to web styling, and match the icon family, the reference component code language, and the responsive model to it. Publish ui-architecture.md, ui-registry.json as the machine-readable allowlist, page-recipes.md with the route → mockup → trace ID → DS ID → TEST ID index, design-system.md as the semantic source, docs/product/design/design-system.html as its dependency-free rendered projection, one mockups/*.html per route plus mockups/catalog.html, and visual-acceptance.md, covering the required responsive verification set: the 390/768/1200/1440 px viewport set for a web target, or the resolved platform's own size classes, safe areas, or named window sizes for a native or desktop target. Render docs/product/design/design-system.html from design-system.md plus ui-registry.json after both are stable: show typography/paragraphs, links, all button variants/states, forms and field messaging, cards/surfaces, navigation, alerts/status, icons, spacing/layout, colors/tokens, applicable motion, and responsive behavior, with the exact fields IDs, Parameters, States, Responsive, Accessibility, Use, and Do not use beside every specimen; IDs includes token IDs plus primitive/component and variant IDs as applicable. The HTML is never a second authority. First consume or ask the human builder/product-design owner for the Builder UX Direction, preserve selected/provisional/assumed status, translate it into concrete interaction and visual consequences, and state that builder approval is not usability proof. Before discovery, detect an existing same-product UI package; when present, freeze it as the enhancement baseline, ask delta-only questions, seed staging from it, preserve untouched IDs/content/artifacts/decisions and upstream TEST identities, apply only accepted add/modify/remove delta, preserve design-system.html when its rendered inputs are untouched or rebuild it only from accepted delta when they change, validate the complete revision, and keep package enhancement distinct from greenfield/phased-migration implementation adoption. Do not run the fresh-generation dynamic workflow in enhancement mode. Run discovery in at most three dependency waves of at most four closed-choice questions each: target and platform-independent decisions, conditional platform resolution, then platform-specific styling/theming/runtime plus remaining choices. Never ask styling or runtime while target/platform is unresolved. Use a structured closed-choice facility when available; otherwise use numbered choices including Other, without defaults or open-ended conversion. Skip every question the prompt, supplied documents, or frozen baseline already answers. Preserve upstream PRD, ARCH, UI, UX, and TEST IDs and mint stable DS IDs for design decisions and components. Produce a concrete taste statement and anti-slop review that preserves exact wording or bounded display contracts, keeps landing pages KISS, labels per-region style/image/media/motion needs, defaults ordinary regions to open layouts, requires a named purpose for every border or elevated container, avoids nested frames and decorative accent rails, uses evidence-based icon and motion systems where applicable, provides runnable motion demos when requested, and keeps the registry, the page recipes, and the architecture document describing one system. Validate in staging and require the conditional enhancement non-regression gate when a baseline exists. Never overwrite, move, or archive existing artifacts without exact user authorization. After the published package is complete, offer $fullstack-harness-engineering as the implementation handoff and do not invoke it without an explicit yes."
