name: project-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      # New main-preview/1 flow verifies protected main; PRs verify candidates.
      # Do not add '**': a feature branch is verified once by its pull request.
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to verify for release
        required: true
        type: string
      base_sha:
        description: Full 40-character ancestor commit from which the release changed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    project-ci-${{
    github.event_name == 'workflow_dispatch' && inputs.release_sha ||
    github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.draft && 'draft' || 'ready') ||
    github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.browsers.outputs.engines }}
      declared: ${{ steps.browsers.outputs.declared }}
    env:
      DIFF_BASE_SHA: >-
        ${{
        github.event_name == 'workflow_dispatch' && inputs.base_sha ||
        github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
        github.event_name == 'merge_group' && github.event.merge_group.base_sha ||
        github.event.before
        }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify canonical checked-out candidate
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CANDIDATE_SHA must be a full lowercase commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"

      - name: Resolve browser engines
        id: browsers
        run: python3 .github/scripts/browser_targets.py --prd docs/product/PRD.md --github-output "$GITHUB_OUTPUT"

      # Add the repo-specific runtime setup steps here.

      - name: Run required verification
        run: <verification-command>

      - name: Check candidate diff against a meaningful base
        run: |
          actual_sha="$(git rev-parse HEAD)"
          # Inline Git checks keep this template usable in a consumer checkout
          # with no bundled or installed Harness skills.
          require_commit() {
            if ! printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "$2 must be a full lowercase commit SHA" >&2
              return 1
            fi
            if ! resolved_sha="$(git rev-parse --verify "$1^{commit}")"; then
              echo "$2 does not resolve to a commit" >&2
              return 1
            fi
            if [ "$resolved_sha" != "$1" ]; then
              echo "$2 resolved to $resolved_sha, not its exact bytes" >&2
              return 1
            fi
            printf '%s\n' "$resolved_sha"
          }

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [ -n "$DIFF_BASE_SHA" ] || { echo "manual release requires base_sha" >&2; exit 1; }
              diff_base="$(require_commit "$DIFF_BASE_SHA" base_sha)" || exit 1
              [ "$diff_base" != "$actual_sha" ] || { echo "base_sha must differ from candidate_sha" >&2; exit 1; }
              git merge-base --is-ancestor "$diff_base" "$actual_sha" || {
                echo "base_sha is not an ancestor of candidate_sha" >&2
                exit 1
              }
              ;;
            pull_request|merge_group)
              [ -n "$DIFF_BASE_SHA" ] || { echo "$GITHUB_EVENT_NAME did not provide a base SHA" >&2; exit 1; }
              event_base="$(require_commit "$DIFF_BASE_SHA" base)" || exit 1
              [ "$event_base" != "$actual_sha" ] || { echo "base equals the candidate" >&2; exit 1; }
              diff_base="$(git merge-base "$event_base" "$actual_sha")" || {
                echo "base and candidate have no merge base" >&2
                exit 1
              }
              printf '%s' "$diff_base" | grep -Eq '^[0-9a-f]{40}$' || {
                echo "merge base is not a full commit SHA" >&2
                exit 1
              }
              ;;
            push)
              if [ -z "${DIFF_BASE_SHA:-}" ] ||
                 printf '%s' "$DIFF_BASE_SHA" | grep -Eq '^0{40}$'; then
                diff_base="$(git mktree </dev/null)" || exit 1
                [ -n "$diff_base" ] || { echo "Git returned an empty tree value" >&2; exit 1; }
              else
                diff_base="$(require_commit "$DIFF_BASE_SHA" "push base")" || exit 1
                [ "$diff_base" != "$actual_sha" ] || { echo "push base equals the candidate" >&2; exit 1; }
                git merge-base --is-ancestor "$diff_base" "$actual_sha" || {
                  echo "push base is not an ancestor of candidate_sha" >&2
                  exit 1
                }
              fi
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          git diff --check "$diff_base" "$actual_sha"

  e2e:
    needs: checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: e2e-${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.checks.outputs.engines) }}
    env:
      PLAYWRIGHT_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      # Add the same repo-specific runtime and service setup used by the target environment.

      - name: Install the browser engine
        if: needs.checks.outputs.declared == 'true'
        run: npx playwright install --with-deps "$PLAYWRIGHT_ENGINE"

      # A declared PRD selects the engine project, for example
      # npx playwright test --project="$PLAYWRIGHT_ENGINE".
      # An undeclared PRD keeps the existing command.
      - name: Run automated E2E
        run: <e2e-command>

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.engine }}-${{ env.CANDIDATE_SHA }}
          path: <e2e-artifact-path>
          if-no-files-found: error

  verify:
    # Keep this aggregate for branch protection. A draft pull request
    # reports verify-draft and requires E2E to stay skipped. Only a
    # complete run reports the required verify check. A manual run whose
    # release_sha is not the dispatched commit reports verify-detached,
    # so it cannot satisfy branch protection for that commit.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha != github.sha && 'verify-detached' || github.event_name == 'pull_request' && github.event.pull_request.draft && 'verify-draft' || 'verify' }}
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    env:
      DRAFT_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    steps:
      - name: Require every result to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          failed=0
          if [ "$CHECKS_RESULT" != success ]; then
            echo "required result: $CHECKS_RESULT"
            failed=1
          fi
          if [ "$DRAFT_PULL_REQUEST" = true ]; then
            if [ "$E2E_RESULT" != skipped ]; then
              echo "draft pull request requires E2E to be skipped, got: $E2E_RESULT"
              failed=1
            fi
          elif [ "$E2E_RESULT" != success ]; then
            echo "required result: $E2E_RESULT"
            failed=1
          fi
          exit "$failed"
