interface:
  display_name: "Product Definition Builder"
  short_description: "Create PRDs, architecture, and product decisions"
  default_prompt: >-
    Use $product-definition-builder to turn this product idea into a buildable PRD package
    with measurable requirements, architecture, stack decisions, release
    targets, test obligations, and a sourced market-research gap pass. Run
    open-ended discovery as three bounded free-text turns: Product and users;
    Workflows, data, and rules; then Delivery, success, and risk. Ask one
    segment per turn, dynamically skip answered or inapplicable prompts, and
    wait until every applicable segment passes the coverage check before using
    AskUserQuestion. For a UI-bearing product, ask the human product/design
    decision owner for a Builder UX Direction covering experience priority,
    guidance versus expert control, information density, preferred
    layout/interaction pattern, motion direction and decision authority,
    confirmation/recovery, and validation depth. Record a Motion Need Gate for
    each key surface as required, recommended, not_required, or blocked, with
    purpose, trigger, source, and a reduced-motion fallback.
    Mark choices selected, provisional, or assumed, and state that builder
    preference is not usability proof. Freeze product scope, routes, content
    responsibilities, actions, states, trace IDs, brand constraints,
    accessibility, platform, and performance limits as design inputs. For a
    UI-bearing product, inspect exact comparable screens or flows and record
    stable WREF-* structural evidence before projecting every UI-* entry into one self-contained
    structural wireframes/4 HTML. Put all pages in that HTML with an overview,
    page switcher, responsive and state controls, implementation-bound static
    copy, realistic dynamic examples with complete display contracts, a copy
    inventory, and a reviewer-only inspector. Record one copy anchor per UI-*
    entry plus a Copy Freeze owner, primary locale, approval date, exact action
    labels, feedback messages, and alternate-state copy. Make every visible PRD action work locally by
    switching pages, opening an accessible overlay, or showing feedback. After
    the first draft, show the copy inventory to the copy owner, revise it, record
    an approved PRD Copy Freeze, keep structural approvalStatus draft, and pass
    check_wireframe_html.py with --require-filled --require-copy-approved. Only
    then bind the HTML to the exact PRD revision or hash and begin grading. When the
    host has multi-agent browser capability and dispatch is explicitly
    authorized, run one complete diagnostic wave with one lead grader by
    default and at most two justified non-overlapping specialists. Consolidate
    every finding before one repair batch and one re-review; if that re-review
    still blocks, stop instead of opening another round. When capability is
    unavailable, record the skip and continue. Browser-check the full matrix,
    review the same copy-frozen file in the Wireframe Approval Gate, record the
    later structural decision in PRD.md, and pass --require-approved. Treat both
    ordered gates as a complete stopping point. Only when the owner explicitly continues into
    visual design, run the UI Design Pass: load $design-taste-frontend, record
    applicable, partially_applicable, or n/a, and use $frontend-design for
    excluded product surfaces. Produce one recommended direction by default
    from a complementary two-source reference set, pass a human Direction
    Checkpoint before coding, preserve frozen copy verbatim, create one
    connected interactive design-reference HTML, and omit login,
    registration, recovery, and authentication-error preview scenes while
    retaining production auth requirements in the PRD. Required functional UI
    motion may run locally with an equivalent reduced-motion path. Keep
    generated image and motion positions as static placeholders with dedicated
    prompts and generationStatus deferred; do not invoke a generation provider
    in this pass. Apply the same PRD-bound diagnostic and bounded re-review rule before human visual
    approval; require a design-reference overall score of at least 90 and H2,
    H4, and H8 scores of at least 90, then record the immutable page-faithful target in PRD.md. Then run the Design
    System Need Gate. Use $design-system-compiler only when the gate is
    required; otherwise pass the approved UI target directly to Harness. Stop
    when a required dependency, preview decision, or gate decision is
    unavailable. Recommend one explicit frontend stack when the
    product has a browser surface. Run the market-research gap pass by default
    unless the user declined it, no web tool is available, or the package is a
    trivial stub, and record the reason for any skip. Every market claim
    carries a publisher, URL, and retrieval date, or is recorded UNVALIDATED;
    never invent a competitor, price, funding figure, user count, or market
    size. Keep always-present measurable Non-Functional Requirements after
    Functional Requirements and stable Test Obligations after Open Questions.
    Map every Must functional requirement and applicable NFR to a required TEST
    row with upstream trace IDs and an observable expected signal. For every
    deployable web, API, mobile, desktop, or browser-extension surface, record a complete stable
    surface inventory and provider-neutral development and production release
    targets. Give production the canonical `<product-slug>-<surface-suffix>`
    release name with no -prod suffix, and give development that exact name
    plus -dev. Include
    exact source ref, artifact, signing, channel, release
    path, availability signal, rollout, and rollback or forward-fix. Upload,
    submission, or approval is not availability; production availability needs
    a serving or installable result, and native recovery may require a signed
    forward-fix. Use a main-only branch model: initial delivery and enhancements
    both start from the observed remote main head, internal releases use the
    exact candidate run branch/ref, and only that verified candidate SHA may be
    separately authorized and fast-forwarded to main.
    Resolve the deployment platform via AskUserQuestion unless the
    user or repository already names it, including Cloudflare, Vercel, AWS, or
    self-hosted development and production targets. For a product with a
    backend, persistent data, or auth requirement, resolve the database
    category (Relational, Document, Key-value or cache only, or None) and auth
    strategy (Build custom, Managed third-party provider, Platform-native, or
    No auth needed) via AskUserQuestion unless the user or repository already
    names them. Resolve commercial intent into a monetization model and a
    separate partner-channel model via AskUserQuestion when applicable.
    Record explicit Monetization Infrastructure and Partner Channel gates;
    pricing does not automatically select RevenueCat, and affiliate, referral,
    and reseller are different motions. Compare current official evidence for
    RevenueCat and relevant alternatives, then record billing/store,
    entitlement, paywall/checkout, merchant-of-record/tax, attribution,
    commission, payout, and reseller-operation layers separately. Then record
    service topology first: monolith versus named
    services and monorepo versus polyrepo, followed by backend runtime,
    database engine, and auth provider as separate layers. For a deployable
    product with a web, iOS, or browser-extension target, create
    docs/ACTIVATION.md only when that path is absent, map every
    metric and required TEST signal into its seed, and leave post-delivery
    reconciliation to $product-activation. Validate in staging
    and never overwrite, move, or archive existing documents without exact
    user authorization.
