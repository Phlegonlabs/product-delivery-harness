<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframes — &lt;Product Name&gt;</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5f3;
      --panel: #ffffff;
      --panel-subtle: #eef1ee;
      --ink: #171b18;
      --muted: #667069;
      --line: #d6dbd7;
      --line-strong: #9da69f;
      --mark: #e8ece9;
      --accent: #245b47;
      --accent-soft: #e2eee8;
      --focus: #245b47;
      --success: #25643f;
      --danger: #a53a35;
      --sidebar: 18rem;
      --radius: 14px;
      --radius-small: 9px;
      --shadow: 0 18px 48px rgb(19 28 22 / 10%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button { font: inherit; }

    ::selection { background: var(--accent-soft); color: var(--ink); }

    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: #f9faf9;
    }

    .eyebrow,
    .meta-label,
    .section-kind {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .sidebar-meta {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .page-list {
      display: grid;
      gap: 6px;
    }

    .page-button {
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: var(--radius-small);
      text-align: left;
      cursor: pointer;
    }

    .page-button:hover { border-color: var(--line); background: var(--panel-subtle); }

    .page-button[aria-current="page"] {
      border-color: #c8d9d0;
      background: var(--accent-soft);
    }

    .page-button[aria-current="page"] span { color: #405249; }

    .page-button strong,
    .page-button span { display: block; }

    .page-button span {
      margin-top: 3px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .main { min-width: 0; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--line);
      background: rgb(249 250 249 / 96%);
      backdrop-filter: blur(14px);
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toolbar-cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .toolbar-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .control {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .control:hover { border-color: var(--line-strong); }

    .control[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .content { padding: 38px 32px 64px; }

    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(15rem, 0.55fr);
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto 28px;
    }

    .screen-header h2 {
      margin: 4px 0 8px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .screen-header p { margin: 0; color: var(--muted); }

    .metadata {
      display: grid;
      grid-template-columns: auto 1fr;
      align-content: start;
      gap: 6px 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 24px rgb(19 28 22 / 6%);
    }

    .canvas-shell {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 16px;
      border: 1px solid #cbd1cc;
      border-radius: calc(var(--radius) + 4px);
      background: #e3e7e4;
      box-shadow: var(--shadow);
      transition: width 160ms ease;
    }

    .wireframe {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
      min-height: 620px;
      padding: 14px;
      border: 1px solid #bfc6c0;
      border-radius: var(--radius);
      background: var(--panel);
    }

    .region {
      grid-column: span var(--span, 12);
      min-width: 0;
      min-height: var(--height, 110px);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: #fbfcfb;
      overflow-wrap: anywhere;
    }

    .region[data-priority="primary"] { border-color: #9eaaa2; background: #fff; }
    .region[data-priority="quiet"] { background: var(--panel-subtle); }

    .region-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .region h3 { margin: 2px 0 0; font-size: 13px; letter-spacing: -0.01em; }

    .priority {
      flex: 0 0 auto;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-subtle);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .product-copy {
      display: grid;
      align-content: start;
      gap: 10px;
      padding-top: 14px;
    }

    .copy-item {
      max-width: 68ch;
      color: var(--ink);
    }

    .copy-item[data-copy-kind="dynamic"] {
      width: fit-content;
      padding: 7px 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 7px;
      background: var(--panel-subtle);
      font-variant-numeric: tabular-nums;
    }

    .copy-item[data-copy-category="display"] {
      max-width: 22ch;
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 720;
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .copy-item[data-copy-category="section-heading"] {
      max-width: 30ch;
      font-size: 22px;
      font-weight: 720;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .copy-item[data-copy-category="item-heading"] {
      max-width: 36ch;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }

    .copy-item[data-copy-role*="body"],
    .copy-item[data-copy-role*="support"] { color: #48514b; line-height: 1.65; }

    .copy-item[data-copy-role*="label"],
    .copy-item[data-copy-role*="eyebrow"] {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .copy-item[data-copy-role*="metric"],
    .copy-item[data-copy-role*="balance"],
    .copy-item[data-copy-role*="amount"] {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .state-note {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #c9d8d0;
      border-radius: var(--radius-small);
      background: var(--accent-soft);
      color: #254c3d;
    }

    .media-placeholder {
      display: grid;
      place-items: center;
      min-height: 88px;
      margin-top: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .layout-qa {
      max-width: 1200px;
      margin: 14px auto 0;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel);
      color: var(--muted);
    }

    .layout-qa[data-layout-qa="pass"] { border-color: #a7c8b4; color: var(--success); }
    .layout-qa[data-layout-qa="fail"] { border-color: #d5aaa7; color: var(--danger); }

    .display-contract {
      display: grid;
      gap: 2px;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
      color: var(--muted);
      font-size: 12px;
    }

    .flow-panel {
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .flow-panel > .meta-label { display: block; margin-bottom: 8px; }

    .flow-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .flow-list li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .flow-direction {
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .flow-target {
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    button.flow-target { cursor: pointer; }

    .action-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0 0;
    }

    .action-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid #222824;
      border-radius: var(--radius-small);
      background: #222824;
      color: #fff;
      cursor: pointer;
    }

    .action-button:hover { background: #111411; }

    .action-feedback {
      min-height: 1.5em;
      margin: 4px 0 10px;
      color: var(--success);
      font-size: 12px;
    }

    .flow-dialog {
      width: min(96vw, 1120px);
      max-height: 88vh;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .flow-dialog::backdrop { background: rgb(32 33 31 / 45%); }

    .flow-dialog-body { padding: 20px; }
    .flow-dialog-body h2 { margin: 5px 0 8px; }
    .flow-dialog-body ul { margin: 14px 0; padding-left: 20px; }
    .flow-dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 18px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .overview-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 22px rgb(19 28 22 / 5%);
      cursor: pointer;
    }

    .overview-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }

    .overview-card h2 { margin: 5px 0 3px; font-size: 18px; }
    .overview-card p { margin: 0 0 12px; color: var(--muted); }

    .mini-layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .mini-region {
      grid-column: span var(--span, 12);
      min-height: 44px;
      padding: 5px;
      border: 1px solid #bdc5bf;
      border-radius: 5px;
      background: #fff;
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
    }

    .empty-state {
      max-width: 720px;
      margin: 80px auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .review-trigger {
      min-height: 32px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .review-trigger:hover { border-color: var(--line-strong); color: var(--ink); }

    .inspector-backdrop {
      position: fixed;
      inset: 68px 0 0;
      z-index: 9;
      border: 0;
      background: rgb(18 24 20 / 18%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }

    .inspector-backdrop[data-open="true"] { opacity: 1; pointer-events: auto; }

    .inspector {
      position: fixed;
      top: 68px;
      right: 0;
      bottom: 0;
      z-index: 10;
      width: min(390px, 100vw);
      padding: 24px;
      border-left: 1px solid var(--line);
      background: var(--panel);
      box-shadow: -18px 0 48px rgb(19 28 22 / 12%);
      overflow: auto;
      transform: translateX(100%);
      transition: transform 180ms ease;
    }

    .inspector[data-open="true"] { transform: translateX(0); }

    .inspector-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .inspector h2 { margin: 2px 0 0; font-size: 22px; letter-spacing: -0.025em; }
    .inspector h3 { margin: 22px 0 8px; font-size: 14px; }
    .inspector p { color: var(--muted); }
    .inspector ul { margin: 8px 0; padding-left: 18px; }

    .inspector-card {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .copy-status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .copy-dialog {
      width: min(92vw, 880px);
      max-height: 86vh;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .copy-dialog::backdrop { background: rgb(18 24 20 / 42%); }
    .copy-dialog-body { padding: 24px; }
    .copy-dialog-head { display: flex; justify-content: space-between; gap: 16px; }
    .copy-dialog h2 { margin: 0; font-size: 26px; letter-spacing: -0.035em; }
    .copy-dialog-head p { margin: 5px 0 0; color: var(--muted); }
    .copy-inventory-list { display: grid; gap: 10px; margin-top: 20px; }

    .copy-record {
      display: grid;
      grid-template-columns: minmax(9rem, .35fr) minmax(0, 1fr);
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
    }

    .copy-record p { margin: 4px 0 0; }
    .copy-record code { font-size: 11px; color: var(--muted); }

    .noscript {
      margin: 20px;
      padding: 16px;
      border: 2px solid #8a2727;
      background: #fff;
    }

    @media (max-width: 820px) {
      .app { display: block; }
      .sidebar { position: static; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .page-list { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
      .toolbar { position: static; }
      .content { padding: 20px 12px; }
      .screen-header { grid-template-columns: 1fr; }
      .inspector { top: 0; }
      .inspector-backdrop { inset: 0; }
      .copy-record { grid-template-columns: 1fr; }
    }

    @media print {
      .sidebar, .toolbar, .inspector, .inspector-backdrop, .copy-dialog { display: none; }
      .app { display: block; }
      .content { padding: 0; }
      .canvas-shell { width: 100%; border: 0; padding: 0; }
      .wireframe { min-height: 0; }
    }
  </style>
</head>
<body>
  <noscript><p class="noscript">Enable JavaScript to use the page, viewport, and state controls in this local wireframe file.</p></noscript>
  <div class="app">
    <aside class="sidebar" aria-label="Wireframe pages">
      <h1 id="product-name">Wireframes</h1>
      <p class="sidebar-meta" id="contract-meta"></p>
      <p class="sidebar-meta" id="copy-meta"></p>
      <nav class="page-list" id="page-list"></nav>
    </aside>

    <main class="main">
      <div class="toolbar" role="toolbar" aria-label="Wireframe controls">
        <div class="toolbar-cluster">
          <span class="toolbar-label">Canvas</span>
          <div class="control-group" id="responsive-controls" role="group" aria-label="Responsive targets"></div>
        </div>
        <div class="toolbar-cluster">
          <span class="toolbar-label">State</span>
          <div class="control-group" id="state-controls" role="group" aria-label="Screen states"></div>
        </div>
        <div class="toolbar-cluster">
          <button class="control" id="copy-inventory-button" type="button">Copy inventory</button>
          <button class="control" id="annotation-toggle" type="button" aria-pressed="false">Review notes</button>
        </div>
      </div>
      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>

  <button class="inspector-backdrop" id="inspector-backdrop" type="button" aria-label="Close review notes" hidden></button>
  <aside class="inspector" id="inspector" aria-label="Reviewer-only structure notes" aria-hidden="true" inert>
    <div class="inspector-head">
      <div>
        <h2 id="inspector-title">Structure notes</h2>
        <span class="copy-status">Reviewer only</span>
      </div>
      <button class="control" id="inspector-close" type="button">Close</button>
    </div>
    <div id="inspector-content"></div>
  </aside>

  <dialog class="copy-dialog" id="copy-inventory" aria-labelledby="copy-inventory-title">
    <div class="copy-dialog-body">
      <div class="copy-dialog-head">
        <div>
          <h2 id="copy-inventory-title">Copy inventory</h2>
          <p>Implementation-bound content</p>
        </div>
        <button class="control" id="copy-inventory-close" type="button">Close</button>
      </div>
      <div class="copy-inventory-list" id="copy-inventory-list"></div>
    </div>
  </dialog>

            "span": 12,
            "height": 210,
            "elements": [
              {"kind": "static", "role": "section heading", "text": "<Exact feature-section heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "feature heading", "text": "<Exact feature 1 heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "feature body", "text": "<Exact feature 1 explanation>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "feature heading", "text": "<Exact feature 2 heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "feature body", "text": "<Exact feature 2 explanation>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ],
            "actions": [
              {"label": "<Exact feature-detail action label>", "status": "draft", "source": "<Owner or PRD copy decision>"}

          {

              {"kind": "static", "role": "heading", "text": "<Exact closing message>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ],
            "actions": [
              {"label": "<Exact closing action label>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ]
          }
        ],
        "neverDrop": ["global-header", "hero-content", "closing-cta"],
        "responsiveLayouts": {
          "390": {
            "order": ["global-header", "hero-content", "hero-support", "feature-grid", "closing-cta"],
            "hidden": [],
            "columns": 1,
            "spans": {"global-header": 1, "hero-content": 1, "hero-support": 1, "feature-grid": 1, "closing-cta": 1},
            "reflow": "<Single-column order, wrapping, and content-priority rule>",
            "interaction": "<Touch, keyboard, navigation, and overlay behavior at 390px>"
          },
          "768": {
            "order": ["global-header", "hero-content", "hero-support", "feature-grid", "closing-cta"],
            "hidden": [],
            "columns": 6,
            "spans": {"global-header": 6, "hero-content": 4, "hero-support": 2, "feature-grid": 6, "closing-cta": 6},
            "reflow": "<Intermediate-width grouping and wrapping rule>",
            "interaction": "<Pointer, keyboard, navigation, and overlay behavior at 768px>"
          },
          "1200": {
            "order": ["global-header", "hero-content", "hero-support", "feature-grid", "closing-cta"],
            "hidden": [],
            "columns": 12,
            "spans": {"global-header": 12, "hero-content": 7, "hero-support": 5, "feature-grid": 12, "closing-cta": 12},
            "reflow": "<Expanded-width grouping and maximum readable-line rule>",
            "interaction": "<Pointer, keyboard, navigation, and overlay behavior at 1200px>"
          }
        },
        "states": [
          {"id": "ready", "label": "Ready", "treatments": {}},
          {
            "id": "loading",
            "label": "Loading",
            "treatments": {
              "hero-support": {
                "layout": "<Layout-preserving skeleton rule>",
                "copy": [
                  {"kind": "static", "role": "assistive status", "text": "<Exact loading announcement>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              },
              "feature-grid": {
                "layout": "<Placeholder rows preserve the section height>",
                "copy": []
              }
            }
          },
          {
            "id": "error",
            "label": "Error",
            "treatments": {
              "feature-grid": {
                "layout": "<Keep the hero available and place recovery inline>",
                "copy": [
                  {"kind": "static", "role": "error message", "text": "<Exact error message>", "status": "draft", "source": "<Owner or PRD copy decision>"},
                  {"kind": "static", "role": "recovery guidance", "text": "<Exact recovery guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              }
            }
          }
        ]
      },
      {
        "id": "UI-002",
        "name": "<Product Workspace>",
        "route": "/app",
        "goal": "<Complete the product's main task>",
        "copyStatus": "draft",
        "regions": [
          {
            "id": "app-header",
            "section": "Application Header",
            "purpose": "<Context, global actions, and account access>",
            "priority": "primary",
            "span": 12,
            "height": 72,
            "elements": [
              {"kind": "static", "role": "page title", "text": "<Exact workspace title>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "account label", "text": "<Exact account-control label>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ],
            "actions": [
              {"label": "<Exact global action label>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ]
          },
          {
            "id": "task-controls",
            "section": "Task Controls",
            "purpose": "<Collect the inputs needed for the main task>",
            "priority": "primary",
            "span": 4,
            "height": 430,
            "elements": [
              {"kind": "static", "role": "form heading", "text": "<Exact task heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "field label", "text": "<Exact input label>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {"kind": "static", "role": "field guidance", "text": "<Exact field guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ],
            "actions": [
              {"label": "<Exact submit label>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ]
          },
          {
            "id": "primary-workspace",
            "section": "Primary Workspace",
            "purpose": "<Display the main working result and direct manipulation area>",
            "priority": "primary",
            "span": 8,
            "height": 430,
            "elements": [
              {"kind": "static", "role": "result heading", "text": "<Exact result heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
              {
                "kind": "dynamic",
                "role": "primary result",
                "example": "<Representative primary result>",
                "status": "draft",
                "source": "<Approved dynamic-content decision>",
                "contract": {
                  "source": "<Result data source>",
                  "order": "<Result ordering rule>",
                  "format": "<Result display format>",
                  "count": "<Minimum and maximum result count>",
                  "length": "<Result length limit>",
                  "fallback": "<Exact empty or unavailable fallback>"
                }
              }
            ],
            "actions": [
              {"label": "<Exact contextual action label>", "status": "draft", "source": "<Owner or PRD copy decision>"}
            ]
          }
        ],
        "neverDrop": ["app-header", "task-controls", "primary-workspace"],
        "responsiveLayouts": {
          "390": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 1,
            "spans": {"app-header": 1, "task-controls": 1, "primary-workspace": 1},
            "reflow": "<Single-column task flow and long-content rule>",
            "interaction": "<Touch, keyboard, form, and overlay behavior at 390px>"
          },
          "768": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 6,
            "spans": {"app-header": 6, "task-controls": 2, "primary-workspace": 4},
            "reflow": "<Intermediate-width task-panel and workspace rule>",
            "interaction": "<Pointer, keyboard, form, and overlay behavior at 768px>"
          },
          "1200": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 12,
            "spans": {"app-header": 12, "task-controls": 4, "primary-workspace": 8},
            "reflow": "<Expanded task-panel and workspace rule>",
            "interaction": "<Pointer, keyboard, form, and overlay behavior at 1200px>"
          }
        },
        "states": [
          {"id": "ready", "label": "Ready", "treatments": {}},
          {
            "id": "empty",
            "label": "Empty",
            "treatments": {
              "primary-workspace": {
                "layout": "<Preserve context and point back to the primary input>",
                "copy": [
                  {"kind": "static", "role": "empty-state heading", "text": "<Exact empty-state heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
                  {"kind": "static", "role": "empty-state guidance", "text": "<Exact empty-state guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              }
            }
          },
          {
            "id": "permission-denied",
            "label": "Permission denied",
            "treatments": {
              "primary-workspace": {
                "layout": "<Preserve context and place access recovery inline>",
                "copy": [
                  {"kind": "static", "role": "permission heading", "text": "<Exact permission-denied heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
                  {"kind": "static", "role": "permission recovery", "text": "<Exact access-recovery guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              }
            }
          }
        ]
      }
    ],
    "flows": [
      {"from": "UI-001", "trigger": "<Exact navigation action label>", "to": "UI-002", "presentation": "page"},
      {"from": "UI-001", "trigger": "<Exact primary CTA label>", "to": "UI-002", "presentation": "page"},
      {"from": "UI-001", "trigger": "<Exact feature-detail action label>", "to": "UI-002", "presentation": "overlay"},
      {"from": "UI-001", "trigger": "<Exact closing action label>", "to": "UI-002", "presentation": "page"},
      {"from": "UI-002", "trigger": "<Exact global action label>", "to": "<External destination>", "presentation": "feedback", "feedback": {"kind": "static", "role": "status message", "text": "<Exact global-action feedback>", "status": "draft", "source": "<Owner or PRD copy decision>"}},
      {"from": "UI-002", "trigger": "<Exact submit label>", "to": "<Submission result>", "presentation": "feedback", "feedback": {"kind": "static", "role": "success message", "text": "<Exact submission feedback>", "status": "draft", "source": "<Owner or PRD copy decision>"}},
      {"from": "UI-002", "trigger": "<Exact contextual action label>", "to": "UI-001", "presentation": "overlay"}
    ]
  }
  </script>

  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("wireframe-data").textContent);
      const responsiveKind = Array.isArray(data.viewports) ? "viewports" : "sizeClasses";
      const responsiveTargets = data[responsiveKind].map(String);
      const state = {
        page: location.hash.slice(1) || "overview",
        responsiveTarget: responsiveTargets[responsiveTargets.length - 1],
        screenState: "ready",
        inspectorOpen: false,
        selectedRegion: null
      };

      const pageList = document.getElementById("page-list");
      const content = document.getElementById("content");
      const responsiveControls = document.getElementById("responsive-controls");
      const stateControls = document.getElementById("state-controls");
      const annotationToggle = document.getElementById("annotation-toggle");
      const inspector = document.getElementById("inspector");
      const inspectorBackdrop = document.getElementById("inspector-backdrop");
      const inspectorClose = document.getElementById("inspector-close");
      const inspectorTitle = document.getElementById("inspector-title");
      const inspectorContent = document.getElementById("inspector-content");
      const copyInventoryButton = document.getElementById("copy-inventory-button");
      const copyInventory = document.getElementById("copy-inventory");
      const copyInventoryClose = document.getElementById("copy-inventory-close");
      const copyInventoryList = document.getElementById("copy-inventory-list");
      let inspectorReturnFocus = annotationToggle;

      document.getElementById("product-name").textContent = data.product;
      document.getElementById("contract-meta").textContent =
        `${data.approvalStatus} · ${data.source}`;
      document.getElementById("copy-meta").textContent = data.copyFreeze
        ? `Copy ${data.copyFreeze.status} · ${data.copyFreeze.locale} · ${data.copyFreeze.owner}`
        : "Legacy copy contract";

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const currentScreen = () => data.screens.find((screen) => screen.id === state.page);

      const selectPage = (page) => {
        state.page = page;
        const screen = currentScreen();
        state.screenState = screen?.states?.[0]?.id || "ready";
        state.selectedRegion = null;
        state.inspectorOpen = false;
        location.hash = page;
        render();
        content.focus({preventScroll: true});
      };

      const makePageButton = (id, title, detail) => {
        const button = element("button", "page-button");
        button.type = "button";
        button.dataset.page = id;
        button.setAttribute("aria-current", state.page === id ? "page" : "false");
        button.append(element("strong", "", title), element("span", "", detail));
        button.addEventListener("click", () => selectPage(id));
        return button;
      };

      const renderNavigation = () => {
        pageList.replaceChildren();
        pageList.append(makePageButton("overview", "All pages", `${data.screens.length} surfaces`));
        data.screens.forEach((screen) => {
          pageList.append(makePageButton(screen.id, `${screen.id} · ${screen.name}`, screen.route));
        });
      };

      const activeLayout = (screen) => screen.responsiveLayouts[state.responsiveTarget];

      const regionOrder = (screen) => {
        const layout = activeLayout(screen);
        const order = new Map(layout.order.map((id, index) => [id, index]));
        return [...screen.regions].sort((a, b) => (order.get(a.id) ?? 999) - (order.get(b.id) ?? 999));
      };

      const appendList = (parent, label, values) => {
        if (!values?.length) return;
        parent.append(element("div", "meta-label", label));
        const list = element("ul");
        values.forEach((value) => list.append(element("li", "", value)));
        parent.append(list);
      };

      const copyText = (value) => {
        if (typeof value === "string") return value;
        if (value?.kind === "static") return value.text;
        if (value?.kind === "dynamic") return value.example;
        return value?.label || "";
      };

      const copyRole = (value) =>
        typeof value === "string" ? "legacy copy" : value?.role || "dynamic content";

      const copyCategory = (value) => {
        const role = copyRole(value).toLowerCase();
        if (role.includes("section heading")) return "section-heading";
        if (role.includes("feature heading") || role.includes("item heading")) {
          return "item-heading";
        }
        if (role.includes("heading") || role.includes("title")) return "display";
        return "body";
      };

      const actionLabel = (value) =>
        typeof value === "string" ? value : value?.label || "";

      const appendElements = (parent, values) => {
        if (!values?.length) return;
        parent.append(element("h3", "", "Product copy"));
        values.forEach((value) => {
          const card = element("div", "inspector-card");
          card.append(
            element("div", "meta-label", copyRole(value)),
            element("p", "", copyText(value))
          );
          if (typeof value === "object") {
            card.append(
              element("span", "copy-status", value.status || "legacy"),
              element("p", "", `Source: ${value.source || "legacy contract"}`)
            );
            if (value.contract && typeof value.contract === "object") {
              const contract = element("div", "display-contract");
              Object.entries(value.contract).forEach(([key, text]) => {
                contract.append(element("div", "", `${key}: ${text}`));
              });
              card.append(contract);
            }
          }
          parent.append(card);
        });
      };

      const renderCopyItem = (value) => {
        const node = element("div", "copy-item", copyText(value));
        const role = copyRole(value).toLowerCase();
        node.dataset.copyRole = role;
        node.dataset.copyKind = value?.kind || (value?.contract ? "dynamic" : "static");
        node.dataset.copyCategory = copyCategory(value);
        return node;
      };

      const flowTarget = (target) => {
        if (data.screens.some((screen) => screen.id === target)) {
          const button = element("button", "flow-target", target);
          button.type = "button";
          button.addEventListener("click", () => selectPage(target));
          return button;
        }
        return element("span", "flow-target", target);
      };

      const screenFlows = (screenId) =>
        (data.flows || []).filter((flow) => flow.from === screenId || flow.to === screenId);

      const outgoingFlow = (screenId, trigger) =>
        (data.flows || []).find((flow) => flow.from === screenId && flow.trigger === trigger);

      const openFlowDialog = (flow) => {
        const target = data.screens.find((screen) => screen.id === flow.to);
        if (!target) return;
        const dialog = element("dialog", "flow-dialog");
        const body = element("div", "flow-dialog-body");
        const titleId = `flow-dialog-title-${target.id}`;
        const title = element("h2", "", `${target.id} · ${target.name}`);
        title.id = titleId;
        dialog.setAttribute("aria-labelledby", titleId);
        body.append(title, element("div", "eyebrow", "Overlay preview"), element("p", "", target.goal));
        const targetLayout = target.responsiveLayouts[state.responsiveTarget];
        const targetState = target.states[0];
        const hidden = new Set(targetLayout.hidden);
        const overlayCanvas = element("div", "wireframe");
        overlayCanvas.setAttribute("role", "group");
        overlayCanvas.style.gridTemplateColumns = `repeat(${targetLayout.columns}, minmax(0, 1fr))`;
        overlayCanvas.setAttribute(
          "aria-label",
          `${target.name} overlay, ${state.responsiveTarget}, ${targetState.id}`
        );
        regionOrder(target)
          .filter((region) => !hidden.has(region.id))
          .forEach((region) => overlayCanvas.append(renderRegion(target.id, region, targetState, targetLayout, false)));
        body.append(overlayCanvas);
        const actions = element("div", "flow-dialog-actions");
        const openPage = element("button", "action-button", "Open full page");
        openPage.type = "button";
        openPage.addEventListener("click", () => {
          dialog.close();
          selectPage(target.id);
        });
        const close = element("button", "action-button", "Close");
        close.type = "button";
        close.addEventListener("click", () => dialog.close());
        actions.append(openPage, close);
        body.append(actions);
        dialog.append(body);
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) dialog.close();
        });
        dialog.addEventListener("close", () => dialog.remove());
        document.body.append(dialog);
        dialog.showModal();
      };

      const runFlow = (flow, feedback) => {
        if (flow.presentation === "page") {
          document.querySelectorAll("dialog[open]").forEach((dialog) => dialog.close());
          selectPage(flow.to);
        } else if (flow.presentation === "overlay") {
          openFlowDialog(flow);
        } else {
          feedback.textContent = flow.feedback ? copyText(flow.feedback) : `Result: ${flow.to}`;
        }
      };

      const appendActions = (parent, screenId, actions) => {
        if (!actions?.length) return;
        const actionList = element("div", "action-list");
        const feedback = element("div", "action-feedback");
        feedback.setAttribute("role", "status");
        actions.forEach((action) => {
          const label = actionLabel(action);
          const flow = outgoingFlow(screenId, label);
          const button = element("button", "action-button", label);
          button.type = "button";
          button.dataset.flowTrigger = label;
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            runFlow(flow, feedback);
          });
          actionList.append(button);
        });
        parent.append(actionList, feedback);
      };

      const renderRegion = (screenId, region, activeState, layout, allowReview = true) => {
        const node = element("section", "region");
        node.dataset.region = region.id;
        node.dataset.priority = region.priority || "secondary";
        node.style.setProperty("--span", String(layout.spans[region.id]));
        node.style.setProperty("--height", `${region.height || 110}px`);

        const head = element("div", "region-head");
        const title = element("div");
        title.append(element("div", "section-kind", region.id), element("h3", "", region.section));
        const headActions = element("div", "toolbar-cluster");
        headActions.append(element("span", "priority", region.priority || "secondary"));
        if (allowReview) {
          const review = element("button", "review-trigger", "Review details");
          review.type = "button";
          review.addEventListener("click", () => openRegionInspector(screenId, region.id));
          headActions.append(review);
        }
        head.append(title, headActions);
        node.append(head);

        const productCopy = element("div", "product-copy");
        region.elements.forEach((value) => productCopy.append(renderCopyItem(value)));
        appendActions(productCopy, screenId, region.actions);
        if (region.mediaIntent) {
          productCopy.append(
            element("div", "media-placeholder", `Deferred ${region.mediaIntent.treatment} position`)
          );
        }
        const treatment = activeState?.treatments?.[region.id];
        if (treatment) {
          const stateNote = element("div", "state-note");
          const treatmentCopy = typeof treatment === "string" ? [] : treatment.copy || [];
          if (treatmentCopy.length) {
            treatmentCopy.forEach((value) => stateNote.append(renderCopyItem(value)));
          } else if (typeof treatment === "string") {
            stateNote.append(element("div", "", `${activeState.label}: ${treatment}`));
          }
          productCopy.append(stateNote);
        }
        node.append(productCopy);
        return node;
      };

      const setInspectorOpen = (open) => {
        const wasOpen = state.inspectorOpen;
        if (open && !wasOpen) inspectorReturnFocus = document.activeElement;
        state.inspectorOpen = open;
        inspector.dataset.open = String(open);
        inspectorBackdrop.dataset.open = String(open);
        inspectorBackdrop.hidden = !open;
        inspector.setAttribute("aria-hidden", String(!open));
        inspector.inert = !open;
        annotationToggle.setAttribute("aria-pressed", String(open));
        if (open) {
          inspectorClose.focus({preventScroll: true});
        } else if (wasOpen && inspectorReturnFocus?.focus) {
          inspectorReturnFocus.focus({preventScroll: true});
        }
      };

      const renderInspector = () => {
        inspectorContent.replaceChildren();
        const screen = currentScreen();
        if (!screen) {
          inspectorTitle.textContent = "Structure notes";
          inspectorContent.append(
            element(
              "p",
              "",
              "Open a page, then select Review details on a region. This panel is reviewer-only and never becomes product copy."
            )
          );
          return;
        }

        const layout = activeLayout(screen);
        const region = screen.regions.find((item) => item.id === state.selectedRegion);
        if (!region) {
          inspectorTitle.textContent = `${screen.id} structure`;
          inspectorContent.append(
            element("div", "meta-label", "Reviewer only"),
            element("p", "", screen.goal),
            element("span", "copy-status", `Copy ${screen.copyStatus || "legacy"}`),
            element("h3", "", "Responsive rule"),
            element("p", "", layout.reflow),
            element("p", "", layout.interaction)
          );
          appendList(inspectorContent, "Traces", screen.traces);
          return;
        }

        inspectorTitle.textContent = region.section;
        inspectorContent.append(
          element("div", "meta-label", `${screen.id} · ${region.id}`),
          element("p", "", region.purpose),
          element("span", "copy-status", `${region.priority || "secondary"} priority`),
          element("h3", "", "Current layout"),
          element(
            "p",
            "",
            `${state.responsiveTarget}: span ${layout.spans[region.id]} of ${layout.columns}`
          )
        );
        appendElements(inspectorContent, region.elements);
        if (region.actions?.length) {
          inspectorContent.append(element("h3", "", "Action copy"));
          region.actions.forEach((action) => {
            const card = element("div", "inspector-card");
            card.append(
              element("p", "", actionLabel(action)),
              element("span", "copy-status", action.status || "legacy"),
              element("p", "", `Source: ${action.source || "legacy contract"}`)
            );
            inspectorContent.append(card);
          });
        }
        appendList(inspectorContent, "Traces", region.traces);
        const activeState = screen.states.find((item) => item.id === state.screenState);
        const treatment = activeState?.treatments?.[region.id];
        if (treatment) {
          inspectorContent.append(
            element("h3", "", `${activeState.label} treatment`),
            element("p", "", typeof treatment === "string" ? treatment : treatment.layout)
          );
          if (typeof treatment === "object") appendElements(inspectorContent, treatment.copy);
        }
        if (region.mediaIntent) {
          inspectorContent.append(
            element("h3", "", "Deferred media intent"),
            element(
              "p",
              "",
              `${region.mediaIntent.treatment}: ${region.mediaIntent.draftPrompt}`
            ),
            element("p", "", `Source: ${region.mediaIntent.source}`)
          );
        }
      };

      const openRegionInspector = (screenId, regionId) => {
        if (state.page !== screenId) return;
        state.selectedRegion = regionId;
        renderInspector();
        setInspectorOpen(true);
      };

      const copyRecords = () => {
        const records = [];
        data.screens.forEach((screen) => {
          screen.regions.forEach((region) => {
            region.elements.forEach((value) => {
              records.push({scope: `${screen.id} · ${region.id}`, value});
            });
            region.actions.forEach((action) => {
              records.push({
                scope: `${screen.id} · ${region.id} · action`,
                value: typeof action === "string"
                  ? action
                  : {...action, kind: "static", role: "action", text: action.label}
              });
            });
          });
          screen.states.forEach((screenState) => {
            Object.entries(screenState.treatments || {}).forEach(([regionId, treatment]) => {
              if (typeof treatment !== "object") return;
              (treatment.copy || []).forEach((value) => {
                records.push({scope: `${screen.id} · ${regionId} · ${screenState.id}`, value});
              });
            });
          });
        });
        (data.flows || [])
          .filter((flow) => flow.presentation === "feedback" && flow.feedback)
          .forEach((flow) => {
            records.push({scope: `${flow.from} · ${flow.trigger} · feedback`, value: flow.feedback});
          });
        return records;
      };

      const renderCopyInventory = () => {
        copyInventoryList.replaceChildren();
        copyRecords().forEach(({scope, value}) => {
          const record = element("article", "copy-record");
          const identity = element("div");
          identity.append(
            element("code", "", scope),
            element("p", "", copyRole(value)),
            element("span", "copy-status", value?.status || "legacy")
          );
          const detail = element("div");
          detail.append(
            element("p", "", copyText(value)),
            element("p", "", `Source: ${value?.source || "legacy contract"}`)
          );
          if (value?.contract) {
            const contract = element("div", "display-contract");
            Object.entries(value.contract).forEach(([key, text]) => {
              contract.append(element("div", "", `${key}: ${text}`));
            });
            detail.append(contract);
          }
          record.append(identity, detail);
          copyInventoryList.append(record);
        });
      };

      const renderStateControls = (screen) => {
        stateControls.replaceChildren();
        if (!screen) return;
        screen.states.forEach((screenState) => {
          const button = element("button", "control", screenState.label);
          button.type = "button";
          button.setAttribute("data-screen-state", screenState.id);
          button.setAttribute("aria-pressed", String(state.screenState === screenState.id));
          button.addEventListener("click", () => {
            state.screenState = screenState.id;
            renderScreen(screen);
            renderStateControls(screen);
          });
          stateControls.append(button);
        });
      };

      const renderResponsiveControls = () => {
        responsiveControls.replaceChildren();
        responsiveTargets.forEach((target) => {
          const suffix = responsiveKind === "viewports" ? "px" : "";
          const button = element("button", "control", `${target}${suffix}`);
          button.type = "button";
          button.setAttribute("data-responsive-target", target);
          button.setAttribute("aria-pressed", String(state.responsiveTarget === target));
          button.addEventListener("click", () => {
            state.responsiveTarget = target;
            renderResponsiveControls();
            const screen = currentScreen();
            if (screen) renderScreen(screen);
          });
          responsiveControls.append(button);
        });
      };

      const rectanglesOverlap = (left, right) =>
        Math.min(left.right, right.right) - Math.max(left.left, right.left) > 1 &&
        Math.min(left.bottom, right.bottom) - Math.max(left.top, right.top) > 1;

      const runLayoutQa = (canvas, shell, panel, screen) => {
        requestAnimationFrame(() => {
          const regions = [...canvas.querySelectorAll(":scope > [data-region]")];
          const collisions = [];
          for (let leftIndex = 0; leftIndex < regions.length; leftIndex += 1) {
            for (let rightIndex = leftIndex + 1; rightIndex < regions.length; rightIndex += 1) {
              if (rectanglesOverlap(
                regions[leftIndex].getBoundingClientRect(),
                regions[rightIndex].getBoundingClientRect()
              )) {
                collisions.push(`${regions[leftIndex].dataset.region}/${regions[rightIndex].dataset.region}`);
              }
            }
          }
          const horizontalOverflow = canvas.scrollWidth > canvas.clientWidth + 1;
          const contentBoundaryViolations = [];
          const clippedContent = [];
          canvas.querySelectorAll(".copy-item, .action-button").forEach((item) => {
            const region = item.closest("[data-region]");
            if (!region) return;
            const itemBounds = item.getBoundingClientRect();
            const regionBounds = region.getBoundingClientRect();
            if (
              itemBounds.left < regionBounds.left - 1 ||
              itemBounds.right > regionBounds.right + 1 ||
              itemBounds.top < regionBounds.top - 1 ||
              itemBounds.bottom > regionBounds.bottom + 1
            ) {
              contentBoundaryViolations.push(
                `${region.dataset.region}/${item.dataset.copyRole || item.dataset.flowTrigger || "control"}`
              );
            }
            const style = getComputedStyle(item);
            const clipsX = ["hidden", "clip"].includes(style.overflowX);
            const clipsY = ["hidden", "clip"].includes(style.overflowY);
            if (
              (clipsX && item.scrollWidth > item.clientWidth + 1) ||
              (clipsY && item.scrollHeight > item.clientHeight + 1)
            ) {
              clippedContent.push(
                `${region.dataset.region}/${item.dataset.copyRole || item.dataset.flowTrigger || "control"}`
              );
            }
          });
          const expectedCanvasWidth = Number(data.canvasWidths[state.responsiveTarget]);
          const actualCanvasWidth = shell.getBoundingClientRect().width;
          const canvasWidthMismatch = Math.abs(actualCanvasWidth - expectedCanvasWidth) > 1;
          const failures = [
            ...(collisions.length ? [`overlap: ${collisions.join(", ")}`] : []),
            ...(horizontalOverflow ? ["horizontal overflow"] : []),
            ...(contentBoundaryViolations.length
              ? [`copy/control boundary: ${contentBoundaryViolations.join(", ")}`]
              : []),
            ...(clippedContent.length
              ? [`clipped copy/control: ${clippedContent.join(", ")}`]
              : []),
            ...(canvasWidthMismatch
              ? [`review canvas ${actualCanvasWidth}px, expected ${expectedCanvasWidth}px`]
              : [])
          ];
          const status = failures.length ? "fail" : "pass";
          panel.setAttribute("data-layout-qa", status);
          panel.textContent = failures.length
            ? `Layout QA failed — ${failures.join("; ")}`
            : "Layout QA passed — no overlap, overflow, or clipped product copy";
          window.wireframeQaResults ||= {};
          window.wireframeQaResults[
            `${screen.id}|${state.responsiveTarget}|${state.screenState}`
          ] = {
            status,
            collisions,
            horizontalOverflow,
            contentBoundaryViolations,
            clippedContent,
            canvasWidthMismatch
          };
        });
      };

      const renderScreenFlows = (screen) => {
        const flows = screenFlows(screen.id);
        if (!flows.length) return null;
        const panel = element("section", "flow-panel");
        panel.setAttribute("aria-label", `Flows for ${screen.id}`);
        panel.append(element("div", "meta-label", "Flows"));
        const list = element("ul", "flow-list");
        flows.forEach((flow) => {
          const item = element("li");
          if (flow.from === screen.id) {
            item.append(
              element("span", "flow-direction", "Out"),
              element("span", "", ` via ${flow.trigger} → `),
              flowTarget(flow.to)
            );
          } else {
            item.append(
              element("span", "flow-direction", "In"),
              flowTarget(flow.from),
              element("span", "", ` via ${flow.trigger}`)
            );
          }
          list.append(item);
        });
        panel.append(list);
        return panel;
      };

      const renderScreen = (screen) => {
        content.replaceChildren();
        const header = element("header", "screen-header");
        const summary = element("div");
        summary.append(
          element("h2", "", screen.name),
          element("div", "eyebrow", `${screen.id} · ${screen.route}`),
          element("p", "", screen.goal)
        );
        const metadata = element("div", "metadata");
        const rows = [
          [responsiveKind === "viewports" ? "Viewport" : "Size class", state.responsiveTarget],
          ["State", state.screenState],
          ["Sections", String(screen.regions.length)],
          ["Copy", screen.copyStatus || "legacy"]
        ];
        if (screen.traces?.length) rows.push(["Traces", screen.traces.join(", ")]);
        if (screen.mediaIntent) {
          rows.push([
            "Media intent",
            `${screen.mediaIntent.treatment} · ${screen.mediaIntent.generationStatus}: ${screen.mediaIntent.draftPrompt} · source: ${screen.mediaIntent.source}`
          ]);
        }
        rows.push(["Authority", data.source]);
        rows.forEach(([label, value]) => {
          metadata.append(element("div", "meta-label", label), element("div", "", value));
        });
        header.append(summary, metadata);

        const layout = activeLayout(screen);
        const shell = element("div", "canvas-shell");
        shell.style.width = `min(100%, ${data.canvasWidths[state.responsiveTarget]}px)`;
        const canvas = element("div", "wireframe");
        canvas.setAttribute("role", "group");
        canvas.style.gridTemplateColumns = `repeat(${layout.columns}, minmax(0, 1fr))`;
        canvas.setAttribute("aria-label", `${screen.name}, ${state.responsiveTarget}, ${state.screenState}`);
        const activeState = screen.states.find((item) => item.id === state.screenState) || screen.states[0];
        const hidden = new Set(layout.hidden);
        regionOrder(screen)
          .filter((region) => !hidden.has(region.id))
          .forEach((region) => canvas.append(renderRegion(screen.id, region, activeState, layout)));
        shell.append(canvas);
        content.append(header, shell);
        const responsiveNotes = element("div", "layout-qa");
        responsiveNotes.setAttribute("data-layout-qa", "pending");
        responsiveNotes.textContent = `Checking layout · ${layout.reflow} · ${layout.interaction}`;
        content.append(responsiveNotes);
        runLayoutQa(canvas, shell, responsiveNotes, screen);
        const flows = renderScreenFlows(screen);
        if (flows) content.append(flows);
        if (state.inspectorOpen) renderInspector();
      };

      const renderOverviewFlows = () => {
        if (!data.flows?.length) return null;
        const panel = element("section", "flow-panel");
        panel.setAttribute("aria-label", "Screen flows");
        panel.append(element("div", "meta-label", "Screen flows"));
        const list = element("ul", "flow-list");
        data.flows.forEach((flow) => {
          const item = element("li");
          item.append(
            flowTarget(flow.from),
            element("span", "", ` ${flow.trigger} → `),
            flowTarget(flow.to)
          );
          list.append(item);
        });
        panel.append(list);
        return panel;
      };

      const renderOverview = () => {
        content.replaceChildren();
        const grid = element("div", "overview-grid");
        data.screens.forEach((screen) => {
          const card = element("article", "overview-card");
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `Open ${screen.id} ${screen.name}`);
          card.append(
            element("h2", "", screen.name),
            element("div", "eyebrow", `${screen.id} · ${screen.route}`),
            element("p", "", screen.goal),
            element("span", "copy-status", `Copy ${screen.copyStatus || "legacy"}`)
          );
          const mini = element("div", "mini-layout");
          screen.regions.forEach((region) => {
            const miniRegion = element("div", "mini-region", region.section);
            miniRegion.style.setProperty("--span", String(region.span || 12));
            mini.append(miniRegion);
          });
          card.append(mini);
          const open = () => selectPage(screen.id);
          card.addEventListener("click", open);
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          });
          grid.append(card);
        });
        content.append(grid);
        const flows = renderOverviewFlows();
        if (flows) content.append(flows);
      };

      const render = () => {
        if (state.page !== "overview" && !currentScreen()) state.page = "overview";
        renderNavigation();
        renderResponsiveControls();
        const screen = currentScreen();
        renderStateControls(screen);
        if (screen) renderScreen(screen); else renderOverview();
      };

      annotationToggle.addEventListener("click", () => {
        state.selectedRegion = null;
        renderInspector();
        setInspectorOpen(!state.inspectorOpen);
      });

      inspectorClose.addEventListener("click", () => setInspectorOpen(false));
      inspectorBackdrop.addEventListener("click", () => setInspectorOpen(false));
      copyInventoryButton.addEventListener("click", () => {
        renderCopyInventory();
        copyInventory.showModal();
      });
      copyInventoryClose.addEventListener("click", () => copyInventory.close());
      copyInventory.addEventListener("click", (event) => {
        if (event.target === copyInventory) copyInventory.close();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.inspectorOpen) setInspectorOpen(false);
      });

      window.addEventListener("hashchange", () => {
        state.page = location.hash.slice(1) || "overview";
        const screen = currentScreen();
        state.screenState = screen?.states?.[0]?.id || "ready";
        state.selectedRegion = null;
        setInspectorOpen(false);
        render();
      });

      window.addEventListener("resize", () => {
        const screen = currentScreen();
        if (screen) renderScreen(screen);
      });

      render();
    })();
  </script>
</body>
</html>
