<!-- Direction-study additions to the shared reviewer. The assembler installs both segments; do not copy them by hand. -->
<!-- direction-reviewer:css:start -->
<style data-direction-reviewer-css>
[data-hifi-review-mode="direction"] [hidden]{display:none!important}
[data-hifi-review-mode="direction"] [data-direction-heading]{margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
[data-hifi-review-mode="direction"] [data-direction-meta]{margin:2px 0 0;font-size:11px;line-height:1.4;color:var(--review-muted);overflow-wrap:anywhere}
[data-hifi-review-mode="direction"] a small,[data-hifi-review-mode="direction"] button small{display:block;margin-top:1px;font-size:11px;font-weight:500;line-height:1.4;color:var(--review-muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
[data-hifi-review-mode="direction"] a[aria-current="page"] small,[data-hifi-review-mode="direction"] button[aria-pressed="true"] small{color:var(--review-accent)}
[data-hifi-review-mode="direction"] fieldset[data-direction-case-controls]{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
[data-hifi-review-mode="direction"] fieldset[data-direction-case-controls] legend{grid-column:1/-1}
[data-hifi-review-mode="direction"] [data-hifi-target-control]{font-variant-numeric:tabular-nums}
[data-hifi-review-mode="direction"] [data-direction-status]{margin:14px 0 0;border-top:1px solid var(--review-line);padding:12px 0 0;font-size:11px;line-height:1.5;color:var(--review-muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
</style>
<!-- direction-reviewer:css:end -->
<!-- direction-reviewer:runtime:start -->
<script id="direction-reviewer-runtime">
(function(){
  "use strict";
  const CASE_KEY = "hifi-reviewer:direction-case";
  const HASH_PREFIX = "#direction-case=";

  function browserSessionStorage() {
    try { return typeof window === "object" && window.sessionStorage ? window.sessionStorage : null; } catch (_) { return null; }
  }

  // A review case takes the core runtime's page slot, so the core's own target
  // validation and per-page memory apply to exactly one case's approved targets.
  function createDirectionReviewerRuntime(options) {
    const config = options || {};
    const cases = (Array.isArray(config.cases) ? config.cases : []).map(item => ({
      id: String(item.id), surface: String(item.surface), platform: String(item.platform), family: String(item.family),
      targets: item.targets.map(String), widths: Object.assign({}, item.widths)
    }));
    if (!cases.length) throw new Error("Direction review needs at least one case");
    const byId = new Map(cases.map(item => [item.id, item]));
    const storage = config.storage || null;
    const packageId = config.packageId ? String(config.packageId) : "";
    const caseKey = `${CASE_KEY}:${packageId}`;
    let remembered = null;
    try { remembered = storage ? storage.getItem(caseKey) : null; } catch (_) { remembered = null; }
    const targetsByPage = {};
    for (const item of cases) targetsByPage[item.id] = item.targets;
    function describe(snapshot) {
      const active = byId.get(snapshot.page);
      return {case: active.id, surface: active.surface, platform: active.platform, family: active.family,
        target: snapshot.target, width: active.widths[snapshot.target], targets: active.targets.slice()};
    }
    const core = window.createHifiReviewerRuntime({
      storage, packageId, platform: "direction",
      pages: cases.map(item => item.id), page: byId.has(String(remembered)) ? String(remembered) : cases[0].id,
      targets: [], targetsByPage, surfaces: [],
      onChange: () => {
        const snapshot = describe(core.snapshot());
        try { if (storage) storage.setItem(caseKey, snapshot.case); } catch (_) {}
        if (typeof config.onChange === "function") config.onChange(snapshot);
      }
    });
    return {
      selectCase(id) {
        if (!byId.has(String(id))) throw new Error("Unknown direction review case: " + id);
        return describe(core.setPage(String(id)));
      },
      selectTarget(target) {
        const active = byId.get(core.snapshot().page);
        if (!active.targets.includes(String(target))) throw new Error(`Target ${target} is not approved for case ${active.id}`);
        return describe(core.selectTarget(String(target)));
      },
      snapshot() { return describe(core.snapshot()); }
    };
  }

  function connectDirectionReviewer(options) {
    const config = options || {};
    const root = config.root || document;
    if (root.__directionReviewerRuntime) return root.__directionReviewerRuntime;
    const shell = root.querySelector('[data-hifi-reviewer-shell][data-hifi-review-mode="direction"]');
    const canvas = root.querySelector("[data-hifi-canvas]");
    if (!shell || !canvas) return null;
    const caseControls = Array.from(shell.querySelectorAll("[data-direction-case-controls] [data-hifi-state-control]"));
    const targetControls = Array.from(shell.querySelectorAll("[data-hifi-target-control]"));
    const studyLinks = Array.from(shell.querySelectorAll("[data-hifi-page-nav] a"));
    const groups = Array.from(shell.querySelectorAll("fieldset"));
    const status = shell.querySelector("[data-direction-status]");
    const views = Array.from(root.querySelectorAll("[data-direction-case-view]"));
    const cases = caseControls.map(control => {
      const mine = targetControls.filter(target => target.dataset.directionCase === control.dataset.hifiStateControl);
      const widths = {};
      for (const target of mine) widths[target.dataset.hifiTargetControl] = Number(target.dataset.directionWidth);
      return {id: control.dataset.hifiStateControl, surface: control.dataset.hifiStateSurface,
        platform: control.dataset.directionPlatform, family: control.dataset.directionFamily,
        targets: mine.map(target => target.dataset.hifiTargetControl), widths};
    });
    if (!cases.length) return null;

    // Same isolation as the HiFi reviewer: chrome in its own shadow tree, product canvas in light DOM.
    if (shell.parentNode && shell.parentNode.attachShadow) {
      const host = document.createElement("reviewer-shell");
      shell.parentNode.insertBefore(host, shell);
      const shadow = host.attachShadow({mode: "open"});
      for (const selector of ["style[data-hifi-reviewer-css]", "style[data-direction-reviewer-css]"]) {
        const source = root.querySelector(selector);
        if (!source) continue;
        const style = document.createElement("style");
        style.textContent = source.textContent;
        shadow.append(style);
      }
      shadow.append(shell);
      if (!canvas.closest("[data-hifi-reviewer-main]")) {
        const stage = document.createElement("reviewer-stage");
        stage.setAttribute("data-hifi-reviewer-main", "");
        stage.style.setProperty("display", "block", "important");
        stage.style.setProperty("margin-left", "236px", "important");
        stage.style.setProperty("padding", "24px", "important");
        canvas.parentNode.insertBefore(stage, canvas);
        stage.append(canvas);
      }
    }

    function apply(snapshot) {
      canvas.dataset.directionCase = snapshot.case;
      canvas.dataset.hifiTarget = snapshot.target || "";
      if (Number.isFinite(snapshot.width) && snapshot.width > 0) {
        canvas.style.setProperty("width", snapshot.width + "px", "important");
        canvas.style.setProperty("max-width", "none", "important");
      }
      shell.dataset.hifiPlatform = snapshot.platform;
      for (const control of caseControls) control.setAttribute("aria-pressed", String(control.dataset.hifiStateControl === snapshot.case));
      for (const control of targetControls) {
        const approved = control.dataset.directionCase === snapshot.case;
        control.hidden = !approved;
        control.setAttribute("aria-pressed", String(approved && control.dataset.hifiTargetControl === snapshot.target));
      }
      for (const view of views) {
        view.hidden = view.dataset.directionCaseView !== snapshot.case;
        for (const variant of view.querySelectorAll("[data-responsive-target]")) variant.hidden = variant.dataset.responsiveTarget !== snapshot.target;
      }
      // Carry the selection to the other studies so they are compared like for like.
      const carried = HASH_PREFIX + encodeURIComponent(snapshot.case) + "/" + encodeURIComponent(snapshot.target || "");
      for (const link of studyLinks) link.setAttribute("href", link.dataset.directionFile + carried);
      if (status) {
        const named = snapshot.family === "viewports" ? "" : `${snapshot.target}, `;
        status.textContent = `${snapshot.case}: ${snapshot.surface} on ${snapshot.platform}, ${named}${snapshot.width}px wide`;
      }
    }

    const runtime = createDirectionReviewerRuntime({
      cases, packageId: config.packageId, onChange: apply,
      storage: Object.prototype.hasOwnProperty.call(config, "storage") ? config.storage : browserSessionStorage()
    });
    function restoreRequested() {
      const hash = typeof window === "object" && window.location ? window.location.hash || "" : "";
      if (!hash.startsWith(HASH_PREFIX)) return;
      const requested = hash.slice(HASH_PREFIX.length).split("/");
      if (requested.length !== 2) return;
      try {
        runtime.selectCase(decodeURIComponent(requested[0]));
        runtime.selectTarget(decodeURIComponent(requested[1]));
      } catch (_) {}
    }
    for (const control of caseControls) control.addEventListener("click", () => runtime.selectCase(control.dataset.hifiStateControl));
    for (const control of targetControls) control.addEventListener("click", () => runtime.selectTarget(control.dataset.hifiTargetControl));
    // Arrow, Home and End move focus inside one control group; Tab order is unchanged.
    for (const group of groups) group.addEventListener("keydown", event => {
      const items = Array.from(group.querySelectorAll("button")).filter(item => !item.hidden);
      const index = items.indexOf(event.target);
      if (index < 0 || !["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === "Home" ? 0 : event.key === "End" ? items.length - 1
        : (index + (event.key === "ArrowDown" || event.key === "ArrowRight" ? 1 : -1) + items.length) % items.length;
      items[next].focus();
    });
    if (typeof window === "object" && window.addEventListener) window.addEventListener("hashchange", () => {
      restoreRequested();
      apply(runtime.snapshot());
    });
    restoreRequested();
    apply(runtime.snapshot());
    root.__directionReviewerRuntime = runtime;
    return runtime;
  }

  window.createDirectionReviewerRuntime = createDirectionReviewerRuntime;
  window.connectDirectionReviewer = connectDirectionReviewer;
})();
</script>
<!-- direction-reviewer:runtime:end -->
