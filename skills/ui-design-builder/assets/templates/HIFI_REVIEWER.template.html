<script id="hifi-reviewer-runtime">

      if (shared) {
        const style = document.createElement("style");
        style.textContent = shared.textContent;

      if (canvas && !canvas.closest('[data-hifi-reviewer-main]')) {

        stage.setAttribute("data-hifi-reviewer-main", "");
        stage.style.setProperty("display", "block", "important");
        stage.style.setProperty("margin-left", "236px", "important");
        stage.style.setProperty("padding", "24px", "important");

        stage.append(canvas);

    const defaultSurface = config.defaultSurface || (root.body && root.body.dataset ? root.body.dataset.hifiDefaultSurface : null)

      const page = link.getAttribute("href");

          event.preventDefault();
          if (!(statesBySurface[surface] || []).includes(state)) return;
          if (typeof window === "object" && window.location) {
            window.location.hash = `#hifi-state=${encodeURIComponent(surface)}/${encodeURIComponent(state)}`;
            restoreRequestedState();
            apply({focus: true});
          } else {
            try { runtime.selectSurface(surface); runtime.selectState(state); runtime.showProduct(); } catch (_) {}
          }
        }
      }
    });
    restoreRequestedState();
    if (typeof window === "object" && window.addEventListener) window.addEventListener("hashchange", () => {
      restoreRequestedState();
      apply({focus: true});
    });
    if (typeof document === "object" && document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => apply({focus: true}), {once: true});
    else apply({focus: true});
    connectProductControls(root);
    root.__hifiReviewerRuntime = runtime;
    return runtime;
  }

  function connectProductControls(root, options) {
    const config = options || {};
    const host = root || document;
    if (host.__hifiProductControls) return host.__hifiProductControls;
    const menus = new Map();
    const tabs = new Map();
    function isProduct(node) {
      let current = node;
      while (current && current !== host) {
        if (current.getAttribute && current.getAttribute("data-ui-surface") !== null) return true;
        current = current.parentNode || current.parentElement || null;
      }
      return false;
    }
    for (const control of host.querySelectorAll("[data-product-menu]")) {
      const menuId = control.getAttribute("aria-controls");
      const menu = menuId ? host.querySelector(`#${CSS.escape(menuId)}`) : null;
      if (!isProduct(control) || !menu) continue;
      menus.set(control, menu);
      const close = () => {
        control.setAttribute("aria-expanded", "false");
        menu.hidden = true;
      };
      control.addEventListener("click", () => {
        const open = control.getAttribute("aria-expanded") !== "true";
        control.setAttribute("aria-expanded", String(open));
        menu.hidden = !open;
      });
      control.addEventListener("keydown", event => {
        const items = Array.from(menu.querySelectorAll("[role='menuitem']"));
        if (event.key === "Escape" && control.getAttribute("aria-expanded") === "true") {
          event.preventDefault(); close(); control.focus({preventScroll: true});
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (control.getAttribute("aria-expanded") !== "true") return;
          event.preventDefault();
          const index = event.key === "ArrowDown" ? 0 : items.length - 1;
          items[index]?.focus({preventScroll: true});
        }
      });
      menu.addEventListener("keydown", event => {
        const items = Array.from(menu.querySelectorAll("[role='menuitem']"));
        const index = items.findIndex(item => item === document.activeElement || item === (config.activeElement || null));
        if (event.key === "Escape") {
          event.preventDefault(); close(); control.focus({preventScroll: true});
        } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          const next = event.key === "ArrowDown"
            ? (index + 1) % items.length
            : (index - 1 + items.length) % items.length;
          items[next]?.focus({preventScroll: true});
        }
      });
    }
    for (const tab of host.querySelectorAll("[data-product-tab]")) {
      if (!isProduct(tab)) continue;
      const panelId = tab.getAttribute("aria-controls");
      const panel = panelId ? host.querySelector(`#${CSS.escape(panelId)}`) : null;
      if (!panel) continue;
      const group = tab.closest("[role='tablist']") || tab;
      if (!tabs.has(group)) tabs.set(group, []);
      tabs.get(group).push({tab, panel});
    }
    for (const members of tabs.values()) {
      const activate = member => {
        for (const candidate of members) {
          const selected = candidate === member;
          candidate.tab.setAttribute("aria-selected", String(selected));
          candidate.tab.tabIndex = selected ? 0 : -1;
          candidate.panel.hidden = !selected;
        }
        member.tab.focus({preventScroll: true});
      };
      members.forEach((member, index) => {
        member.tab.addEventListener("click", () => activate(member));
        member.tab.addEventListener("keydown", event => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === "ArrowLeft" ? index - 1
            : event.key === "ArrowRight" ? index + 1
            : event.key === "Home" ? 0 : members.length - 1;
          activate(members[(next + members.length) % members.length]);
        });
      });
    }
    host.__hifiProductControls = {menus: Array.from(menus.keys()), tabs: Array.from(tabs.values()).flat().map(item => item.tab)};
    return host.__hifiProductControls;
  }

  window.createHifiReviewerRuntime = createHifiReviewerRuntime;
  window.renderHifiTokenSpecimens = renderHifiTokenSpecimens;
  window.connectHifiReviewer = connectHifiReviewer;
  window.connectProductControls = connectProductControls;
})();
</script>
