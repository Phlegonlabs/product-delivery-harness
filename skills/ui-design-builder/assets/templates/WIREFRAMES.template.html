            "reflow": "<Single-column task flow and long-content rule>",
            "interaction": "<Touch, keyboard, form, and overlay behavior at 390px>"
          },
          "768": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 6,
            "spans": {"app-header": 6, "task-controls": 2, "primary-workspace": 4},
            "reflow": "<Intermediate-width task-panel and workspace rule>",
            "interaction": "<Pointer, keyboard, form, and overlay behavior at 768px>"
          },
          "1024": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 12,
            "spans": {"app-header": 12, "task-controls": 4, "primary-workspace": 8},
            "reflow": "<Small-desktop task-panel, workspace, and long-content rule>",
            "interaction": "<Pointer, keyboard, form, and overlay behavior at 1024px>"
          },
          "1440": {
            "order": ["app-header", "task-controls", "primary-workspace"],
            "hidden": [],
            "columns": 12,
            "spans": {"app-header": 12, "task-controls": 4, "primary-workspace": 8},
            "reflow": "<Expanded task-panel and workspace rule>",
            "interaction": "<Pointer, keyboard, form, and overlay behavior at 1440px>"
          }
        },
        "states": [
          {"id": "ready", "label": "Ready", "treatments": {}},
          {
            "id": "empty",
            "label": "Empty",
            "treatments": {
              "primary-workspace": {
                "layout": "<Preserve context and point back to the primary input>",
                "copy": [
                  {"kind": "static", "role": "empty-state heading", "text": "<Exact empty-state heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
                  {"kind": "static", "role": "empty-state guidance", "text": "<Exact empty-state guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              }
            }
          },
          {
            "id": "permission-denied",
            "label": "Permission denied",
            "treatments": {
              "primary-workspace": {
                "layout": "<Preserve context and place access recovery inline>",
                "copy": [
                  {"kind": "static", "role": "permission heading", "text": "<Exact permission-denied heading>", "status": "draft", "source": "<Owner or PRD copy decision>"},
                  {"kind": "static", "role": "permission recovery", "text": "<Exact access-recovery guidance>", "status": "draft", "source": "<Owner or PRD copy decision>"}
                ]
              }
            }
          }
        ]
      }
    ],
    "flows": [
      {"from": "UI-001", "sourceState": "ready", "control": "nav", "trigger": "<Exact navigation action label>", "to": "UI-002", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "page"},
      {"from": "UI-001", "sourceState": "ready", "control": "primary-cta", "trigger": "<Exact primary CTA label>", "to": "UI-002", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "page"},
      {"from": "UI-001", "sourceState": "ready", "control": "feature-detail", "trigger": "<Exact feature-detail action label>", "to": "UI-002", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "overlay"},
      {"from": "UI-001", "sourceState": "ready", "control": "closing-cta", "trigger": "<Exact closing action label>", "to": "UI-002", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "page"},
      {"from": "UI-002", "sourceState": "ready", "control": "global-action", "trigger": "<Exact global action label>", "to": "<Exact global-action feedback>", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "feedback", "feedback": {"kind": "static", "role": "status message", "text": "<Exact global-action feedback>", "status": "draft", "source": "<Owner or PRD copy decision>"}},
      {"from": "UI-002", "sourceState": "ready", "control": "submit", "trigger": "<Exact submit label>", "to": "<Exact submission feedback>", "destination": {"surface": "UI-002", "state": "ready"}, "presentation": "feedback", "feedback": {"kind": "static", "role": "success message", "text": "<Exact submission feedback>", "status": "draft", "source": "<Owner or PRD copy decision>"}},
      {"from": "UI-002", "sourceState": "ready", "control": "contextual-action", "trigger": "<Exact contextual action label>", "to": "UI-001", "destination": {"surface": "UI-001", "state": "ready"}, "presentation": "overlay"}
    ]
  }
  </script>

  <script>
    (() => {
      "use strict";

      // Put reviewer controls behind a style boundary before wiring their events.
      const reviewerAside = document.querySelector('[data-reviewer-shell]');
      let reviewerShadow = null;
      if (reviewerAside && reviewerAside.parentNode && reviewerAside.parentNode.attachShadow) {
        const host = document.createElement('reviewer-shell');
        reviewerAside.parentNode.insertBefore(host, reviewerAside);
        reviewerShadow = host.attachShadow({mode: 'open'});
        const style = document.createElement('style');
        style.textContent = document.querySelector('style[data-hifi-reviewer-css]').textContent;
        reviewerShadow.append(style, reviewerAside);
      }
      const reviewerById = (id) => reviewerShadow?.getElementById(id) || document.getElementById(id);

      const data = JSON.parse(document.getElementById("wireframe-data").textContent);
      const responsiveSpecFor = (screen) => {
        const effectiveScreen = screen || data.screens[0];
        const perSurface = effectiveScreen && data.responsiveBySurface?.[effectiveScreen.id];
        if (perSurface) {
          return {
            kind: perSurface.kind,
            targets: perSurface.targets.map(String),
            canvasWidths: perSurface.canvasWidths
          };
        }
        const kind = Array.isArray(data.viewports) ? "viewports" : "sizeClasses";
        return {
          kind,
          targets: data[kind].map(String),
          canvasWidths: data.canvasWidths
        };
      };
      const resolvePage = (hash) => {
        const requested = hash.slice(1);
        return data.screens.some((screen) => screen.id === requested)
          ? requested : data.screens[0].id;
      };
      const initialPage = resolvePage(location.hash);
      const initialScreen = data.screens.find((screen) => screen.id === initialPage) || data.screens[0];
      const initialResponsive = responsiveSpecFor(initialScreen);
      const packageIdentity = (() => {
        let hash = 2166136261;
        for (const char of document.getElementById("wireframe-data").textContent) {
          hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
        }
        return (hash >>> 0).toString(16);
      })();
      const reviewKey = (screen) => `wireframe-review:${packageIdentity}:${screen.platformGroup || "shared"}:${screen.id}`;
      const readSelection = (screen) => {
        try { return JSON.parse(sessionStorage.getItem(reviewKey(screen)) || "null") || {}; }
        catch (_) { return {}; }
      };
      const saveSelection = (screen, target, screenState) => {
        try { sessionStorage.setItem(reviewKey(screen), JSON.stringify({target, screenState})); }
        catch (_) {}
      };
      const initialSelection = readSelection(initialScreen);
      const state = {
        page: initialPage,
        responsiveTarget: initialResponsive.targets.includes(String(initialSelection.target))
          ? String(initialSelection.target) : initialResponsive.targets[initialResponsive.targets.length - 1],
        screenState: initialScreen.states?.some((item) => item.id === initialSelection.screenState)
          ? initialSelection.screenState : (initialScreen.states?.[0]?.id || "ready"),
        screenStates: Object.create(null),
        fieldValues: Object.create(null),
        localSearch: Object.create(null),
        inspectorOpen: false,
        selectedRegion: null,
        feedback: null
      };

      const pageList = reviewerById("page-list");
      const content = document.getElementById("content");
      const responsiveControls = reviewerById("responsive-controls");
      const stateControls = reviewerById("state-controls");
      const annotationToggle = reviewerById("annotation-toggle");
      const inspector = document.getElementById("inspector");
      const inspectorBackdrop = document.getElementById("inspector-backdrop");
      const inspectorClose = document.getElementById("inspector-close");
      const inspectorTitle = document.getElementById("inspector-title");
      const inspectorContent = document.getElementById("inspector-content");
      const copyInventoryButton = reviewerById("copy-inventory-button");
      const copyInventory = document.getElementById("copy-inventory");
      const copyInventoryClose = document.getElementById("copy-inventory-close");
      const copyInventoryList = document.getElementById("copy-inventory-list");
      let inspectorReturnFocus = annotationToggle;

      reviewerById("product-name").textContent = data.product;
      reviewerById("contract-meta").textContent =
        `${data.structureStatus} · ${data.source}`;
      reviewerById("copy-meta").textContent = `Copy inventory · ${data.copyInventory.locale}`;

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const currentScreen = () => data.screens.find((screen) => screen.id === state.page);

      const selectPage = (page, destinationState = null) => {
        state.page = page;
        const screen = currentScreen();
        if (screen) {
          const responsive = responsiveSpecFor(screen);
          const saved = readSelection(screen);
          state.responsiveTarget = responsive.targets.includes(String(saved.target)) ? String(saved.target)
            : responsive.targets.includes(String(state.responsiveTarget)) ? String(state.responsiveTarget)
            : responsive.targets[responsive.targets.length - 1];
          const rememberedState = state.screenStates[screen.id] || saved.screenState;
          state.screenState = screen.states?.some((item) => item.id === rememberedState)
            ? rememberedState
            : screen.states?.[0]?.id || "ready";
          if (destinationState && screen.states?.some((item) => item.id === destinationState)) {
            state.screenState = destinationState;
            state.screenStates[screen.id] = destinationState;
          }
        }
        state.feedback = null;
        state.selectedRegion = null;
        state.inspectorOpen = false;
        location.hash = page;
        render();
        content.focus({preventScroll: true});
      };

      const makePageButton = (id, title, detail) => {
        const button = element("button", "page-button");
        button.type = "button";
        button.dataset.page = id;
        button.setAttribute("aria-current", state.page === id ? "page" : "false");
        button.append(element("strong", "", title), element("span", "", detail));
        button.addEventListener("click", () => selectPage(id));
        return button;
      };

      const renderNavigation = () => {
        pageList.replaceChildren();
        pageList.append(makePageButton("overview", "Overview", `${data.screens.length} surfaces`));
        let currentPlatformGroup = null;
        data.screens.forEach((screen) => {
          const platformGroup = screen.platformGroup || null;
          if (platformGroup && platformGroup !== currentPlatformGroup) {
            pageList.append(element("div", "platform-group", platformGroup));
            currentPlatformGroup = platformGroup;
          }
          pageList.append(makePageButton(screen.id, `${screen.id} · ${screen.name}`, screen.route));
        });
      };

      const targetFor = (screen, requestedTarget = state.responsiveTarget) => {
        const responsive = responsiveSpecFor(screen);
        return responsive.targets.includes(String(requestedTarget))
          ? String(requestedTarget)
          : responsive.targets[responsive.targets.length - 1];
      };

      const activeLayout = (screen, requestedTarget = state.responsiveTarget) =>
        screen.responsiveLayouts[targetFor(screen, requestedTarget)];

      const applyCanvasComposition = (canvas, layout) => {
        const composition = layout?.composition?.canvas;
        if (!composition) return;
        canvas.style.setProperty("--wf-canvas-padding", `${composition.padding}px`);
        canvas.style.setProperty("--wf-canvas-gap", `${composition.gap}px`);
      };

      const regionOrder = (screen, requestedTarget = state.responsiveTarget) => {
        const layout = activeLayout(screen, requestedTarget);
        const order = new Map(layout.order.map((id, index) => [id, index]));
        return [...screen.regions].sort((a, b) => (order.get(a.id) ?? 999) - (order.get(b.id) ?? 999));
      };

      const appendList = (parent, label, values) => {
        if (!values?.length) return;
        parent.append(element("div", "meta-label", label));
        const list = element("ul");
        values.forEach((value) => list.append(element("li", "", value)));
        parent.append(list);
      };

      const copyText = (value) => {
        if (typeof value === "string") return value;
        if (value?.kind === "static") return value.text;
        if (value?.kind === "dynamic") return value.example;
        return value?.label || "";
      };

      const copyRole = (value) =>
        typeof value === "string" ? "legacy copy" : value?.role || "dynamic content";

      const copyCategory = (value) => {
        const role = copyRole(value).toLowerCase();
        if (role.includes("section heading")) return "section-heading";
        if (role.includes("feature heading") || role.includes("item heading")) {
          return "item-heading";
        }
        if (role.includes("heading") || role.includes("title")) return "display";
        return "body";
      };

      const actionLabel = (value) =>
        typeof value === "string" ? value : value?.label || "";

      const appendElements = (parent, values) => {
        if (!values?.length) return;
        parent.append(element("h3", "", "Product copy"));
        values.forEach((value) => {
          const card = element("div", "inspector-card");
          card.append(
            element("div", "meta-label", copyRole(value)),
            element("p", "", copyText(value))
          );
          if (typeof value === "object") {
            card.append(
              element("span", "copy-status", value.status || "legacy"),
              element("p", "", `Source: ${value.source || "legacy contract"}`)
            );
            if (value.contract && typeof value.contract === "object") {
              const contract = element("div", "display-contract");
              Object.entries(value.contract).forEach(([key, text]) => {
                contract.append(element("div", "", `${key}: ${text}`));
              });
              card.append(contract);
            }
          }
          parent.append(card);
        });
      };

      const renderCopyItem = (value) => {
        const category = copyCategory(value);
        const tag = {display: "h2", "section-heading": "h3", "item-heading": "h4"}[category] || "span";
        const node = element(tag, "copy-item", copyText(value));
        const role = copyRole(value).toLowerCase();
        node.dataset.copyRole = role;
        node.dataset.copyKind = value?.kind || (value?.contract ? "dynamic" : "static");
        node.dataset.copyCategory = category;
        if (value?.locale) node.setAttribute("lang", value.locale);
        if (value?.direction) node.setAttribute("dir", value.direction);
        if (value?.parallel?.length) {
          node.textContent = "";
          const primary = element("span", "copy-language", copyText(value));
          if (value.locale) primary.setAttribute("lang", value.locale);
          primary.setAttribute("dir", value.direction || "auto");
          node.append(primary);
          value.parallel.forEach((paired) => {
            const line = element("span", "copy-language", copyText(paired));
            line.setAttribute("lang", paired.locale);
            line.setAttribute("dir", paired.direction || "auto");
            node.append(line);
          });
        }
        return node;
      };

      const localSearchConfigFor = (screen) =>
        data.schema === "wireframes/4" && screen && screen.localSearch && typeof screen.localSearch === "object"
          ? screen.localSearch
          : null;

      const localSearchStateFor = (screenId, config) => {
        if (!state.localSearch) state.localSearch = Object.create(null);
        const firstLanguage = config?.languageOptions?.[0]?.value || "";
        const search = state.localSearch[screenId] || {
          query: "",
          language: firstLanguage,
          mode: "initial"
        };
        if (!config?.languageOptions?.some((option) => option.value === search.language)) {
          search.language = firstLanguage;
        }
        state.localSearch[screenId] = search;
        return search;
      };

      const localSearchRowsFor = (config, search) => {
        const firstLanguage = config.languageOptions?.[0]?.value;
        const query = String(search.query || "").trim().toLocaleLowerCase();
        return (config.items || []).filter((item) => {
          const languageMatches = search.language === firstLanguage || item.language === search.language;
          const searchable = `${item.searchText || ""} ${copyText(item.copy)}`.toLocaleLowerCase();
          return languageMatches && (!query || searchable.includes(query));
        });
      };

      const localSearchModeFor = (config, search, activeState) => {
        if (!activeState) return search.mode;
        for (const key of ["initial", "results", "empty"]) {
          if (activeState.id === config.states[key]) return key;
        }
        return null;
      };

      const focusLocalSearchQuery = (screenId) => {
        if (state.page !== screenId || !content?.querySelector) return;
        const input = content.querySelector(`[data-local-search-query="${screenId}"]`);
        if (input && typeof input.focus === "function") input.focus({preventScroll: true});
      };

      const applyLocalSearch = (screenId) => {
        const screen =
          typeof data !== "undefined" && Array.isArray(data.screens)
            ? data.screens.find((item) => item.id === screenId)
            : null;
        const config = localSearchConfigFor(screen);
        if (!config) return;
        const search = localSearchStateFor(screenId, config);
        const firstLanguage = config.languageOptions?.[0]?.value;
        const hasFilter = Boolean(String(search.query || "").trim()) || search.language !== firstLanguage;
        const rows = localSearchRowsFor(config, search);
        search.mode = !hasFilter ? "initial" : rows.length ? "results" : "empty";
        state.screenState = config.states[search.mode];
        state.screenStates[screenId] = state.screenState;
        if (screenId === state.page) {
          renderStateControls(screen);
          renderScreen(screen);
          focusLocalSearchQuery(screenId);
        }
      };

      const resetLocalSearch = (screenId) => {
        const screen = data.screens.find((item) => item.id === screenId);
        const config = localSearchConfigFor(screen);
        if (!config) return;
        const search = localSearchStateFor(screenId, config);
        search.query = "";
        search.language = config.languageOptions?.[0]?.value || "";
        search.mode = "initial";
        state.fieldValues[`local-search:${screenId}:query`] = "";
        applyLocalSearch(screenId);
      };

      const renderLocalSearchControls = (parent, screenId, config) => {
        const search = localSearchStateFor(screenId, config);
        const controls = element("div", "local-search-controls");
        controls.dataset.localSearchScreen = screenId;

        const queryField = element("label", "form-field");
        const queryId = `local-search-query-${screenId.replace(/[^a-z0-9_-]+/gi, "-")}`;
        const queryLabel = renderCopyItem(config.queryLabel);
        const queryInput = element("input", "field-input");
        queryInput.type = "search";
        queryInput.id = queryId;
        queryInput.value = search.query || "";
        queryInput.setAttribute("data-local-search-query", screenId);
        queryLabel.setAttribute("for", queryId);
        queryInput.addEventListener("input", () => {
          search.query = queryInput.value;
          state.fieldValues[`local-search:${screenId}:query`] = queryInput.value;
        });
        queryInput.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          search.query = queryInput.value;
          applyLocalSearch(screenId);
        });
        queryField.append(queryLabel, queryInput);

        const languageField = element("label", "form-field");
        const languageId = `local-search-language-${screenId.replace(/[^a-z0-9_-]+/gi, "-")}`;
        const languageLabel = renderCopyItem(config.languageLabel);
        const languageSelect = element("select", "field-input");
        languageSelect.id = languageId;
        languageSelect.setAttribute("data-local-search-language", screenId);
        config.languageOptions.forEach((optionData) => {
          const option = element("option", "", copyText(optionData.copy));
          option.value = optionData.value;
          option.textContent = copyText(optionData.copy);
          languageSelect.append(option);
        });
        languageSelect.value = search.language;
        languageLabel.setAttribute("for", languageId);
        languageSelect.addEventListener("change", () => {
          search.language = languageSelect.value;
          applyLocalSearch(screenId);
        });
        languageField.append(languageLabel, languageSelect);
        controls.append(queryField, languageField);
        parent.append(controls);
      };

      // Presentation uses existing copy records; it never invents product wording.
      const renderRegionContent = (parent, region, screenId = "wireframe") => {
        const kind = region.presentation || "content";
        if (kind === "table") {
          const table = element("table", "content-table");
          const headers = region.elements.filter((item) => copyRole(item) === "table header");
          const cells = region.elements.filter((item) => copyRole(item) === "table cell");
          const head = element("thead");
          const row = element("tr");
          headers.forEach((item) => {
            const cell = element("th");
            cell.setAttribute("scope", "col");
            cell.append(renderCopyItem(item));
            row.append(cell);
          });
          head.append(row);
          const body = element("tbody");
          if (headers.length) {
            for (let index = 0; index < cells.length; index += headers.length) {
              const row = element("tr");
              cells.slice(index, index + headers.length).forEach((item) => {
                const cell = element("td");
                cell.append(renderCopyItem(item));
                row.append(cell);
              });
              body.append(row);
            }
          }
          region.elements.filter((item) => !["table header", "table cell"].includes(copyRole(item)))
            .forEach((item) => parent.append(renderCopyItem(item)));
          table.append(head, body);
          parent.append(table);
        } else if (kind === "form") {
          let field = null;
          let fieldIndex = 0;
          region.elements.forEach((item) => {
            if (copyRole(item) === "field label") {
              const fieldKey = `${screenId}:${region.id || "form"}:${fieldIndex}`;
              field = {node: element("label", "form-field"), input: null, key: fieldKey};
              const label = renderCopyItem(item);
              const input = element("input", "field-input");
              input.type = "text";
              input.id = `wireframe-${fieldKey.replace(/[^a-z0-9_-]+/gi, "-")}`;
              input.dataset.fieldKey = fieldKey;
              if (
                typeof state !== "undefined" &&
                state.fieldValues &&
                Object.prototype.hasOwnProperty.call(state.fieldValues, fieldKey)
              ) {
                input.value = state.fieldValues[fieldKey];
              }
              input.addEventListener("input", () => {
                if (typeof state !== "undefined" && state.fieldValues) {
                  state.fieldValues[fieldKey] = input.value;
                }
              });
              label.setAttribute("for", input.id);
              field.input = input;
              field.node.append(label, input);
              parent.append(field.node);
              fieldIndex += 1;
            } else if (copyRole(item) === "field value" && field) {
              const hasRememberedValue =
                typeof state !== "undefined" &&
                state.fieldValues &&
                Object.prototype.hasOwnProperty.call(state.fieldValues, field.key);
              if (!hasRememberedValue) field.input.value = copyText(item);
            } else {
              field = null;
              parent.append(renderCopyItem(item));
            }
          });
        } else if (kind === "list") {
          const list = element("ul", "content-list");
          region.elements.forEach((item) => {
            if (copyRole(item) === "list item") {
              const row = element("li");
              row.append(renderCopyItem(item));
              list.append(row);
            } else parent.append(renderCopyItem(item));
          });
          parent.append(list);
        } else {
          region.elements.forEach((item) => parent.append(renderCopyItem(item)));
        }
      };

      const renderLocalSearchResults = (
        parent,
        region,
        screenId,
        config,
        activeState,
        mode
      ) => {
        const search = localSearchStateFor(screenId, config);
        region.elements
          .filter((item) => copyRole(item) !== "list item")
          .forEach((item) => parent.append(renderCopyItem(item)));
        const treatment = activeState?.treatments?.[region.id];
        const treatmentCopy = typeof treatment === "object" ? treatment.copy || [] : [];
        treatmentCopy.forEach((item) => parent.append(renderCopyItem(item)));
        if (mode !== "results") return;
        const list = element("ul", "content-list local-search-results");
        list.setAttribute("data-local-search-results", screenId);
        localSearchRowsFor(config, search).forEach((item) => {
          const row = element("li");
          row.append(renderCopyItem(item.copy));
          list.append(row);
        });
        parent.append(list);
      };

      const flowTarget = (target, destinationState = null) => {
        const screen = data.screens.find((screen) => screen.id === target);
        if (screen) {
          const button = element("button", "flow-target", `${screen.name} (${screen.id})`);
          button.type = "button";
          button.addEventListener("click", () => selectPage(target, destinationState));
          return button;
        }
        return element("span", "flow-target", target);
      };

      const destinationSurface = (flow) => flow.destination?.surface || flow.to;

      const screenFlows = (screenId) =>
        (data.flows || []).filter((flow) => flow.from === screenId || destinationSurface(flow) === screenId);

      const flowDescription = (flow) => {
        if (!flow) return "Destination not recorded. Resolve this before approval.";
        const targetId = destinationSurface(flow);
        const target = data.screens.find((screen) => screen.id === targetId);
        const name = target ? `${target.name} (${target.id})` : targetId;
        const source = data.screens.find((screen) => screen.id === flow.from);
        const search = source?.localSearch;
        if (search && flow.trigger === search.submitAction) return "Stay on this page and update the search results using the current query and language.";
        if (search && flow.trigger === search.clearAction) return "Stay on this page, clear the query and restore the initial results and language.";
        if (flow.presentation === "overlay") return `Open the ${name} dialog over this page. Closing it returns to this page.`;
        if (flow.presentation === "page") return `Go to ${name}${target?.route ? ` — ${target.route}` : ""}${flow.destination?.state ? ` in ${flow.destination.state} state` : ""}.`;
        if (flow.presentation === "state" || flow.presentation === "tab") return `Show ${name} in ${flow.destination.state} state.`;
        return `Stay on this page and show: ${copyText(flow.feedback) || "Feedback not recorded"}. Recorded result: ${name}. No external request is made in this prototype.`;
      };

      const outgoingFlow = (screenId, trigger, controlId = null) =>
        (data.flows || []).find((flow) => flow.from === screenId && flow.trigger === trigger &&
          (data.schema !== "wireframes/5" || (flow.sourceState === state.screenState && flow.control === controlId)));

      const openFlowDialog = (flow) => {
        const target = data.screens.find((screen) => screen.id === (flow.destination?.surface || flow.to));
        if (!target) return;
        const dialog = element("dialog", "flow-dialog");
        const body = element("div", "flow-dialog-body");
        const titleId = `flow-dialog-title-${target.id}`;
        const title = element("h2", "", `${target.id} · ${target.name}`);
        title.id = titleId;
        dialog.setAttribute("aria-labelledby", titleId);
        body.append(title, element("div", "eyebrow", "Overlay preview"), element("p", "", target.goal));
        const targetResponsive = responsiveSpecFor(target);
        const targetResponsiveTarget = targetFor(target, state.responsiveTarget);
        const targetLayout = target.responsiveLayouts[targetResponsiveTarget];
        const targetState = target.states.find((item) => item.id === flow.destination?.state) || target.states[0];
        const hidden = new Set(targetLayout.hidden);
        const overlayCanvas = element("div", "wireframe");
        overlayCanvas.setAttribute("role", "group");
        overlayCanvas.style.gridTemplateColumns = `repeat(${targetLayout.columns}, minmax(0, 1fr))`;
        const overlayComposition = targetLayout.composition?.canvas;
        if (overlayComposition) {
          overlayCanvas.style.setProperty("--wf-canvas-padding", `${overlayComposition.padding}px`);
          overlayCanvas.style.setProperty("--wf-canvas-gap", `${overlayComposition.gap}px`);
        }
        const targetCanvasWidth = targetResponsive.canvasWidths[targetResponsiveTarget];
        if (targetCanvasWidth !== undefined) {
          overlayCanvas.style.width = `${targetCanvasWidth}px`;
          overlayCanvas.style.maxWidth = "none";
          const dialogWidth = Number(targetCanvasWidth) + 40 + 2;
          dialog.style.width = `min(calc(100vw - 32px), ${dialogWidth}px)`;
          dialog.style.maxWidth = "calc(100vw - 32px)";
        }
        overlayCanvas.setAttribute(
          "aria-label",
          `${target.name} overlay, ${targetResponsiveTarget}, ${targetState.id}`
        );
        regionOrder(target, targetResponsiveTarget)
          .filter((region) => !hidden.has(region.id))
          .forEach((region) => overlayCanvas.append(renderRegion(target.id, region, targetState, targetLayout, false)));
        body.append(overlayCanvas);
        const actions = element("div", "flow-dialog-actions");
        const openPage = element("button", "action-button", "Open full page");
        openPage.type = "button";
        openPage.addEventListener("click", () => {
          dialog.close();
          selectPage(target.id, targetState.id);
        });
        const close = element("button", "action-button", "Close");
        close.type = "button";
        close.addEventListener("click", () => dialog.close());
        actions.append(openPage, close);
        body.append(actions);
        dialog.append(body);
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) dialog.close();
        });
        dialog.addEventListener("close", () => dialog.remove());
        document.body.append(dialog);
        dialog.showModal();
      };

      const runFlow = (flow, feedback) => {
        if (!flow) return;
        if (flow.presentation === "page") {
          document.querySelectorAll("dialog[open]").forEach((dialog) => dialog.close());
          selectPage(flow.destination?.surface || flow.to, flow.destination?.state);
        } else if (flow.presentation === "overlay") {
          openFlowDialog(flow);
        } else if (flow.presentation === "feedback" && flow.feedback) {
          if (data.schema === "wireframes/5" && flow.destination?.surface) {
            selectPage(flow.destination.surface, flow.destination.state);
            state.feedback = flow.feedback;
            const next = currentScreen();
            if (next) renderScreen(next);
          } else feedback.replaceChildren(renderCopyItem(flow.feedback));
        } else if (data.schema === "wireframes/5" && ["state", "tab"].includes(flow.presentation)) {
          selectPage(flow.destination?.surface || flow.to, flow.destination?.state);
        }
      };

      const appendActions = (parent, screenId, actions, primaryAction, localSearch = null, menu = null) => {
        if (!actions?.length) return;
        const availableActions = data.schema === "wireframes/5"
          ? actions.filter((action) => outgoingFlow(screenId, actionLabel(action), action.id)) : actions;
        if (!availableActions.length) return;
        const actionList = element("div", "action-list");
        const feedback = element("div", "action-feedback");
        feedback.setAttribute("role", "status");
        let toggle = null;
        let menuKey = null;
        if (menu) {
          menuKey = `${screenId}|${menu.id}`;
          state.navigationMenus ||= Object.create(null);
          const open = state.navigationMenus[menuKey] ?? menu.defaultOpen === true;
          state.navigationMenus[menuKey] = open;
          toggle = element("button", "nav-toggle");
          toggle.type = "button";
          const menuId = `product-menu-${menuKey.replace(/[^a-z0-9_-]+/gi, "-")}`;
          actionList.id = menuId;
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute("aria-controls", menuId);
          const icon = element("span", "menu-icon", "☰");
          icon.setAttribute("aria-hidden", "true");
          toggle.append(icon, renderCopyItem(menu.label));
          const closeMenu = () => {
            state.navigationMenus[menuKey] = false;
            toggle.setAttribute("aria-expanded", "false");
            actionList.hidden = true;
            toggle.focus({preventScroll: true});
          };
          toggle.addEventListener("click", () => {
            const next = toggle.getAttribute("aria-expanded") !== "true";
            state.navigationMenus[menuKey] = next;
            toggle.setAttribute("aria-expanded", String(next));
            actionList.hidden = !next;
          });
          toggle.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && toggle.getAttribute("aria-expanded") === "true") {
              event.preventDefault();
              closeMenu();
            }
            const menuButtons = Array.from(actionList.querySelectorAll("button"));
            const itemIndex = menuButtons.findIndex((item) => item === document.activeElement);
            if (["ArrowDown", "ArrowUp"].includes(event.key) && toggle.getAttribute("aria-expanded") === "true") {
              event.preventDefault();
              const next = event.key === "ArrowDown"
                ? (itemIndex + 1) % menuButtons.length
                : (itemIndex - 1 + menuButtons.length) % menuButtons.length;
              menuButtons[next]?.focus({preventScroll: true});
            }
          });
          actionList.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && toggle.getAttribute("aria-expanded") === "true") {
              event.preventDefault();
              closeMenu();
            }
          });
          actionList.hidden = !open;
        }
        availableActions.forEach((action) => {
          const label = actionLabel(action);
          const flow = outgoingFlow(screenId, label, action.id);
          const button = element("button", "action-button", label);
          button.type = "button";
          if (action.id) button.dataset.controlId = action.id;
          button.dataset.flowTrigger = label;
          button.dataset.emphasis = label === primaryAction ? "primary" : (action.variant || "secondary");
          button.dataset.size = action.size || "regular";
          button.dataset.fullWidth = String(action.fullWidth === true);
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            if (localSearch && label === localSearch.submitAction) {
              applyLocalSearch(screenId);
              return;
            }
            if (localSearch && label === localSearch.clearAction) {
              resetLocalSearch(screenId);
              return;
            }
            runFlow(flow, feedback);
          });
          actionList.append(button);
        });
        if (menu) {
          parent.append(toggle, actionList, feedback);
        } else {
          parent.append(actionList, feedback);
        }
      };

      const appendTabControls = (parent, screen, region) => {
        const tabs = region.controls?.tabs || null;
        if (!Array.isArray(tabs) || !tabs.length) return;
        const tablist = element("div", "product-tablist");
        tablist.setAttribute("role", "tablist");
        tablist.setAttribute("aria-label", `${region.section} views`);
        tabs.forEach((tabConfig) => {
          const stateId = tabConfig.state;
          const selected = state.screenState === stateId;
          const tab = element("button", "product-tab", copyText(tabConfig.label));
          tab.type = "button";
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", String(selected));
          tab.setAttribute("aria-controls", `${screen.id}-${region.id}-panel`);
          tab.dataset.productTab = stateId;
          tab.dataset.controlId = tabConfig.id;
          if (selected) tab.tabIndex = 0; else tab.tabIndex = -1;
          tab.addEventListener("click", () => {
            const flow = data.schema === "wireframes/5"
              ? outgoingFlow(screen.id, copyText(tabConfig.label), tabConfig.id) : null;
            if (flow) {
              runFlow(flow, null);
              const active = content.querySelector(`[data-product-tab="${CSS.escape(flow.destination?.state || stateId)}"]`);
              active?.focus({preventScroll: true});
              return;
            }
            state.screenState = stateId;
            state.screenStates[screen.id] = stateId;
            renderScreen(screen);
            renderStateControls(screen);
            const active = content.querySelector(`[data-product-tab="${CSS.escape(stateId)}"]`);
            active?.focus({preventScroll: true});
          });
          tab.addEventListener("keydown", (event) => {
            if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
            event.preventDefault();
            const members = Array.from(tablist.querySelectorAll('[role="tab"]'));
            const index = members.indexOf(tab);
            const next = event.key === "Home" ? 0 : event.key === "End" ? members.length - 1
              : (index + (event.key === "ArrowRight" ? 1 : -1) + members.length) % members.length;
            members[next]?.click();
          });
          tablist.append(tab);
        });
        parent.append(tablist);
      };

      const renderRegion = (screenId, region, activeState, layout, allowReview = true) => {
        const node = element(region.presentation === "navigation" ? "nav" : "section", "region");
        node.dataset.region = region.id;
        node.dataset.priority = region.priority || "secondary";
        node.dataset.presentation = region.presentation || "content";
        node.style.setProperty("--span", String(layout.spans[region.id]));
        const regionComposition = layout.composition?.regions?.[region.id] || {};
        const actionsPlacement = regionComposition.actionsPlacement || "after";
        node.dataset.actionsPlacement = actionsPlacement;
        if (regionComposition.padding !== undefined) {
          node.style.setProperty("--wf-region-padding", `${regionComposition.padding}px`);
        }
        if (regionComposition.gap !== undefined) {
          node.style.setProperty("--wf-region-gap", `${regionComposition.gap}px`);
        }
        if (regionComposition.maxWidth !== undefined) {
          node.style.setProperty("--wf-region-max-width", `${regionComposition.maxWidth}px`);
        }
        if (regionComposition.itemColumns !== undefined) {
          node.style.setProperty("--wf-item-columns", String(regionComposition.itemColumns));
        }
        if (regionComposition.mediaAspectRatio !== undefined) {
          node.style.setProperty("--wf-media-aspect-ratio", String(regionComposition.mediaAspectRatio));
        }

        const head = element("div", "region-head");
        const title = element("div");
        title.append(element("div", "section-kind", region.id), element("h3", "", region.section));
        const headActions = element("div", "toolbar-cluster");
        headActions.append(element("span", "priority", region.priority || "secondary"));
        if (allowReview) {
          const review = element("button", "review-trigger", "Review details");
          review.type = "button";
          review.addEventListener("click", () => openRegionInspector(screenId, region.id));
          headActions.append(review);
        }
        head.append(title, headActions);
        node.append(head);

        const productCopy = element("div", "product-copy");
        const screen =
          typeof data !== "undefined" && Array.isArray(data.screens)
            ? data.screens.find((item) => item.id === screenId)
            : null;
        const localSearch = allowReview ? localSearchConfigFor(screen) : null;
        const localActionConfig = localSearch && region.id === localSearch.formRegion ? localSearch : null;
        const searchState = localSearch ? localSearchStateFor(screenId, localSearch) : null;
        const searchMode = localSearch
          ? localSearchModeFor(localSearch, searchState, activeState)
          : null;
        const handlesSearchResults =
          localSearch &&
          region.id === localSearch.resultsRegion &&
          (searchMode === "results" || searchMode === "empty");
        const treatment = activeState?.treatments?.[region.id];
        if (region.controls?.tabs?.length) {
          productCopy.id = `${screen.id}-${region.id}-panel`;
          productCopy.setAttribute("role", "tabpanel");
          appendTabControls(productCopy, screen, region);
        }
        const selectedTarget = Object.entries(screen?.responsiveLayouts || {}).find(([, candidate]) => candidate === layout)?.[0];
        const navigationControls = data.schema === "wireframes/5" ? region.controls?.menus : null;
        const declaredMenu = Array.isArray(navigationControls)
          ? navigationControls.find((item) => item.targets?.includes(selectedTarget))
          : null;
        if (actionsPlacement === "before") {
          appendActions(productCopy, screenId, region.actions, region.primaryAction, localActionConfig, declaredMenu);
        }
        if (handlesSearchResults) {
          renderLocalSearchResults(productCopy, region, screenId, localSearch, activeState, searchMode);
        } else if (!treatment?.copy?.length) {
          renderRegionContent(productCopy, region, screenId);
        }
        if (localActionConfig) renderLocalSearchControls(productCopy, screenId, localActionConfig);
        if (actionsPlacement !== "before") {
          appendActions(productCopy, screenId, region.actions, region.primaryAction, localActionConfig, declaredMenu);
        }
        if (region.mediaIntent && !treatment?.copy?.length) {
          productCopy.append(
            element("div", "media-placeholder", `Deferred ${region.mediaIntent.treatment} position`)
          );
        }
        if (treatment && !handlesSearchResults) {
          const stateNote = element("div", "state-note");
          const treatmentCopy = typeof treatment === "string" ? [] : treatment.copy || [];
          if (treatmentCopy.length) {
            treatmentCopy.forEach((value) => stateNote.append(renderCopyItem(value)));
          } else if (typeof treatment === "string") {
            stateNote.append(element("div", "", `${activeState.label}: ${treatment}`));
          }
          productCopy.append(stateNote);
        }
        if (region.disclosure?.targets?.includes(selectedTarget)) {
          const details = element("details", "navigation-disclosure");
          state.navigationOpen ||= Object.create(null);
          const disclosureKey = `${screenId}|${region.id}|${selectedTarget}`;
          details.open = state.navigationOpen[disclosureKey] === true;
          const summary = element("summary", "navigation-toggle");
          const icon = element("span", "", "☰");
          icon.setAttribute("aria-hidden", "true");
          summary.append(icon, renderCopyItem(region.disclosure.label));
          const close = () => { details.open = false; summary.focus(); };
          details.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && details.open) { event.preventDefault(); close(); }
          });
          details.addEventListener("toggle", () => {
            if (!details.isConnected) return;
            state.navigationOpen[disclosureKey] = details.open;
            const canvas = node.closest(".wireframe");
            const shell = node.closest(".canvas-shell");
            const panel = content.querySelector("[data-layout-qa]");
            if (allowReview && canvas && shell && panel && screen === currentScreen()) {
              runLayoutQa(canvas, shell, panel, screen);
            }
          });
          details.append(summary, productCopy);
          node.append(details);
        } else node.append(productCopy);
        if (region.mediaIntent?.motionSpec && !treatment?.copy?.length) {
          node.dataset.motionRegion = "true";
          const note = element("aside", "motion-annotation");
          note.setAttribute("aria-label", "Animation intent, not produced motion");
          note.append(element("strong", "", `Animation region — deferred: ${region.mediaIntent.motionSpec.scope}`));
          note.append(element("p", "", `Trigger: ${region.mediaIntent.trigger}`));
          Object.entries(region.mediaIntent.motionSpec).forEach(([key, value]) => {
            if (key !== "scope") note.append(element("p", "", `${key}: ${value}`));
          });
          note.append(element("p", "", `Reduced motion: ${region.mediaIntent.reducedMotionFallback}`));
          node.append(note);
        }
        return node;
      };

      const setInspectorOpen = (open) => {
        const wasOpen = state.inspectorOpen;
        if (open && !wasOpen) inspectorReturnFocus = document.activeElement;
        state.inspectorOpen = open;
        inspector.dataset.open = String(open);
        inspectorBackdrop.dataset.open = String(open);
        inspectorBackdrop.hidden = !open;
        inspector.setAttribute("aria-hidden", String(!open));
        inspector.inert = !open;
        if (open) {
          inspectorClose.focus({preventScroll: true});
        } else if (wasOpen && inspectorReturnFocus?.focus) {
          inspectorReturnFocus.focus({preventScroll: true});
        }
      };

      const renderInspector = () => {
        inspectorContent.replaceChildren();
        const screen = currentScreen();
        if (!screen) {
          inspectorTitle.textContent = "Structure notes";
          inspectorContent.append(
            element(
              "p",
              "",
              "Open a page, then select Review details on a region. This panel is reviewer-only and never becomes product copy."
            )
          );
          return;
        }

        const layout = activeLayout(screen);
        const region = screen.regions.find((item) => item.id === state.selectedRegion);
        if (!region) {
          inspectorTitle.textContent = `${screen.id} structure`;
          inspectorContent.append(
            element("div", "meta-label", "Reviewer only"),
            element("p", "", screen.goal),
            element("span", "copy-status", `Copy ${screen.copyStatus || "legacy"}`),
            element("h3", "", "Responsive rule"),
            element("p", "", layout.reflow),
            element("p", "", layout.interaction)
          );
          appendList(inspectorContent, "Traces", screen.traces);
          return;
        }

        inspectorTitle.textContent = region.section;
        inspectorContent.append(
          element("div", "meta-label", `${screen.id} · ${region.id}`),
          element("p", "", region.purpose),
          element("span", "copy-status", `${region.priority || "secondary"} priority`),
          element("h3", "", "Current layout"),
          element(
            "p",
            "",
            `${state.responsiveTarget}: span ${layout.spans[region.id]} of ${layout.columns}`
          )
        );
        appendElements(inspectorContent, region.elements);
        if (region.actions?.length) {
          inspectorContent.append(element("h3", "", "Action copy"));
          region.actions.forEach((action) => {
            const card = element("div", "inspector-card");
            card.append(
              element("p", "", actionLabel(action)),
              element("p", "", flowDescription(outgoingFlow(screen.id, actionLabel(action), action.id))),
              element("span", "copy-status", action.status || "legacy"),
              element("p", "", `Source: ${action.source || "legacy contract"}`)
            );
            inspectorContent.append(card);
          });
        }
        appendList(inspectorContent, "Traces", region.traces);
        const activeState = screen.states.find((item) => item.id === state.screenState);
        const treatment = activeState?.treatments?.[region.id];
        if (treatment) {
          inspectorContent.append(
            element("h3", "", `${activeState.label} treatment`),
            element("p", "", typeof treatment === "string" ? treatment : treatment.layout)
          );
          if (typeof treatment === "object") appendElements(inspectorContent, treatment.copy);
        }
        if (region.mediaIntent) {
          inspectorContent.append(
            element("h3", "", "Deferred media intent"),
            element(
              "p",
              "",
              `${region.mediaIntent.treatment}: ${region.mediaIntent.draftPrompt}`
            ),
            element("p", "", `Source: ${region.mediaIntent.source}`)
          );
        }
      };

      const openRegionInspector = (screenId, regionId) => {
        if (state.page !== screenId) return;
        state.selectedRegion = regionId;
        renderInspector();
        setInspectorOpen(true);
      };

      const copyRecords = () => {
        const records = [];
        data.screens.forEach((screen) => {
          screen.regions.forEach((region) => {
            if (region.disclosure) records.push({scope: `${screen.id} · ${region.id} · navigation toggle`, value: region.disclosure.label});
            region.elements.forEach((value) => {
              records.push({scope: `${screen.id} · ${region.id}`, value});
            });
            region.actions.forEach((action) => {
              records.push({
                scope: `${screen.id} · ${region.id} · action`,
                value: typeof action === "string"
                  ? action
                  : {...action, kind: "static", role: "action", text: action.label}
              });
            });
          });
          screen.states.forEach((screenState) => {
            Object.entries(screenState.treatments || {}).forEach(([regionId, treatment]) => {
              if (typeof treatment !== "object") return;
              (treatment.copy || []).forEach((value) => {
                records.push({scope: `${screen.id} · ${regionId} · ${screenState.id}`, value});
              });
            });
          });
          const localSearch = localSearchConfigFor(screen);
          if (localSearch) {
            records.push(
              {scope: `${screen.id} · localSearch · query label`, value: localSearch.queryLabel},
              {scope: `${screen.id} · localSearch · language label`, value: localSearch.languageLabel}
            );
            (localSearch.languageOptions || []).forEach((option) => {
              records.push({
                scope: `${screen.id} · localSearch · language option · ${option.value}`,
                value: option.copy
              });
            });
            (localSearch.items || []).forEach((item, index) => {
              records.push({
                scope: `${screen.id} · localSearch · item ${index + 1}`,
                value: item.copy
              });
            });
          }
        });
        (data.flows || [])
          .filter((flow) => flow.presentation === "feedback" && flow.feedback)
          .forEach((flow) => {
            records.push({scope: `${flow.from} · ${flow.trigger} · feedback`, value: flow.feedback});
          });
        return records.flatMap((record) => [record, ...(record.value?.parallel || []).map((value) => ({
          scope: `${record.scope} · paired ${value.locale}`, value
        }))]);
      };

      const renderCopyInventory = () => {
        copyInventoryList.replaceChildren();
        copyRecords().forEach(({scope, value}) => {
          const record = element("article", "copy-record");
          const identity = element("div");
          identity.append(
            element("code", "", scope),
            element("p", "", copyRole(value)),
            element("span", "copy-status", value?.status || "legacy")
          );
          const detail = element("div");
          detail.append(
            element("p", "", copyText(value)),
            element("p", "", `Source: ${value?.source || "legacy contract"}`)
          );
          if (value?.contract) {
            const contract = element("div", "display-contract");
            Object.entries(value.contract).forEach(([key, text]) => {
              contract.append(element("div", "", `${key}: ${text}`));
            });
            detail.append(contract);
          }
          record.append(identity, detail);
          copyInventoryList.append(record);
        });
      };

      const renderStateControls = (screen) => {
        stateControls.replaceChildren();
        if (!screen) return;
        screen.states.forEach((screenState) => {
          const button = element("button", "control", screenState.label);
          button.type = "button";
          button.setAttribute("data-screen-state", screenState.id);
          button.setAttribute("aria-pressed", String(state.screenState === screenState.id));
          button.addEventListener("click", () => {
            state.screenState = screenState.id;
            state.screenStates[screen.id] = screenState.id;
            renderScreen(screen);
            renderStateControls(screen);
          });
          stateControls.append(button);
        });
      };

      const renderResponsiveControls = () => {
        responsiveControls.replaceChildren();
        const screen = currentScreen();
        if (!screen) return;
        const responsive = responsiveSpecFor(screen);
        if (!responsive.targets.includes(state.responsiveTarget)) {
          state.responsiveTarget = responsive.targets[responsive.targets.length - 1];
        }
        responsive.targets.forEach((target) => {
          const suffix = responsive.kind === "viewports" ? "px" : "";
          const button = element("button", "control", `${target}${suffix}`);
          button.type = "button";
          button.setAttribute("data-responsive-target", target);
          button.setAttribute("aria-pressed", String(state.responsiveTarget === target));
          button.addEventListener("click", () => {
            state.responsiveTarget = target;
            renderResponsiveControls();
            const screen = currentScreen();
            if (screen) renderScreen(screen);
          });
          responsiveControls.append(button);
        });
      };

      const rectanglesOverlap = (left, right) =>
        Math.min(left.right, right.right) - Math.max(left.left, right.left) > 1 &&
        Math.min(left.bottom, right.bottom) - Math.max(left.top, right.top) > 1;

      let qaGeneration = 0;
      const runLayoutQa = (canvas, shell, panel, screen) => {
        const generation = ++qaGeneration;
        const qaScreen = screen;
        const qaTarget = targetFor(screen);
        const qaState = state.screenState;
        requestAnimationFrame(() => {
          if (
            generation !== qaGeneration ||
            !canvas.isConnected ||
            !shell.isConnected ||
            !panel.isConnected ||
            currentScreen() !== qaScreen ||
            targetFor(qaScreen) !== qaTarget ||
            state.screenState !== qaState
          ) return;
          const regions = [...canvas.querySelectorAll(":scope > [data-region]")];
          const collisions = [];
          for (let leftIndex = 0; leftIndex < regions.length; leftIndex += 1) {
            for (let rightIndex = leftIndex + 1; rightIndex < regions.length; rightIndex += 1) {
              if (rectanglesOverlap(
                regions[leftIndex].getBoundingClientRect(),
                regions[rightIndex].getBoundingClientRect()
              )) {
                collisions.push(`${regions[leftIndex].dataset.region}/${regions[rightIndex].dataset.region}`);
              }
            }
          }
          const horizontalOverflow = canvas.scrollWidth > canvas.clientWidth + 1;
          const contentBoundaryViolations = [];
          const clippedContent = [];
          canvas.querySelectorAll(".copy-item, .action-button, .field-input").forEach((item) => {
            const region = item.closest("[data-region]");
            if (!region) return;
            const closedDisclosure = item.closest("details:not([open])");
            if (closedDisclosure && !closedDisclosure.querySelector("summary")?.contains(item)) return;
            const itemBounds = item.getBoundingClientRect();
            const regionBounds = region.getBoundingClientRect();
            if (
              itemBounds.left < regionBounds.left - 1 ||
              itemBounds.right > regionBounds.right + 1 ||
              itemBounds.top < regionBounds.top - 1 ||
              itemBounds.bottom > regionBounds.bottom + 1
            ) {
              contentBoundaryViolations.push(
                `${region.dataset.region}/${item.dataset.copyRole || item.dataset.flowTrigger || "control"}`
              );
            }
            const style = getComputedStyle(item);
            const clipsX = ["hidden", "clip"].includes(style.overflowX);
            const clipsY = ["hidden", "clip"].includes(style.overflowY);
            if (
              (clipsX && item.scrollWidth > item.clientWidth + 1) ||
              (item.matches("input") && item.scrollWidth > item.clientWidth + 1) ||
              (clipsY && item.scrollHeight > item.clientHeight + 1)
            ) {
              clippedContent.push(
                `${region.dataset.region}/${item.dataset.copyRole || item.dataset.flowTrigger || "control"}`
              );
            }
          });
          const expectedCanvasWidth = Number(
            responsiveSpecFor(qaScreen).canvasWidths[qaTarget]
          );
          const actualCanvasWidth = canvas.getBoundingClientRect().width;
          const canvasWidthMismatch = Math.abs(actualCanvasWidth - expectedCanvasWidth) > 1;
          const failures = [
            ...(collisions.length ? [`overlap: ${collisions.join(", ")}`] : []),
            ...(horizontalOverflow ? ["horizontal overflow"] : []),
            ...(contentBoundaryViolations.length
              ? [`copy/control boundary: ${contentBoundaryViolations.join(", ")}`]
              : []),
            ...(clippedContent.length
              ? [`clipped copy/control: ${clippedContent.join(", ")}`]
              : []),
            ...(canvasWidthMismatch
              ? [`review canvas ${actualCanvasWidth}px, expected ${expectedCanvasWidth}px`]
              : [])
          ];
          const status = failures.length ? "fail" : "pass";
          panel.setAttribute("data-layout-qa", status);
          panel.textContent = failures.length
            ? `Layout QA failed — ${failures.join("; ")}`
            : "Layout QA passed — no overlap, overflow, or clipped product copy";
          window.wireframeQaResults ||= {};
          window.wireframeQaResults[
            `${qaScreen.id}|${qaTarget}|${qaState}`
          ] = {
            status,
            collisions,
            horizontalOverflow,
            contentBoundaryViolations,
            clippedContent,
            canvasWidthMismatch
          };
        });
      };

      const renderScreenFlows = (screen) => {
        const flows = screenFlows(screen.id);
        if (!flows.length) return null;
        const panel = element("section", "flow-panel");
        panel.setAttribute("aria-label", `Flows for ${screen.id}`);
        panel.append(element("h3", "", "Where this page connects"));
        const list = element("ul", "flow-list");
        flows.forEach((flow) => {
          const item = element("li");
          if (flow.from === screen.id) {
            item.append(
              element("strong", "", `Select “${flow.trigger}”: `),
              element("span", "", flowDescription(flow)),
              flowTarget(destinationSurface(flow), flow.destination?.state)
            );
          } else {
            item.append(
              element("span", "flow-direction", "Arrive from "),
              flowTarget(flow.from),
              element("span", "", ` by selecting “${flow.trigger}”.`)
            );
          }
          list.append(item);
        });
        panel.append(list);
        return panel;
      };

      const renderRegionNotes = (screen, canvas, layout) => {
        const notes = element("section", "region-notes");
        notes.setAttribute("aria-label", "Layout and interaction annotations");
        notes.append(element("h2", "", "Layout and interactions"));
        const canvasStyle = getComputedStyle(canvas);
        notes.append(element("p", "", `Canvas ${Math.round(canvas.getBoundingClientRect().width)}px wide. Insets: ${canvasStyle.padding}. Row gap: ${canvasStyle.rowGap}; column gap: ${canvasStyle.columnGap}.`));
        notes.append(element("p", "", `${layout.reflow} ${layout.interaction}`));
        regionOrder(screen).forEach((region) => {
          const card = element("article", "region-note");
          card.append(element("h3", "", `${region.section} (${region.id})`), element("p", "", region.purpose));
          const node = Array.from(canvas.children).find((item) => item.dataset.region === region.id);
          if (node) {
            const style = getComputedStyle(node);
            card.append(element("p", "", `${layout.spans[region.id]} of ${layout.columns} columns; width ${Math.round(node.getBoundingClientRect().width)}px; padding ${style.padding}.`));
            const copy = node.querySelector(".product-copy");
            if (copy) {
              const copyStyle = getComputedStyle(copy);
              card.append(element("p", "", `Content row gap: ${copyStyle.rowGap}; column gap: ${copyStyle.columnGap}; maximum content width: ${copyStyle.maxWidth}.`));
            }
            const locate = element("button", "control", "Locate this region");
            locate.type = "button";
            locate.addEventListener("click", () => {
              node.tabIndex = -1;
              node.focus({preventScroll: true});
              node.scrollIntoView({block: "center", inline: "nearest"});
            });
            card.append(locate);
          } else card.append(element("p", "", "Hidden at this responsive target."));
          if (region.actions?.length) {
            const actions = element("dl");
            region.actions.forEach((action) => {
              const label = actionLabel(action);
              actions.append(element("dt", "", label), element("dd", "", flowDescription(outgoingFlow(screen.id, label, action.id))));
            });
            card.append(actions);
          }
          notes.append(card);
        });
        return notes;
      };

      const renderScreen = (screen) => {
        saveSelection(screen, state.responsiveTarget, state.screenState);
        content.replaceChildren();
        const header = element("header", "screen-header");
        const summary = element("div");
        summary.append(
          element("h2", "", screen.name),
          element("div", "eyebrow", `${screen.id} · ${screen.route}`),
          element("p", "", screen.goal)
        );
        const metadata = element("div", "metadata");
        const responsive = responsiveSpecFor(screen);
        const rows = [
          [responsive.kind === "viewports" ? "Viewport" : "Size class", state.responsiveTarget],
          ["State", state.screenState],
          ["Sections", String(screen.regions.length)],
          ["Copy", screen.copyStatus || "legacy"]
        ];
        if (screen.traces?.length) rows.push(["Traces", screen.traces.join(", ")]);
        if (screen.mediaIntent) {
          rows.push([
            "Media intent",
            `${screen.mediaIntent.treatment} · ${screen.mediaIntent.generationStatus}: ${screen.mediaIntent.draftPrompt} · source: ${screen.mediaIntent.source}`
          ]);
        }
        rows.push(["Authority", data.source]);
        rows.forEach(([label, value]) => {
          metadata.append(element("div", "meta-label", label), element("div", "", value));
        });
        header.append(summary, metadata);

        const layout = activeLayout(screen);
        const shell = element("div", "canvas-shell");
        const targetWidth = Number(responsive.canvasWidths[state.responsiveTarget]);
        shell.style.width = `${targetWidth}px`;
        shell.style.maxWidth = "none";
        const canvas = element("div", "wireframe");
        canvas.setAttribute("role", "group");
        canvas.style.gridTemplateColumns = `repeat(${layout.columns}, minmax(0, 1fr))`;
        applyCanvasComposition(canvas, layout);
        canvas.setAttribute("aria-label", `${screen.name}, ${state.responsiveTarget}, ${state.screenState}`);
        const activeState = screen.states.find((item) => item.id === state.screenState) || screen.states[0];
        const hidden = new Set(layout.hidden);
        regionOrder(screen)
          .filter((region) => !hidden.has(region.id))
          .forEach((region) => canvas.append(renderRegion(screen.id, region, activeState, layout)));
        shell.append(canvas);
        content.append(header, shell);
        if (state.feedback) {
          const status = element("div", "action-feedback");
          status.setAttribute("role", "status");
          status.append(renderCopyItem(state.feedback));
          content.append(status);
        }
        const responsiveNotes = element("div", "layout-qa");
        responsiveNotes.setAttribute("data-layout-qa", "pending");
        responsiveNotes.textContent = `Checking layout · ${layout.reflow} · ${layout.interaction}`;
        content.append(responsiveNotes);
        runLayoutQa(canvas, shell, responsiveNotes, screen);
        content.append(renderRegionNotes(screen, canvas, layout));
        const flows = renderScreenFlows(screen);
        if (flows) content.append(flows);
        if (state.inspectorOpen) renderInspector();
      };

      const renderOverviewFlows = () => {
        if (!data.flows?.length) return null;
        const panel = element("section", "flow-panel");
        panel.setAttribute("aria-label", "Screen flows");
        panel.append(element("div", "meta-label", "Screen flows"));
        const list = element("ul", "flow-list");
        data.flows.forEach((flow) => {
          const item = element("li");
          item.append(
            flowTarget(flow.from),
            element("span", "", ` — select “${flow.trigger}”: ${flowDescription(flow)} `),
            flowTarget(destinationSurface(flow), flow.destination?.state)
          );
          list.append(item);
        });
        panel.append(list);
        return panel;
      };

      const renderOverview = () => {
        content.replaceChildren();
        const grid = element("div", "overview-grid");
        data.screens.forEach((screen) => {
          const card = element("article", "overview-card");
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `Open ${screen.id} ${screen.name}`);
          card.append(
            element("h2", "", screen.name),
            element("div", "eyebrow", `${screen.id} · ${screen.route}`),
            element("p", "", screen.goal),
            element("span", "copy-status", `Copy ${screen.copyStatus || "legacy"}`)
          );
          const mini = element("div", "mini-layout");
          screen.regions.forEach((region) => {
            const miniRegion = element("div", "mini-region", region.section);
            miniRegion.style.setProperty("--span", String(region.span || 12));
            mini.append(miniRegion);
          });
          card.append(mini);
          const open = () => selectPage(screen.id);
          card.addEventListener("click", open);
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          });
          grid.append(card);
        });
        content.append(grid);
        const flows = renderOverviewFlows();
        if (flows) content.append(flows);
      };

      const render = () => {
        if (!["overview"].includes(state.page) && !currentScreen()) state.page = data.screens[0].id;
        renderNavigation();
        renderResponsiveControls();
        const screen = currentScreen();
        renderStateControls(screen);
        responsiveControls.parentElement.hidden = false;
        stateControls.parentElement.hidden = false;
        annotationToggle.disabled = false;
        if (screen) {
          saveSelection(screen, state.responsiveTarget, state.screenState);
          renderScreen(screen);
        } else renderOverview();
      };

      annotationToggle.addEventListener("click", () => {
        const enabled = document.body.dataset.annotations !== "true";
        document.body.dataset.annotations = String(enabled);
        annotationToggle.setAttribute("aria-pressed", String(enabled));
        annotationToggle.textContent = enabled ? "Hide annotations" : "Show annotations";
        if (!enabled) setInspectorOpen(false);
        const screen = currentScreen();
        if (screen) renderScreen(screen);
        annotationToggle.focus({preventScroll: true});
      });

      inspectorClose.addEventListener("click", () => setInspectorOpen(false));
      inspectorBackdrop.addEventListener("click", () => setInspectorOpen(false));
      copyInventoryButton.addEventListener("click", () => {
        renderCopyInventory();
        copyInventory.showModal();
      });
      copyInventoryClose.addEventListener("click", () => copyInventory.close());
      copyInventory.addEventListener("click", (event) => {
        if (event.target === copyInventory) copyInventory.close();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.inspectorOpen) setInspectorOpen(false);
      });

      window.addEventListener("hashchange", () => {
        state.page = resolvePage(location.hash);
        const screen = currentScreen();
        if (screen) {
          const responsive = responsiveSpecFor(screen);
          const saved = readSelection(screen);
          state.responsiveTarget = responsive.targets.includes(String(saved.target)) ? String(saved.target)
            : responsive.targets.includes(String(state.responsiveTarget)) ? String(state.responsiveTarget)
            : responsive.targets[responsive.targets.length - 1];
        }
        if (screen) {
          const rememberedState = state.screenStates[screen.id] || readSelection(screen).screenState;
          state.screenState = screen.states?.some((item) => item.id === rememberedState)
            ? rememberedState
            : screen.states?.[0]?.id || "ready";
        } else {
          state.screenState = "ready";
        }
        state.selectedRegion = null;
        setInspectorOpen(false);
        render();
      });

      window.addEventListener("resize", () => {
        const screen = currentScreen();
        if (screen) renderScreen(screen);
      });

      render();
    })();
  </script>
</body>
</html>
