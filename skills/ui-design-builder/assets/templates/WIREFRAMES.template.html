  <style>
    :root {
      color-scheme: light;
      --paper: #f4f4f4;
      --panel: #ffffff;
      --panel-subtle: #f0f0f0;
      --ink: #1a1a1a;
      --muted: #6d6d6d;
      --line: #dadada;
      --line-strong: #a4a4a4;
      --mark: #ebebeb;
      --accent: #4e4e4e;
      --accent-soft: #ebebeb;
      --focus: #4e4e4e;
      --success: #545454;
      --danger: #505050;
      --sidebar: 18rem;
      --radius: 14px;
      --radius-small: 9px;
      --shadow: 0 18px 48px rgb(23 23 23 / 10%);
      /* Prototype values only. The reviewer chrome has its own variables above. */
      --wf-ink: #1a1a1a;
      --wf-support: #4f4f4f;
      --wf-muted: #6d6d6d;
      --wf-surface: #ffffff;
      --wf-line: #dadada;
      --wf-control-line: #262626;
      --wf-hover: #f0f0f0;
      --wf-primary-hover: #333333;
      --wf-table-head: #f5f5f5;
      --wf-body: 14px;
      --wf-section: 22px;
      --wf-item: 17px;
      --wf-label: 12px;
      --wf-display: clamp(20px, 2.2vw, 32px);
      --wf-editorial: clamp(28px, 5cqi, 48px);
      --wf-content-title: 26px;
      --wf-body-leading: 1.65;
      --wf-heading-leading: 1.2;
      --wf-heading-weight: 720;
      --wf-small-gap: 8px;
      --wf-content-gap: 16px;
      --wf-column-gap: 24px;
      --wf-row-gap: 28px;
      --wf-control-height: 44px;
      --wf-button-padding: 8px 12px;
      --wf-field-padding: 10px 12px;
      --wf-button-radius: 9px;
      --wf-field-radius: 5px;
      --wf-font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --wf-control-border: 1px;
      --wf-control-height-large: 52px;
      --wf-button-large-padding: 12px 20px;
      --wf-table-padding: 14px 10px;
      --wf-table-compact-padding: 10px 6px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button { font: inherit; }

    ::selection { background: var(--accent-soft); color: var(--ink); }

    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app {
      display: block;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 6;
      width: var(--sidebar);
      height: 100vh;
      overflow: auto;
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: #fafafa;
    }

    .eyebrow,
    .meta-label,
    .section-kind {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .sidebar-meta {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .page-list {
      display: grid;
      gap: 6px;
    }

    .page-button {
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: var(--radius-small);
      text-align: left;
      cursor: pointer;
    }

    .page-button:hover { border-color: var(--line); background: var(--panel-subtle); }

    .page-button[aria-current="page"] {
      border-color: #d5d5d5;
      background: var(--accent-soft);
    }

    .page-button[aria-current="page"] span { color: #4e4e4e; }

    .page-button strong,
    .page-button span { display: block; }

    .page-button span {
      margin-top: 3px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .platform-group { margin-top: 14px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .platform-group:first-child { margin-top: 0; }

    .sidebar-controls {
      display: grid;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .sidebar-controls .toolbar-cluster {
      display: grid;
      align-items: start;
      gap: 8px;
    }

    .sidebar-controls .control-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .sidebar-controls .control {
      min-width: 0;
      padding-inline: 8px;
      font-size: 12px;
    }

    .main {
      min-width: 0;
      margin-left: var(--review-sidebar-width);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--line);
      background: rgb(249 249 249 / 96%);
      backdrop-filter: blur(14px);
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toolbar-cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .toolbar-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .control {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .control:hover { border-color: var(--line-strong); }

    .control[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .content {
      padding: 38px 32px 64px;
      overflow-x: auto;
    }

    .screen-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(15rem, 0.55fr);
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto 28px;
    }

    .screen-header h2 {
      margin: 4px 0 8px;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .screen-header p { margin: 0; color: var(--muted); }

    .metadata {
      display: grid;
      grid-template-columns: auto 1fr;
      align-content: start;
      gap: 6px 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 24px rgb(23 23 23 / 6%);
    }

    .canvas-shell {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 0;
      border: 0;
      outline: 1px solid #cfcfcf;
      border-radius: 8px;
      background: #e6e6e6;
      box-shadow: var(--shadow);
    }

    .wireframe {
      font-family: var(--wf-font-family);
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: var(--wf-canvas-gap, var(--wf-row-gap)) var(--wf-canvas-gap, var(--wf-column-gap));
      min-height: 0;
      padding: var(--wf-canvas-padding, var(--wf-column-gap));
      container-type: inline-size;
      border: 1px solid #c4c4c4;
      border-radius: var(--radius);
      background: var(--panel);
    }

    .region {
      grid-column: span var(--span, 12);
      min-width: 0;
      min-height: 0;
      padding: var(--wf-region-padding, 8px 0);
      border: 0;
      background: transparent;
      overflow-wrap: anywhere;
    }

    .region[data-priority="quiet"] { color: var(--muted); }

    .region-head {
      display: none;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .region-head h3 { margin: 2px 0 0; font-size: 13px; letter-spacing: -0.01em; }

    .priority {
      flex: 0 0 auto;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-subtle);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .product-copy {
      display: grid;
      align-content: start;
      gap: var(--wf-region-gap, var(--wf-content-gap));
      font-size: var(--wf-body);
      padding-top: 0;
      max-width: var(--wf-region-max-width, none);
    }

    .region[data-actions-placement="before"] .action-list { order: -1; }
    .region[data-actions-placement="inline"] .product-copy {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }
    .region[data-actions-placement="inline"] .action-list {
      grid-column: 2;
      grid-row: 1 / -1;
      align-self: start;
    }

    .copy-item {
      display: block;
      margin: 0;
      max-width: 68ch;
      color: var(--wf-ink);
    }

    .copy-item[data-copy-kind="dynamic"] {
      width: fit-content;
      padding: 0;
      font-variant-numeric: tabular-nums;
    }

    .copy-item[data-copy-category="display"] {
      max-width: 22ch;
      font-size: var(--wf-display);
      font-weight: var(--wf-heading-weight);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .copy-item[data-copy-category="section-heading"] {
      max-width: 30ch;
      font-size: var(--wf-section);
      font-weight: var(--wf-heading-weight);
      line-height: var(--wf-heading-leading);
      letter-spacing: -0.025em;
    }

    .copy-item[data-copy-category="item-heading"] {
      max-width: 36ch;
      font-size: var(--wf-item);
      font-weight: 700;
      line-height: 1.25;
    }

    .copy-item[data-copy-role*="body"],
    .copy-item[data-copy-role*="support"] { color: var(--wf-support); line-height: var(--wf-body-leading); }

    .copy-item[data-copy-role*="label"],
    .copy-item[data-copy-role*="eyebrow"] {
      color: var(--wf-muted);
      font-size: var(--wf-label);
      font-weight: 700;
    }

    .copy-item[data-copy-role*="metric"],
    .copy-item[data-copy-role*="balance"],
    .copy-item[data-copy-role*="amount"] {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .state-note {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #d4d4d4;
      border-radius: var(--radius-small);
      background: var(--accent-soft);
      color: #434343;
    }

    .media-placeholder, .copy-item[data-copy-role="media placeholder"] {
      display: grid;
      place-items: center;
      min-height: 88px;
      margin-top: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      aspect-ratio: var(--wf-media-aspect-ratio, auto);
    }

    .layout-qa {
      max-width: 1200px;
      margin: 14px auto 0;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel);
      color: var(--muted);
    }

    .layout-qa[data-layout-qa="pass"] { border-color: #c0c0c0; color: var(--success); }
    .layout-qa[data-layout-qa="fail"] { border-color: #b3b3b3; color: var(--danger); }

    .display-contract {
      display: grid;
      gap: 2px;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
      color: var(--muted);
      font-size: 12px;
    }

    .flow-panel {
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .flow-panel > .meta-label { display: block; margin-bottom: 8px; }

    .flow-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .flow-list li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .flow-direction {
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .flow-target {
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    button.flow-target { cursor: pointer; }

    .action-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0 0;
    }

    .action-button {
      font-family: var(--wf-font-family);
      font-size: var(--wf-body);
      min-height: var(--wf-control-height);
      padding: var(--wf-button-padding);
      border: var(--wf-control-border) solid var(--wf-control-line);
      border-radius: var(--wf-button-radius);
      background: var(--wf-surface);
      color: var(--wf-ink);
      cursor: pointer;
    }

    .navigation-toggle { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
    .navigation-toggle:focus-visible { outline: 2px solid var(--wf-ink); outline-offset: 3px; }
    .navigation-disclosure[open] > .product-copy { margin-block-start: 12px; }
    .copy-language { display: block; line-height: 1.55; overflow-wrap: anywhere; }
    .copy-language + .copy-language { margin-block-start: 0.25em; }
    .motion-annotation { display: none; padding: 12px; border: 1px dashed var(--line-strong); font-size: 13px; }
    .motion-annotation p { margin: 4px 0; }
    body[data-annotations="true"] .motion-annotation { display: block; }
    body[data-annotations="true"] .region[data-motion-region="true"] { outline: 2px dashed var(--wf-ink); }
    .action-button[data-emphasis="tertiary"] { border-color: transparent; background: transparent; text-decoration: underline; }
    .action-button[data-emphasis="destructive"] { border: 2px dashed currentColor; font-weight: 700; }
    .action-button[data-size="large"] { min-height: var(--wf-control-height-large); padding: var(--wf-button-large-padding); }
    .action-button[data-full-width="true"] { flex-basis: 100%; width: 100%; }
    .action-button:focus-visible { outline: 2px solid var(--wf-ink); outline-offset: 3px; }
    .action-button:active { box-shadow: inset 0 0 0 2px currentColor; }
    .action-button:hover { background: var(--wf-hover); }
    .action-button[data-emphasis="primary"] { background: var(--wf-ink); color: var(--wf-surface); }
    .action-button[data-emphasis="primary"]:hover { background: var(--wf-primary-hover); }

    .product-tablist { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--wf-small-gap); }
    .product-tab { min-height: var(--wf-control-height); padding: var(--wf-button-padding); border: 1px solid var(--wf-line); background: transparent; color: var(--wf-ink); border-radius: var(--wf-button-radius); cursor: pointer; }
    .product-tab[aria-selected="true"] { border-color: var(--wf-ink); background: var(--wf-hover); font-weight: 700; }
    .product-tab:focus-visible { outline: 2px solid var(--wf-ink); outline-offset: 3px; }
    .nav-toggle { display: flex; align-items: center; gap: 8px; min-height: var(--wf-control-height); padding: var(--wf-button-padding); border: 1px solid var(--wf-line); background: transparent; color: var(--wf-ink); border-radius: var(--wf-button-radius); cursor: pointer; }
    .nav-toggle[aria-expanded="true"] { border-color: var(--wf-ink); background: var(--wf-hover); }
    .nav-toggle:focus-visible { outline: 2px solid var(--wf-ink); outline-offset: 3px; }
    .nav-toggle .menu-icon { font-weight: 700; }

    .action-feedback {
      min-height: 1.5em;
      margin: 4px 0 10px;
      color: var(--success);
      font-size: 12px;
    }

    .flow-dialog {
      width: auto;
      max-width: calc(100vw - 32px);
      max-height: 88vh;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .flow-dialog::backdrop { background: rgb(32 32 32 / 45%); }

    .flow-dialog-body { padding: 20px; }
    .flow-dialog-body h2 { margin: 5px 0 8px; }
    .flow-dialog-body ul { margin: 14px 0; padding-left: 20px; }
    .flow-dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 18px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .overview-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 22px rgb(23 23 23 / 5%);
      cursor: pointer;
    }

    .overview-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }

    .overview-card h2 { margin: 5px 0 3px; font-size: 18px; }
    .overview-card p { margin: 0 0 12px; color: var(--muted); }

    .mini-layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .mini-region {
      grid-column: span var(--span, 12);
      min-height: 44px;
      padding: 5px;
      border: 1px solid #c3c3c3;
      border-radius: 5px;
      background: #ffffff;
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
    }

    .empty-state {
      max-width: 720px;
      margin: 80px auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .review-trigger {
      min-height: 32px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .review-trigger:hover { border-color: var(--line-strong); color: var(--ink); }

    .inspector-backdrop {
      position: fixed;
      inset: 68px 0 0;
      z-index: 9;
      border: 0;
      background: rgb(21 21 21 / 18%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }

    .inspector-backdrop[data-open="true"] { opacity: 1; pointer-events: auto; }

    .inspector {
      position: fixed;
      top: 68px;
      right: 0;
      bottom: 0;
      z-index: 10;
      width: min(390px, 100vw);
      padding: 24px;
      border-left: 1px solid var(--line);
      background: var(--panel);
      box-shadow: -18px 0 48px rgb(23 23 23 / 12%);
      overflow: auto;
      transform: translateX(100%);
      transition: transform 180ms ease;
    }

    .inspector[data-open="true"] { transform: translateX(0); }

    .inspector-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .inspector h2 { margin: 2px 0 0; font-size: 22px; letter-spacing: -0.025em; }
    .inspector h3 { margin: 22px 0 8px; font-size: 14px; }
    .inspector p { color: var(--muted); }
    .inspector ul { margin: 8px 0; padding-left: 18px; }

    .inspector-card {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
      background: var(--panel-subtle);
    }

    .copy-status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .copy-dialog {
      width: min(92vw, 880px);
      max-height: 86vh;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .copy-dialog::backdrop { background: rgb(21 21 21 / 42%); }
    .copy-dialog-body { padding: 24px; }
    .copy-dialog-head { display: flex; justify-content: space-between; gap: 16px; }
    .copy-dialog h2 { margin: 0; font-size: 26px; letter-spacing: -0.035em; }
    .copy-dialog-head p { margin: 5px 0 0; color: var(--muted); }
    .copy-inventory-list { display: grid; gap: 10px; margin-top: 20px; }

    .copy-record {
      display: grid;
      grid-template-columns: minmax(9rem, .35fr) minmax(0, 1fr);
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-small);
    }

    .copy-record p { margin: 4px 0 0; }
    .copy-record code { font-size: 11px; color: var(--muted); }

    .noscript {
      margin: 20px;
      padding: 16px;
      border: 2px solid #3c3c3c;
      background: #ffffff;
    }

    @media (max-width: 820px) {
      .app { display: block; }
      :root { --sidebar: 220px; }
      .toolbar { position: static; }
      .content { padding: 20px 12px; }
      .screen-header { grid-template-columns: 1fr; }
      .inspector { top: 0; }
      .inspector-backdrop { inset: 0; }
      .copy-record { grid-template-columns: 1fr; }
    }


    .metadata, .flow-panel { display: none; }
    .screen-header { grid-template-columns: 1fr; }
    .action-feedback:empty { display: none; }
    .region[data-presentation="navigation"] { border-bottom: 1px solid var(--line); padding-bottom: var(--wf-region-padding, 20px); }
    .region[data-presentation="navigation"] .product-copy { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wf-region-gap, 20px); }
    .region[data-presentation="navigation"] .action-list { margin-left: auto; }
    .region[data-presentation="navigation"] .copy-item[data-copy-role="brand"] { font-size: 20px; font-weight: 700; }
    .region[data-presentation="editorial"] { padding-block: var(--wf-region-padding, 28px); }
    .region[data-presentation="editorial"] .copy-item[data-copy-category="display"] { font-size: var(--wf-editorial); max-width: 22ch; line-height: 1.15; }
    .region[data-presentation="content"] .copy-item[data-copy-category="display"] { font-size: var(--wf-content-title); }
    .content-list {
      display: grid;
      grid-template-columns: repeat(var(--wf-item-columns, 1), minmax(0, 1fr));
      gap: 0 var(--wf-region-gap, var(--wf-content-gap));
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .content-list li { padding: var(--wf-content-gap) 0; border-bottom: 1px solid var(--wf-line); }
    .content-table { border-collapse: collapse; table-layout: fixed; width: 100%; text-align: left; }
    .content-table th, .content-table td { padding: var(--wf-table-padding); border-bottom: 1px solid var(--wf-line); vertical-align: top; overflow-wrap: anywhere; }
    .content-table th { font-weight: 600; background: var(--wf-table-head); }
    .content-table .copy-item { font-size: var(--wf-body); }
    .form-field { display: grid; gap: var(--wf-small-gap); max-width: 40rem; }
    .field-input { width: 100%; min-width: 0; min-height: var(--wf-control-height); border: var(--wf-control-border) solid var(--wf-control-line); border-radius: var(--wf-field-radius); padding: var(--wf-field-padding); font: inherit; color: var(--wf-ink); background: var(--wf-surface); }
    .form-field .copy-item[data-copy-role="field label"] { font-size: 14px; color: var(--ink); font-weight: 600; }
    .field-input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .local-search-controls { display: grid; gap: var(--wf-content-gap); max-width: 40rem; }
    .local-search-controls .form-field { max-width: none; }
    .local-search-controls .action-list { margin-top: 2px; }
    .local-search-results { display: grid; gap: 0; }
    .local-search-results li { padding: var(--wf-content-gap) 0; border-bottom: 1px solid var(--wf-line); }
    body[data-annotations="true"] .region-head { display: flex; flex-wrap: wrap; margin-bottom: 16px; }
    .region-notes { display: none; margin-top: 32px; max-width: 1200px; margin-inline: auto; }
    body[data-annotations="true"] .region-notes { display: block; }
    .region-note { padding: 20px 0; border-top: 1px solid var(--line-strong); }
    .region-note h3 { margin: 0 0 8px; }
    .region-note p { max-width: 78ch; margin: 8px 0; }
    .region-note dl { display: grid; grid-template-columns: minmax(100px, 180px) minmax(0, 1fr); gap: 8px 16px; }
    .region-note dt { font-weight: 650; }
    .region-note dd { margin: 0; overflow-wrap: anywhere; }
    body[data-annotations="true"] .region { outline: 1px dashed var(--line-strong); outline-offset: 5px; }
    body[data-annotations="true"] .region:focus { outline: 2px solid var(--wf-ink); }
    body[data-annotations="true"] .metadata { display: grid; }
    body[data-annotations="true"] .flow-panel { display: block; }
    .toolbar-cluster[hidden] { display: none; }
    @container (max-width: 480px) {
      .region[data-presentation="navigation"] .product-copy { gap: 12px; }
      .region[data-presentation="navigation"] .action-list { margin-left: 0; flex-basis: 100%; }
      .content-table th, .content-table td { padding: var(--wf-table-compact-padding); }
    }

    @media print {
      .sidebar, .toolbar, .inspector, .inspector-backdrop, .copy-dialog { display: none; }
      .app { display: block; }
      .main { margin-left: 0; }
      .content { padding: 0; }
      .canvas-shell { width: 100%; border: 0; padding: 0; }
      .wireframe { min-height: 0; }
    }
  </style>
</head>
