<!doctype html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; navigate-to 'self'; img-src data:; media-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive design review example</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:#243447;background:#f7f9fc;display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{grid-column:1;grid-row:1;padding:24px;background:#e9eef6;border-right:1px solid #c9d2df}aside a{display:block;padding:9px 0}main,[data-hifi-panel]{grid-column:2;grid-row:1;padding:40px;max-width:850px}h1{font-size:36px;line-height:1.15}button,input{font:inherit;padding:10px;margin:8px 8px 8px 0}button{cursor:pointer;background:white;border:1px solid #869bb6;border-radius:5px}input{max-width:100%;border:1px solid #869bb6}a{color:#234f8a}label{display:block}output{display:block;font-family:monospace}dialog{border:1px solid #869bb6;border-radius:8px;padding:24px;max-width:90vw}[hidden]{display:none!important}:focus-visible{outline:3px solid #547cbe;outline-offset:3px}[data-hifi-spec]{border-bottom:1px solid #c9d2df;padding:16px 0}@media(max-width:600px){body{grid-template-columns:120px 1fr}aside{padding:12px;font-size:14px}main,[data-hifi-panel]{padding:20px}h1{font-size:26px}}</style><style>:root{--ink:#243447}.product-button,.product-feedback{color:var(--ink)}</style></head><body><main data-ui-surface="UI-002" data-ui-route="/details" data-state="ready"><h1 tabindex="-1">Project details</h1><a data-navigation-id="back" href="index.html">Back to workspace</a><button class="product-button" data-control-id="refresh" id="refresh">Refresh details</button><p class="product-feedback" id="feedback">Ready to inspect.</p><span hidden data-state="ready" data-responsive-target="390"></span><span hidden data-state="ready" data-responsive-target="768"></span><span hidden data-state="ready" data-responsive-target="1200"></span><span hidden data-state="updated" data-responsive-target="390"></span><span hidden data-state="updated" data-responsive-target="768"></span><span hidden data-state="updated" data-responsive-target="1200"></span></main><script>
const main=document.querySelector('[data-ui-surface]');
function review(){const key=location.hash.slice(1);const panel=Array.from(document.querySelectorAll("[data-hifi-panel]")).find(node=>node.dataset.hifiPanel===key);document.querySelectorAll('[data-hifi-panel]').forEach(node=>node.hidden=node!==panel);main.hidden=!!panel;if(panel)panel.querySelector('h1').focus();else if(location.hash)main.querySelector('h1').focus();if(key==='design-tokens')document.querySelectorAll('[data-hifi-spec]').forEach(node=>{const source=document.querySelector(node.dataset.source);const value=getComputedStyle(source).getPropertyValue(node.dataset.property).trim();node.querySelector('output').textContent=value;node.style.setProperty(node.dataset.property,value);});}
window.addEventListener('hashchange',review);window.addEventListener('DOMContentLoaded',review);
</script><script>document.getElementById('refresh').addEventListener('click',()=>{main.dataset.state='updated';document.getElementById('feedback').textContent='Details updated.';});</script><!-- reviewer:start --><aside data-hifi-reviewer-shell><a data-hifi-review-view="overview" href="index.html#overview">Overview</a><nav data-hifi-page-nav><a href="index.html">index.html</a><a href="details.html">details.html</a></nav><a data-hifi-review-view="design-tokens" href="index.html#design-tokens">Design Tokens</a></aside><!-- reviewer:end --></body></html>
