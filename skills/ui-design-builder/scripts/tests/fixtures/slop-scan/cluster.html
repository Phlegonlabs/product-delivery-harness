<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launchpad</title>
<style>
:root{--grad:linear-gradient(135deg,#7c3aed,#4f46e5)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--grad)}
.panel{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 8px 32px rgba(124,58,237,.35)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
</style>
</head>
<body>
<div class="panel"><h1>Ship faster</h1></div>
<div class="features"><div>One</div><div>Two</div><div>Three</div></div>
<button>🚀 Get started</button>
</body>
</html>
