<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor ledger</title>
<style>
:root{--ink:#1d2433;--paper:#fbfbfa;--accent:#0b6e4f}
body{margin:0;font-family:"Fraunces",Georgia,serif;color:var(--ink);background:var(--paper)}
h1{font-family:"Fraunces",Georgia,serif;font-size:40px;margin:0 0 12px}
main{display:grid;grid-template-columns:2fr 1fr;gap:24px;padding:48px}
.entry{border:1px solid #d9dde3;border-radius:4px;padding:16px}
.total{color:var(--accent);font-variant-numeric:tabular-nums}
button{border-radius:999px;padding:8px 16px;background:var(--accent);color:#fff}
</style>
</head>
<body>
<main>
<section><h1>Harbor ledger</h1><p class="entry">Docked at 06:40. Cargo cleared.</p></section>
<aside><p class="total">12 vessels in port</p><button>Export</button></aside>
</main>
</body>
</html>
